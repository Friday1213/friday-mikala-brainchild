<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>✦ Blaze Shooter</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0d0010;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      font-family: 'Nunito', sans-serif;
      color: #f0e6ff;
      overflow: hidden;
      user-select: none;
    }
    #stars { position:fixed; inset:0; pointer-events:none; z-index:0; overflow:hidden; }
    .star {
      position:absolute; border-radius:50%; background:white;
      animation: twinkle var(--d) ease-in-out infinite alternate;
    }
    @keyframes twinkle { from{opacity:var(--o);} to{opacity:calc(var(--o)*0.12);} }

    /* Overlays */
    .overlay {
      display:none; position:fixed; inset:0; z-index:100;
      align-items:center; justify-content:center;
      background:rgba(13,0,16,0.92); backdrop-filter:blur(6px);
    }
    .overlay.show { display:flex; }
    .obox {
      background:linear-gradient(145deg,rgba(35,10,60,0.97),rgba(10,0,25,0.97));
      border:1px solid rgba(200,150,255,0.2);
      border-radius:28px; padding:36px 30px; text-align:center;
      box-shadow:0 0 80px rgba(180,100,255,0.12); max-width:340px; width:92%;
    }
    .obox h1 { font-size:28px; font-weight:900; margin-bottom:6px; color:#cc44ff; }
    .obox p  { font-size:13px; color:#94a3b8; margin-bottom:20px; line-height:1.55; }

    .nm-input {
      width:100%; padding:12px 16px; border-radius:12px;
      border:2px solid rgba(200,150,255,0.3);
      background:rgba(255,255,255,0.06); color:#f0e6ff;
      font-family:'Nunito',sans-serif; font-size:15px; font-weight:700;
      outline:none; text-align:center; margin-bottom:14px; transition:border-color 0.2s;
    }
    .nm-input:focus { border-color:#cc44ff; }
    .nm-input::placeholder { color:#555; }

    .obtn {
      width:100%; padding:12px; border:none; border-radius:12px; margin-bottom:10px;
      background:linear-gradient(135deg,#cc33ff,#7c3aed);
      color:white; font-family:'Nunito',sans-serif; font-weight:900;
      font-size:15px; cursor:pointer; transition:opacity 0.2s;
      box-shadow:0 4px 20px rgba(180,100,255,0.3);
    }
    .obtn:last-child { margin-bottom:0; }
    .obtn:hover { opacity:0.85; }
    .obtn.ghost {
      background:rgba(255,255,255,0.07); box-shadow:none;
      border:1px solid rgba(255,255,255,0.13); color:#d4b0ff;
    }
    .obtn.danger { background:rgba(180,30,30,0.4); box-shadow:none;
      border:1px solid rgba(255,80,80,0.2); color:#ff8888; font-size:12px; }

    /* Game layout */
    #game-ui {
      position:relative; z-index:5;
      display:flex; flex-direction:column; align-items:center; width:100%;
    }
    #topbar {
      width:100%; max-width:460px;
      display:flex; align-items:center; justify-content:space-between;
      padding:10px 16px 6px;
    }
    .tbtn {
      background:rgba(255,255,255,0.07); border:1px solid rgba(255,255,255,0.13);
      color:#d4b0ff; border-radius:20px; padding:6px 13px;
      font-family:'Nunito',sans-serif; font-weight:800; font-size:12px;
      cursor:pointer; transition:background 0.2s; text-decoration:none;
    }
    .tbtn:hover { background:rgba(255,255,255,0.14); }
    .tbtn.cb-on { background:linear-gradient(135deg,#1d4ed8,#7c3aed); border-color:transparent; color:white; }
    #scorebar {
      width:100%; max-width:460px;
      display:flex; align-items:center; justify-content:space-between;
      padding:0 16px 8px; gap:6px;
    }
    .spill {
      background:rgba(255,255,255,0.07); border:1px solid rgba(255,255,255,0.12);
      border-radius:20px; padding:4px 12px; font-size:13px; font-weight:900; white-space:nowrap;
    }

    /* Canvas wrapper — fixed size, CSS scaled */
    #cw {
      position:relative;
      transform-origin:top center;
    }
    canvas { display:block; cursor:crosshair; touch-action:none; }

    #next-row {
      width:100%; max-width:460px;
      display:flex; align-items:center; justify-content:center;
      gap:14px; padding:6px 16px 8px;
      font-size:12px; font-weight:700; color:#94a3b8;
    }

    /* Float score pop */
    .float-score {
      position:fixed; font-weight:900; font-size:17px; pointer-events:none; z-index:20;
      animation:floatUp 0.85s ease forwards;
    }
    @keyframes floatUp {
      0%  { opacity:1; transform:translateY(0) scale(1); }
      100%{ opacity:0; transform:translateY(-55px) scale(1.35); }
    }

    /* Leaderboard */
    .lb-table { width:100%; border-collapse:collapse; margin:8px 0; }
    .lb-table th { font-size:10px; color:#555; text-transform:uppercase; letter-spacing:.06em;
      padding:5px 6px; border-bottom:1px solid rgba(255,255,255,0.06); text-align:left; }
    .lb-table td { padding:8px 6px; font-size:13px; font-weight:700; }
    .lb-table tr:not(:last-child) td { border-bottom:1px solid rgba(255,255,255,0.04); }
    .lb-me td { color:#cc44ff; }
    .lb-empty { text-align:center; color:#475569; padding:22px; font-size:13px; }
  </style>
</head>
<body>

<div id="stars"></div>

<!-- START SCREEN -->
<div class="overlay show" id="ov-start">
  <div class="obox">
    <div style="font-size:52px;margin-bottom:10px;">🔥</div>
    <h1>Blaze Shooter</h1>
    <p>Shoot matching bubbles to blast them.<br>Aim for combos — don't let the grid drop!</p>
    <input class="nm-input" id="nm" type="text" maxlength="18"
      placeholder="Enter your name…" autocomplete="off" spellcheck="false"/>
    <button class="obtn" onclick="startFromName()">▶ Play</button>
    <button class="obtn ghost" onclick="openLB('start')">🏆 Leaderboard</button>
    <button class="obtn ghost" onclick="location.href='index.html'">← Launchpad</button>
  </div>
</div>

<!-- LEADERBOARD -->
<div class="overlay" id="ov-lb">
  <div class="obox" style="max-width:360px;">
    <div style="font-size:38px;margin-bottom:8px;">🏆</div>
    <h1>Leaderboard</h1>
    <p style="margin-bottom:12px;">Top scores — this device</p>
    <div id="lb-body"></div>
    <button class="obtn" id="lb-play" onclick="closeLB()" style="margin-top:10px;">▶ Play</button>
    <button class="obtn ghost" id="lb-back" onclick="closeLB()">← Back</button>
    <button class="obtn danger" onclick="clearLB()">🗑 Clear All Scores</button>
  </div>
</div>

<!-- GAME OVER -->
<div class="overlay" id="ov-over">
  <div class="obox">
    <div id="ov-em" style="font-size:52px;margin-bottom:10px;">💥</div>
    <h1 id="ov-ttl">Game Over</h1>
    <p id="ov-sub"></p>
    <div id="ov-sc" style="font-size:44px;font-weight:900;color:#ffcc00;margin:8px 0 4px;"></div>
    <div id="ov-rank" style="font-size:13px;color:#cc44ff;font-weight:700;margin-bottom:18px;"></div>
    <div id="ov-nb" style="display:none;background:rgba(255,200,0,0.1);border:1px solid rgba(255,200,0,0.3);
      border-radius:12px;padding:10px;margin-bottom:16px;font-size:13px;color:#ffcc00;font-weight:800;">
      🌟 New Personal Best!
    </div>
    <button class="obtn" onclick="playAgain()">🔥 Play Again</button>
    <button class="obtn ghost" onclick="openLB('over')">🏆 Leaderboard</button>
    <button class="obtn ghost" onclick="location.href='index.html'" style="margin-bottom:0">← Launchpad</button>
  </div>
</div>

<!-- GAME UI -->
<div id="game-ui">
  <div id="topbar">
    <a class="tbtn" href="index.html">← Home</a>
    <div id="player-tag" style="font-size:13px;font-weight:900;color:#cc44ff;"></div>
    <button class="tbtn" id="cb-btn" onclick="toggleCB()">👁 Colorblind</button>
  </div>
  <div id="scorebar">
    <div class="spill" id="lv-el" style="color:#d4b0ff;">LVL 1</div>
    <div class="spill" id="sc-el" style="color:#ffcc00;">⭐ 0</div>
    <div class="spill" id="co-el" style="color:#ff6699;min-width:58px;text-align:center;"></div>
    <div class="spill" id="pb-el" style="color:#64748b;font-size:11px;"></div>
  </div>
  <div id="cw">
    <canvas id="gc"></canvas>
  </div>
  <div id="next-row">
    <span>NEXT →</span>
    <canvas id="nc"></canvas>
    <span style="color:#7c3aed;font-size:11px;">click / tap to shoot</span>
  </div>
</div>

<script>
'use strict';
// ═══════════════════════════════
// LEADERBOARD
// ═══════════════════════════════
const LS = 'blaze_lb_v2';
const getAll  = ()=>{ try{return JSON.parse(localStorage.getItem(LS))||[];}catch{return[];} };
const saveAll = a => localStorage.setItem(LS,JSON.stringify(a));
function recordScore(name,s,lv){
  const all=getAll();
  const ex=all.find(e=>e.n.toLowerCase()===name.toLowerCase());
  let nb=false;
  if(ex){ if(s>ex.s){ex.s=s;ex.lv=lv;nb=true;} ex.g=(ex.g||1)+1; }
  else  { all.push({n:name,s,lv,g:1}); nb=true; }
  all.sort((a,b)=>b.s-a.s); saveAll(all); return nb;
}
function getBest(name){ const e=getAll().find(e=>e.n.toLowerCase()===name.toLowerCase()); return e?e.s:0; }
function getRank(name){ const i=getAll().findIndex(e=>e.n.toLowerCase()===name.toLowerCase()); return i>=0?i+1:null; }
function esc(s){ return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

let lbFrom='start';
function openLB(from){
  lbFrom=from;
  const all=getAll(), m=['🥇','🥈','🥉'];
  let h='';
  if(!all.length) h='<div class="lb-empty">No scores yet — be the first! 🔥</div>';
  else {
    h='<table class="lb-table"><thead><tr><th>#</th><th>Player</th><th>Score</th><th>Lvl</th></tr></thead><tbody>';
    all.slice(0,12).forEach((e,i)=>{
      const me=player&&e.n.toLowerCase()===player.toLowerCase();
      h+=`<tr${me?' class="lb-me"':''}><td>${m[i]||i+1}</td><td>${esc(e.n)}${me?' ◀':''}</td>`
        +`<td style="color:#ffcc00;text-align:right;">⭐${e.s}</td><td style="color:#94a3b8;text-align:right;font-size:11px;">Lv${e.lv||1}</td></tr>`;
    });
    h+='</tbody></table>';
  }
  document.getElementById('lb-body').innerHTML=h;
  document.getElementById('lb-play').style.display=from==='start'?'block':'none';
  document.getElementById('lb-back').style.display=from==='over'?'block':'none';
  hide('ov-start'); hide('ov-over'); show('ov-lb');
}
function closeLB(){ hide('ov-lb'); if(lbFrom==='over') show('ov-over'); else show('ov-start'); }
function clearLB(){ if(confirm('Clear all scores?')){ localStorage.removeItem(LS); openLB(lbFrom); } }
function show(id){ document.getElementById(id).classList.add('show'); }
function hide(id){ document.getElementById(id).classList.remove('show'); }

// ═══════════════════════════════
// PLAYER / START
// ═══════════════════════════════
let player='';
document.getElementById('nm').addEventListener('keydown',e=>{ if(e.key==='Enter') startFromName(); });
function startFromName(){
  const v=document.getElementById('nm').value.trim();
  if(!v){ document.getElementById('nm').focus(); return; }
  player=v;
  document.getElementById('player-tag').textContent='🎮 '+v;
  hide('ov-start');
  initAndStart();
}
function playAgain(){ hide('ov-over'); initAndStart(); }

// ═══════════════════════════════
// CONSTANTS
// ═══════════════════════════════
const COLS=11, BALL_SPEED=11, MIN_MATCH=3, MISS_LIMIT=5;

const VIBRANT=[
  {fill:'#ff3366',hi:'#ff88aa',glow:'#ff0044'},
  {fill:'#33aaff',hi:'#88ccff',glow:'#0077ff'},
  {fill:'#44ff88',hi:'#aaffbb',glow:'#00cc55'},
  {fill:'#ffcc00',hi:'#ffe570',glow:'#cc8800'},
  {fill:'#cc44ff',hi:'#e088ff',glow:'#9900ff'},
  {fill:'#ff6633',hi:'#ffaa77',glow:'#cc3300'},
];
const CB_SAFE=[
  {fill:'#0077BB',hi:'#55aaee',glow:'#005599',shape:'circle'},
  {fill:'#EE7733',hi:'#ffaa66',glow:'#cc5500',shape:'square'},
  {fill:'#AA3377',hi:'#dd66aa',glow:'#771155',shape:'triangle'},
  {fill:'#009988',hi:'#44ccbb',glow:'#006655',shape:'star'},
  {fill:'#CCBB44',hi:'#eeee88',glow:'#999900',shape:'diamond'},
  {fill:'#EE3377',hi:'#ff77aa',glow:'#bb0044',shape:'cross'},
];

// ═══════════════════════════════
// CANVAS — fixed 440×620, CSS scaled
// ═══════════════════════════════
const CW=440, CH=620;
let gc, gctx, nc, nctx;
let R=18, D=36, ROW_H=31, GL=14, GT=14; // grid constants

function setupCanvas(){
  gc   = document.getElementById('gc');
  gctx = gc.getContext('2d');
  nc   = document.getElementById('nc');
  nctx = nc.getContext('2d');

  gc.width=CW; gc.height=CH;
  nc.width=D+4; nc.height=D+4;

  // CSS scale to fit screen
  const availH=window.innerHeight-170;
  const availW=window.innerWidth;
  const scale=Math.min(1,availH/CH,availW/CW);
  document.getElementById('cw').style.width  = (CW*scale)+'px';
  document.getElementById('cw').style.height = (CH*scale)+'px';
  gc.style.width  = (CW*scale)+'px';
  gc.style.height = (CH*scale)+'px';

  GL=Math.floor((CW-COLS*D)/2);
}
window.addEventListener('resize',setupCanvas);

// ═══════════════════════════════
// GAME STATE
// ═══════════════════════════════
let grid=[], flying=null;
let curC=0, nxtC=0;
let score=0, combo=0, misses=0, level=1, numColors=4;
let gameOn=false, animId=null, colorblind=false, palette=VIBRANT;
let particles=[];

function initAndStart(){
  grid=[]; particles=[]; flying=null;
  score=0; combo=0; misses=0; level=1; numColors=4;
  for(let i=0;i<7;i++) addRow(false);
  curC=rnd(); nxtC=rnd();
  gameOn=true;
  refreshUI();
  if(animId) cancelAnimationFrame(animId);
  loop();
}

// ═══════════════════════════════
// GRID
// ═══════════════════════════════
function cols(r){ return r%2===0?COLS:COLS-1; }
function bxy(r,c){
  return { x: GL+c*D+R+(r%2===0?0:R), y: GT+r*ROW_H+R };
}
function rnd(){ return Math.floor(Math.random()*numColors); }
function addRow(top){
  const row=[];
  const n=cols(top?0:grid.length);
  for(let i=0;i<n;i++) row.push(Math.random()<0.92?rnd():null);
  if(top) grid.unshift(row); else grid.push(row);
}
function nbrs(r,c){
  const ev=r%2===0;
  return [[r,c-1],[r,c+1],[r-1,ev?c-1:c],[r-1,ev?c:c+1],[r+1,ev?c-1:c],[r+1,ev?c:c+1]]
    .filter(([nr,nc])=>nr>=0&&nr<grid.length&&nc>=0&&nc<cols(nr));
}
function connected(r,c,ci,vis=new Set()){
  const k=`${r},${c}`;
  if(vis.has(k)||r<0||r>=grid.length||c<0||c>=cols(r)||grid[r][c]!==ci) return [];
  vis.add(k);
  return [[r,c],...nbrs(r,c).flatMap(([nr,nc])=>connected(nr,nc,ci,vis))];
}
function orphans(){
  const con=new Set(), q=[];
  for(let c=0;c<cols(0);c++) if(grid[0]&&grid[0][c]!=null){ con.add(`0,${c}`); q.push([0,c]); }
  while(q.length){ const [r,c]=q.shift(); nbrs(r,c).forEach(([nr,nc])=>{ const k=`${nr},${nc}`; if(!con.has(k)&&grid[nr]&&grid[nr][nc]!=null){con.add(k);q.push([nr,nc]);}}); }
  const res=[];
  for(let r=0;r<grid.length;r++) for(let c=0;c<cols(r);c++) if(grid[r][c]!=null&&!con.has(`${r},${c}`)) res.push([r,c]);
  return res;
}
function nearestEmpty(px,py){
  let best=null,bd=Infinity;
  for(let r=0;r<=Math.min(grid.length+1,22);r++){
    for(let c=0;c<cols(r);c++){
      if(r<grid.length&&grid[r][c]!=null) continue;
      const {x,y}=bxy(r,c); const d=Math.hypot(px-x,py-y);
      if(d<bd){bd=d;best=[r,c];}
    }
  }
  return best;
}

// ═══════════════════════════════
// PLACE BALL
// ═══════════════════════════════
function place(ball){
  const pos=nearestEmpty(ball.x,ball.y);
  if(!pos){flying=null;return;}
  let [r,c]=pos;
  while(r>=grid.length){ const row=[]; for(let i=0;i<cols(grid.length);i++) row.push(null); grid.push(row); }
  grid[r][c]=ball.colorIdx; flying=null;

  const matches=connected(r,c,ball.colorIdx);
  if(matches.length>=MIN_MATCH){
    combo++; const pts=matches.length*10*combo; score+=pts;
    matches.forEach(([mr,mc])=>{ const p=bxy(mr,mc); burst(p.x,p.y,grid[mr][mc]); grid[mr][mc]=null; });
    floatPts(pts,bxy(r,c));
    orphans().forEach(([or,oc])=>{ const p=bxy(or,oc); burst(p.x,p.y,grid[or][oc],6); score+=5; grid[or][oc]=null; });
    misses=0; checkLv();
  } else { combo=0; misses++; if(misses>=MISS_LIMIT){misses=0;addRow(true);} }

  while(grid.length>0&&grid[grid.length-1].every(v=>v==null)) grid.pop();

  // Game over check
  const danger=CH-60;
  for(let row=0;row<grid.length;row++)
    for(let col=0;col<cols(row);col++)
      if(grid[row][col]!=null&&bxy(row,col).y+R>=danger){ endGame(); return; }

  curC=nxtC; nxtC=rnd(); refreshUI();
}
function checkLv(){ if(score>=level*350){ level++; numColors=Math.min(6,4+Math.floor(level/3)); } }

// ═══════════════════════════════
// PARTICLES
// ═══════════════════════════════
function burst(x,y,ci,n=14){
  const col=palette[ci%palette.length];
  for(let i=0;i<n;i++){
    const a=Math.PI*2*i/n+Math.random()*.5, spd=2+Math.random()*5;
    particles.push({x,y,vx:Math.cos(a)*spd,vy:Math.sin(a)*spd-1,r:2+Math.random()*4,c:col.fill,life:1,d:.02+Math.random()*.02});
  }
}
function tickP(){ for(const p of particles){p.x+=p.vx;p.y+=p.vy;p.vy+=.12;p.r*=.96;p.life-=p.d;} particles=particles.filter(p=>p.life>0&&p.r>.2); }
function drawP(){
  for(const p of particles){
    gctx.save(); gctx.globalAlpha=p.life; gctx.fillStyle=p.c;
    gctx.shadowBlur=6; gctx.shadowColor=p.c;
    gctx.beginPath(); gctx.arc(p.x,p.y,p.r,0,Math.PI*2); gctx.fill();
    gctx.restore();
  }
}

// ═══════════════════════════════
// DRAW
// ═══════════════════════════════
function drawBubble(ctx,x,y,ci,fly=false){
  const col=palette[ci%palette.length];
  // Glow
  ctx.shadowBlur=fly?24:(colorblind?3:12);
  ctx.shadowColor=col.glow;
  // Gradient
  const g=ctx.createRadialGradient(x-R*.28,y-R*.32,R*.08,x,y,R-1);
  g.addColorStop(0,col.hi); g.addColorStop(.5,col.fill); g.addColorStop(1,col.glow);
  ctx.beginPath(); ctx.arc(x,y,R-1,0,Math.PI*2);
  ctx.fillStyle=g; ctx.fill(); ctx.shadowBlur=0;
  // Highlight
  ctx.beginPath(); ctx.arc(x-R*.28,y-R*.3,R*.28,0,Math.PI*2);
  ctx.fillStyle='rgba(255,255,255,0.35)'; ctx.fill();
  // Shape (colorblind mode)
  if(colorblind&&col.shape) drawShape(ctx,x,y,col.shape,R*.45);
}
function drawShape(ctx,x,y,sh,sz){
  ctx.save(); ctx.translate(x,y); ctx.fillStyle='rgba(255,255,255,0.9)'; ctx.beginPath();
  switch(sh){
    case 'circle':   ctx.arc(0,0,sz*.52,0,Math.PI*2); ctx.fill(); break;
    case 'square':   ctx.fillRect(-sz*.55,-sz*.55,sz*1.1,sz*1.1); break;
    case 'triangle': ctx.moveTo(0,-sz*.75);ctx.lineTo(sz*.62,sz*.5);ctx.lineTo(-sz*.62,sz*.5);ctx.closePath();ctx.fill(); break;
    case 'star':{ let a=-Math.PI/2,step=Math.PI/4,o=sz*.7,i=sz*.3;ctx.moveTo(Math.cos(a)*o,Math.sin(a)*o);for(let k=0;k<4;k++){a+=step;ctx.lineTo(Math.cos(a)*i,Math.sin(a)*i);a+=step;ctx.lineTo(Math.cos(a)*o,Math.sin(a)*o);}ctx.closePath();ctx.fill();break;}
    case 'diamond':  ctx.moveTo(0,-sz*.75);ctx.lineTo(sz*.52,0);ctx.lineTo(0,sz*.75);ctx.lineTo(-sz*.52,0);ctx.closePath();ctx.fill(); break;
    case 'cross':{ const t=sz*.22,s=sz*.65; ctx.fillRect(-t,-s,t*2,s*2);ctx.fillRect(-s,-t,s*2,t*2); break;}
  }
  ctx.restore();
}
function drawShooter(sx,sy,ang){
  // Aim line
  gctx.save(); gctx.setLineDash([6,6]); gctx.strokeStyle='rgba(255,255,255,0.18)'; gctx.lineWidth=1.5;
  gctx.beginPath(); gctx.moveTo(sx,sy);
  let lx=sx,ly=sy,lvx=Math.cos(ang)*100,lvy=Math.sin(ang)*100;
  for(let i=0;i<5;i++){
    let tx=lx+lvx,ty=ly+lvy;
    if(tx-R<0||tx+R>CW){lvx=-lvx;tx=lx+lvx;}
    if(ty<GT) break;
    gctx.lineTo(tx,ty); lx=tx;ly=ty;
  }
  gctx.stroke(); gctx.restore();
  // Barrel
  gctx.save(); gctx.strokeStyle='#d4b0ff'; gctx.lineWidth=R*.6; gctx.lineCap='round';
  gctx.shadowBlur=12; gctx.shadowColor='#cc33ff';
  gctx.beginPath(); gctx.moveTo(sx,sy); gctx.lineTo(sx+Math.cos(ang)*R*1.7,sy+Math.sin(ang)*R*1.7);
  gctx.stroke(); gctx.restore();
  drawBubble(gctx,sx,sy,curC,true);
}

// ═══════════════════════════════
// GAME LOOP
// ═══════════════════════════════
let aimAng=-Math.PI/2;
const SX=CW/2, SY=CH-55;

function loop(){
  if(!gameOn){animId=null;return;}
  try {
    // Background
    gctx.fillStyle='#0d0010'; gctx.fillRect(0,0,CW,CH);
    const bg=gctx.createLinearGradient(0,0,0,CH);
    bg.addColorStop(0,'rgba(180,100,255,0.04)'); bg.addColorStop(1,'rgba(0,0,0,0)');
    gctx.fillStyle=bg; gctx.fillRect(0,0,CW,CH);

    // Danger line
    gctx.save(); gctx.setLineDash([8,5]); gctx.strokeStyle='rgba(255,60,60,0.3)'; gctx.lineWidth=1.5;
    gctx.beginPath(); gctx.moveTo(0,CH-60); gctx.lineTo(CW,CH-60); gctx.stroke(); gctx.restore();

    // Grid
    for(let r=0;r<grid.length;r++)
      for(let c=0;c<cols(r);c++)
        if(grid[r][c]!=null){ const{x,y}=bxy(r,c); drawBubble(gctx,x,y,grid[r][c]); }

    // Flying ball
    if(flying){
      flying.x+=flying.vx; flying.y+=flying.vy;
      if(flying.x-R<0){flying.x=R;flying.vx=Math.abs(flying.vx);}
      if(flying.x+R>CW){flying.x=CW-R;flying.vx=-Math.abs(flying.vx);}
      if(flying.y-R<GT){flying.y=GT+R;place(flying);}
      else {
        let hit=false;
        for(let r=0;r<grid.length&&!hit;r++)
          for(let c=0;c<cols(r)&&!hit;c++)
            if(grid[r][c]!=null){const{x,y}=bxy(r,c);if(Math.hypot(flying.x-x,flying.y-y)<D-2){hit=true;place(flying);}}
        if(flying) drawBubble(gctx,flying.x,flying.y,flying.colorIdx,true);
      }
    }

    drawShooter(SX,SY,aimAng);
    tickP(); drawP();
  } catch(e){ console.error('Blaze loop error:',e); }
  animId=requestAnimationFrame(loop);
}

// ═══════════════════════════════
// SHOOT
// ═══════════════════════════════
function shoot(){
  if(flying||!gameOn) return;
  const a=Math.max(-Math.PI+.1,Math.min(-.1,aimAng));
  flying={x:SX,y:SY,vx:Math.cos(a)*BALL_SPEED,vy:Math.sin(a)*BALL_SPEED,colorIdx:curC};
}

// ═══════════════════════════════
// INPUT
// ═══════════════════════════════
function toAngle(ex,ey){
  const rect=gc.getBoundingClientRect();
  const scaleX=CW/rect.width, scaleY=CH/rect.height;
  const cx=(ex-rect.left)*scaleX, cy=(ey-rect.top)*scaleY;
  return Math.atan2(cy-SY,cx-SX);
}
gc.addEventListener('mousemove',e=>{ aimAng=toAngle(e.clientX,e.clientY); });
gc.addEventListener('click',e=>{ aimAng=toAngle(e.clientX,e.clientY); shoot(); });
let _t=null;
gc.addEventListener('touchstart',e=>{e.preventDefault();const t=e.touches[0];_t=t;aimAng=toAngle(t.clientX,t.clientY);},{passive:false});
gc.addEventListener('touchmove', e=>{e.preventDefault();const t=e.touches[0];aimAng=toAngle(t.clientX,t.clientY);},{passive:false});
gc.addEventListener('touchend',  e=>{e.preventDefault();if(_t){shoot();_t=null;}},{passive:false});

// ═══════════════════════════════
// COLORBLIND TOGGLE
// ═══════════════════════════════
function toggleCB(){
  colorblind=!colorblind; palette=colorblind?CB_SAFE:VIBRANT;
  const b=document.getElementById('cb-btn');
  b.textContent=colorblind?'🌈 Vibrant':'👁 Colorblind';
  b.classList.toggle('cb-on',colorblind);
}

// ═══════════════════════════════
// FLOAT SCORE
// ═══════════════════════════════
function floatPts(pts,{x,y}){
  const rect=gc.getBoundingClientRect();
  const sx=CW/rect.width; const sy=CH/rect.height;
  const el=document.createElement('div');
  el.className='float-score';
  el.textContent='+'+pts;
  el.style.left=(rect.left+x/sx-20)+'px';
  el.style.top =(rect.top +y/sy-20)+'px';
  el.style.color=combo>2?'#ff6699':'#ffcc00';
  document.body.appendChild(el);
  setTimeout(()=>el.remove(),900);
}

// ═══════════════════════════════
// UI
// ═══════════════════════════════
function refreshUI(){
  document.getElementById('lv-el').textContent=`LVL ${level}`;
  document.getElementById('sc-el').textContent=`⭐ ${score}`;
  document.getElementById('co-el').textContent=combo>1?`🔥 ×${combo}`:'';
  document.getElementById('pb-el').textContent=player&&getBest(player)?`PB ⭐${getBest(player)}`:'';
  nctx.clearRect(0,0,nc.width,nc.height);
  drawBubble(nctx,nc.width/2,nc.height/2,nxtC);
}

// ═══════════════════════════════
// GAME OVER
// ═══════════════════════════════
function endGame(){
  gameOn=false;
  const nb=player?recordScore(player,score,level):false;
  const rank=player?getRank(player):null;
  const m=['🥇','🥈','🥉'];
  document.getElementById('ov-em').textContent   = score>500?'🏆':score>200?'🎉':'💥';
  document.getElementById('ov-ttl').textContent  = 'Game Over';
  document.getElementById('ov-sub').textContent  = (player||'Player')+' · Level '+level;
  document.getElementById('ov-sc').textContent   = '⭐ '+score;
  document.getElementById('ov-rank').textContent = rank?`Ranked ${m[rank-1]||'#'+rank} on this device`:'';
  document.getElementById('ov-nb').style.display = nb?'block':'none';
  show('ov-over');
}

// ═══════════════════════════════
// STARS
// ═══════════════════════════════
function makeStars(){
  const w=document.getElementById('stars'); w.innerHTML='';
  for(let i=0;i<60;i++){
    const s=document.createElement('div'); s.className='star';
    const sz=(Math.random()*2+.5).toFixed(1);
    s.style.cssText=`width:${sz}px;height:${sz}px;left:${Math.random()*100}%;top:${Math.random()*100}%;--d:${(Math.random()*3+1.5).toFixed(1)}s;--o:${(Math.random()*.6+.2).toFixed(2)}`;
    w.appendChild(s);
  }
}

// ═══════════════════════════════
// BOOT
// ═══════════════════════════════
window.addEventListener('DOMContentLoaded',()=>{ makeStars(); setupCanvas(); });
</script>
