<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>✦ Blaze Shooter</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0d0010;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      font-family: 'Nunito', sans-serif;
      color: #f0e6ff;
      overflow: hidden;
      user-select: none;
    }

    /* Starfield */
    #stars {
      position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden;
    }
    .star {
      position: absolute; border-radius: 50%; background: white; animation: twinkle var(--d) ease-in-out infinite alternate;
    }
    @keyframes twinkle { from { opacity: var(--o); } to { opacity: calc(var(--o) * 0.15); } }

    /* Top bar */
    #topbar {
      position: relative; z-index: 10; width: 100%; max-width: 480px;
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 16px 8px;
    }
    #back-btn {
      background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15);
      color: #d4b0ff; border-radius: 20px; padding: 6px 14px;
      font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 12px;
      cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 5px;
      transition: background 0.2s;
    }
    #back-btn:hover { background: rgba(255,255,255,0.15); }

    #mode-btn {
      border: none; border-radius: 20px; padding: 6px 14px;
      font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 12px;
      cursor: pointer; transition: all 0.2s;
      background: rgba(255,255,255,0.08); color: #f0e6ff;
      border: 1px solid rgba(255,255,255,0.15);
    }
    #mode-btn:hover { background: rgba(255,255,255,0.18); }
    #mode-btn.cb-active {
      background: linear-gradient(135deg,#1d4ed8,#7c3aed);
      border-color: transparent; color: white;
    }

    /* Score row */
    #scorebar {
      position: relative; z-index: 10; width: 100%; max-width: 480px;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 16px 6px;
    }
    .score-pill {
      background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.12);
      border-radius: 20px; padding: 4px 14px; font-size: 13px; font-weight: 900;
    }
    #level-pill { color: #d4b0ff; }
    #score-pill { color: #ffcc00; }
    #combo-pill { color: #ff6699; min-width: 70px; text-align: center; }

    /* Canvas wrapper */
    #canvas-wrap {
      position: relative; z-index: 5; flex: 1;
      display: flex; align-items: flex-start; justify-content: center;
    }
    canvas {
      display: block;
      cursor: crosshair;
      touch-action: none;
    }

    /* Next ball preview */
    #next-wrap {
      position: relative; z-index: 10; width: 100%; max-width: 480px;
      display: flex; align-items: center; justify-content: center;
      gap: 20px; padding: 6px 16px 12px;
      font-size: 12px; font-weight: 700; color: #94a3b8;
    }
    #next-canvas { border-radius: 50%; }

    /* Overlays */
    #overlay {
      display: none; position: fixed; inset: 0; z-index: 100;
      background: rgba(13,0,16,0.88); backdrop-filter: blur(6px);
      align-items: center; justify-content: center;
    }
    #overlay.show { display: flex; }
    .overlay-box {
      background: linear-gradient(135deg, rgba(30,10,50,0.95), rgba(10,0,20,0.95));
      border: 1px solid rgba(200,150,255,0.2);
      border-radius: 24px; padding: 40px 32px; text-align: center;
      box-shadow: 0 0 60px rgba(180,100,255,0.15); max-width: 320px; width: 90%;
    }
    .overlay-emoji { font-size: 56px; margin-bottom: 12px; }
    .overlay-title { font-size: 28px; font-weight: 900; margin-bottom: 8px; }
    .overlay-sub { font-size: 14px; color: #94a3b8; margin-bottom: 6px; }
    .overlay-score { font-size: 42px; font-weight: 900; color: #ffcc00; margin: 8px 0 24px; }
    .overlay-btn {
      background: linear-gradient(135deg,#cc33ff,#7c3aed);
      border: none; border-radius: 12px; padding: 12px 32px;
      color: white; font-family: 'Nunito', sans-serif; font-weight: 900;
      font-size: 16px; cursor: pointer; width: 100%; margin-bottom: 10px;
      transition: opacity 0.2s; box-shadow: 0 4px 20px rgba(180,100,255,0.3);
    }
    .overlay-btn:hover { opacity: 0.85; }
    .overlay-btn.secondary {
      background: rgba(255,255,255,0.07);
      box-shadow: none; border: 1px solid rgba(255,255,255,0.12);
    }

    /* Floating score popups */
    .float-score {
      position: absolute; font-weight: 900; font-size: 16px;
      pointer-events: none; z-index: 20; animation: floatUp 0.9s ease forwards;
    }
    @keyframes floatUp {
      0%   { opacity: 1; transform: translateY(0) scale(1); }
      100% { opacity: 0; transform: translateY(-50px) scale(1.3); }
    }
  </style>
</head>
<body>

<div id="stars"></div>

<div id="topbar">
  <a class="back-btn" id="back-btn" href="index.html">← Launchpad</a>
  <div style="font-weight:900;font-size:15px;letter-spacing:1px;">✦ BLAZE SHOOTER</div>
  <button id="mode-btn" onclick="toggleMode()">👁 Colorblind Mode</button>
</div>

<div id="scorebar">
  <div class="score-pill" id="level-pill">LVL 1</div>
  <div class="score-pill" id="score-pill">⭐ 0</div>
  <div class="score-pill" id="combo-pill">🔥 ×1</div>
</div>

<div id="canvas-wrap">
  <canvas id="gameCanvas"></canvas>
</div>

<div id="next-wrap">
  <span>NEXT →</span>
  <canvas id="nextCanvas" width="36" height="36"></canvas>
  <span style="color:#d4b0ff;font-size:11px;">tap / click to shoot</span>
</div>

<!-- Game Over Overlay -->
<div id="overlay">
  <div class="overlay-box">
    <div class="overlay-emoji" id="ov-emoji">💥</div>
    <div class="overlay-title" id="ov-title">Game Over</div>
    <div class="overlay-sub" id="ov-sub">The grid reached you!</div>
    <div class="overlay-score" id="ov-score">0</div>
    <button class="overlay-btn" onclick="startGame()">🔥 Play Again</button>
    <button class="overlay-btn secondary" onclick="window.location='index.html'">← Back to Launchpad</button>
  </div>
</div>

<script>
// ─────────────────────────────────────────────────
// CONSTANTS
// ─────────────────────────────────────────────────
const COLS       = 11;
const BALL_SPEED = 11;
const MIN_MATCH  = 3;
const MISS_LIMIT = 5; // misses before adding new row

// ─────────────────────────────────────────────────
// COLOR PALETTES
// ─────────────────────────────────────────────────
const VIBRANT = [
  { fill:'#ff3366', hi:'#ff88aa', glow:'#ff0055', name:'Rose'   },
  { fill:'#33aaff', hi:'#88ccff', glow:'#0077ff', name:'Blue'   },
  { fill:'#44ff88', hi:'#aaff99', glow:'#00cc66', name:'Mint'   },
  { fill:'#ffcc00', hi:'#ffe066', glow:'#cc8800', name:'Gold'   },
  { fill:'#cc44ff', hi:'#e099ff', glow:'#9900ff', name:'Purple' },
  { fill:'#ff6633', hi:'#ff9966', glow:'#cc3300', name:'Flame'  },
];
const CB_SAFE = [
  { fill:'#0077BB', hi:'#55aaee', glow:'#005599', name:'Blue',    shape:'circle'   },
  { fill:'#EE7733', hi:'#ffaa66', glow:'#cc5500', name:'Orange',  shape:'square'   },
  { fill:'#AA3377', hi:'#dd66aa', glow:'#771155', name:'Magenta', shape:'triangle' },
  { fill:'#009988', hi:'#44ccbb', glow:'#006655', name:'Teal',    shape:'star'     },
  { fill:'#CCBB44', hi:'#eeee88', glow:'#999900', name:'Yellow',  shape:'diamond'  },
  { fill:'#EE3377', hi:'#ff77aa', glow:'#bb0044', name:'Pink',    shape:'cross'    },
];

// ─────────────────────────────────────────────────
// STATE
// ─────────────────────────────────────────────────
let canvas, ctx, nextCanvas, nextCtx;
let R, D, ROW_H, GRID_LEFT, GRID_TOP;
let colorblind = false;
let palette = VIBRANT;
let numColors = 4;
let grid = [];       // grid[row][col] = colorIdx | null
let flying = null;   // { x,y,vx,vy,colorIdx }
let curColor = 0;
let nxtColor = 0;
let score = 0;
let combo = 0;
let misses = 0;
let level = 1;
let gameState = 'playing'; // 'playing' | 'over'
let particles = [];
let aimAngle = -Math.PI/2;
let floatEls = [];
let animId = null;

// ─────────────────────────────────────────────────
// STARS
// ─────────────────────────────────────────────────
function makeStars() {
  const wrap = document.getElementById('stars');
  wrap.innerHTML = '';
  for (let i = 0; i < 60; i++) {
    const s = document.createElement('div');
    s.className = 'star';
    const sz = (Math.random()*2+0.5).toFixed(1);
    s.style.cssText = `width:${sz}px;height:${sz}px;left:${Math.random()*100}%;top:${Math.random()*100}%;--d:${(Math.random()*3+1.5).toFixed(1)}s;--o:${(Math.random()*0.6+0.2).toFixed(2)}`;
    wrap.appendChild(s);
  }
}

// ─────────────────────────────────────────────────
// INIT / RESIZE
// ─────────────────────────────────────────────────
function initCanvas() {
  canvas = document.getElementById('gameCanvas');
  ctx    = canvas.getContext('2d');
  nextCanvas = document.getElementById('nextCanvas');
  nextCtx    = nextCanvas.getContext('2d');

  const maxW = Math.min(window.innerWidth, 480);
  const maxH = Math.min(window.innerHeight - 160, 620);

  R = Math.floor(maxW / (COLS * 2 + 2));   // bubble radius
  if (R < 14) R = 14;
  if (R > 22) R = 22;
  D     = R * 2;
  ROW_H = Math.round(D * 0.87);            // hex row height

  const gridW = COLS * D;
  canvas.width  = Math.max(gridW + R*2, maxW > 360 ? maxW : 360);
  canvas.height = maxH;

  GRID_LEFT = Math.floor((canvas.width - gridW) / 2);
  GRID_TOP  = 10;

  nextCanvas.width  = D + 4;
  nextCanvas.height = D + 4;
}

function initGame() {
  grid      = [];
  particles = [];
  flying    = null;
  score     = 0;
  combo     = 0;
  misses    = 0;
  level     = 1;
  numColors = 4;
  gameState = 'playing';

  // Seed 7 rows
  for (let row = 0; row < 7; row++) addTopRow(false);

  curColor = randColor();
  nxtColor = randColor();

  updateUI();
}

// ─────────────────────────────────────────────────
// GRID HELPERS
// ─────────────────────────────────────────────────
function colsInRow(row) { return row % 2 === 0 ? COLS : COLS - 1; }

function bubbleXY(row, col) {
  const off = row % 2 === 0 ? 0 : R;
  return {
    x: GRID_LEFT + col * D + R + off,
    y: GRID_TOP  + row * ROW_H + R
  };
}

function randColor() { return Math.floor(Math.random() * numColors); }

function addTopRow(atTop = true) {
  const row = [];
  const cols = colsInRow(atTop ? 0 : grid.length);
  for (let c = 0; c < cols; c++) {
    row.push(Math.random() < 0.92 ? randColor() : null);
  }
  if (atTop) {
    // Shift existing grid down
    grid.unshift(row);
  } else {
    grid.push(row);
  }
}

function getNeighbors(row, col) {
  const even = row % 2 === 0;
  const candidates = [
    [row,   col-1], [row,   col+1],
    [row-1, even ? col-1 : col], [row-1, even ? col : col+1],
    [row+1, even ? col-1 : col], [row+1, even ? col : col+1],
  ];
  return candidates.filter(([r,c]) => {
    if (r < 0 || r >= grid.length) return false;
    if (c < 0 || c >= colsInRow(r)) return false;
    return true;
  });
}

function findConnected(row, col, colorIdx, visited = new Set()) {
  const k = `${row},${col}`;
  if (visited.has(k)) return [];
  if (row < 0 || row >= grid.length) return [];
  if (col < 0 || col >= colsInRow(row)) return [];
  if (grid[row][col] !== colorIdx) return [];
  visited.add(k);
  const res = [[row, col]];
  for (const [nr, nc] of getNeighbors(row, col)) {
    res.push(...findConnected(nr, nc, colorIdx, visited));
  }
  return res;
}

function findOrphans() {
  const connected = new Set();
  const queue = [];
  if (!grid[0]) return [];
  for (let c = 0; c < colsInRow(0); c++) {
    if (grid[0][c] !== null && grid[0][c] !== undefined) {
      const k = `0,${c}`;
      if (!connected.has(k)) { connected.add(k); queue.push([0, c]); }
    }
  }
  while (queue.length) {
    const [r, c] = queue.shift();
    for (const [nr, nc] of getNeighbors(r, c)) {
      const k = `${nr},${nc}`;
      if (!connected.has(k) && grid[nr] && grid[nr][nc] !== null && grid[nr][nc] !== undefined) {
        connected.add(k); queue.push([nr, nc]);
      }
    }
  }
  const orphans = [];
  for (let r = 0; r < grid.length; r++) {
    for (let c = 0; c < colsInRow(r); c++) {
      if (grid[r][c] !== null && grid[r][c] !== undefined && !connected.has(`${r},${c}`)) {
        orphans.push([r, c]);
      }
    }
  }
  return orphans;
}

function nearestEmpty(px, py) {
  let best = null, bd = Infinity;
  const maxR = Math.min(grid.length + 1, 20);
  for (let r = 0; r <= maxR; r++) {
    const cols = colsInRow(r);
    for (let c = 0; c < cols; c++) {
      if (r < grid.length && grid[r][c] !== null && grid[r][c] !== undefined) continue;
      const { x, y } = bubbleXY(r, c);
      const d = Math.hypot(px - x, py - y);
      if (d < bd) { bd = d; best = [r, c]; }
    }
  }
  return best;
}

// ─────────────────────────────────────────────────
// DRAWING
// ─────────────────────────────────────────────────
function drawBubble(c2d, x, y, colorIdx, isFly = false) {
  const col = palette[colorIdx % palette.length];

  // Glow
  if (isFly || colorblind === false) {
    c2d.shadowBlur  = isFly ? 22 : 14;
    c2d.shadowColor = col.glow;
  }

  // Gradient fill
  const grd = c2d.createRadialGradient(x - R*0.3, y - R*0.35, R*0.1, x, y, R);
  grd.addColorStop(0, col.hi);
  grd.addColorStop(0.45, col.fill);
  grd.addColorStop(1, col.glow);

  c2d.beginPath();
  c2d.arc(x, y, R - 1.5, 0, Math.PI*2);
  c2d.fillStyle = grd;
  c2d.fill();
  c2d.shadowBlur = 0;

  // Highlight
  c2d.beginPath();
  c2d.arc(x - R*0.28, y - R*0.3, R*0.32, 0, Math.PI*2);
  c2d.fillStyle = 'rgba(255,255,255,0.38)';
  c2d.fill();

  // Shape for colorblind mode
  if (colorblind && col.shape) {
    c2d.fillStyle   = 'rgba(255,255,255,0.92)';
    c2d.strokeStyle = 'rgba(255,255,255,0.92)';
    c2d.lineWidth   = 1.5;
    drawShape(c2d, x, y, col.shape, R * 0.48);
  }
}

function drawShape(c2d, x, y, shape, sz) {
  c2d.save();
  c2d.translate(x, y);
  c2d.beginPath();
  switch(shape) {
    case 'circle':
      c2d.arc(0, 0, sz*0.52, 0, Math.PI*2);
      c2d.fill();
      break;
    case 'square':
      c2d.fillRect(-sz*0.55, -sz*0.55, sz*1.1, sz*1.1);
      break;
    case 'triangle':
      c2d.moveTo(0, -sz*0.75);
      c2d.lineTo(sz*0.65, sz*0.5);
      c2d.lineTo(-sz*0.65, sz*0.5);
      c2d.closePath();
      c2d.fill();
      break;
    case 'star': {
      const spikes=4, outer=sz*0.7, inner=sz*0.3;
      let a = -Math.PI/2;
      const step = Math.PI/spikes;
      c2d.moveTo(Math.cos(a)*outer, Math.sin(a)*outer);
      for(let i=0;i<spikes;i++){
        a+=step; c2d.lineTo(Math.cos(a)*inner, Math.sin(a)*inner);
        a+=step; c2d.lineTo(Math.cos(a)*outer, Math.sin(a)*outer);
      }
      c2d.closePath(); c2d.fill();
      break;
    }
    case 'diamond':
      c2d.moveTo(0, -sz*0.75);
      c2d.lineTo(sz*0.52, 0);
      c2d.lineTo(0, sz*0.75);
      c2d.lineTo(-sz*0.52, 0);
      c2d.closePath(); c2d.fill();
      break;
    case 'cross': {
      const t=sz*0.22, s=sz*0.65;
      c2d.fillRect(-t,-s,t*2,s*2);
      c2d.fillRect(-s,-t,s*2,t*2);
      break;
    }
  }
  c2d.restore();
}

function drawShooter(sx, sy) {
  // Aim line (dashed)
  ctx.save();
  ctx.setLineDash([6,6]);
  ctx.strokeStyle = 'rgba(255,255,255,0.2)';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(sx, sy);
  let lx = sx, ly = sy;
  let lvx = Math.cos(aimAngle) * 100;
  let lvy = Math.sin(aimAngle) * 100;
  for (let i=0; i<4; i++) {
    let tx = lx + lvx, ty = ly + lvy;
    if (tx - R < 0 || tx + R > canvas.width) { lvx = -lvx; tx = lx + lvx; }
    if (ty < GRID_TOP) break;
    ctx.lineTo(tx, ty);
    lx = tx; ly = ty;
  }
  ctx.stroke();
  ctx.restore();

  // Cannon base
  ctx.save();
  const clen = R * 1.6;
  const cx2 = sx + Math.cos(aimAngle) * clen;
  const cy2 = sy + Math.sin(aimAngle) * clen;
  ctx.strokeStyle = '#d4b0ff';
  ctx.lineWidth   = R * 0.55;
  ctx.lineCap     = 'round';
  ctx.shadowBlur  = 12;
  ctx.shadowColor = '#cc33ff';
  ctx.beginPath();
  ctx.moveTo(sx, sy);
  ctx.lineTo(cx2, cy2);
  ctx.stroke();
  ctx.restore();

  // Current ball on cannon
  drawBubble(ctx, sx, sy, curColor, true);
}

function drawParticles() {
  for (const p of particles) {
    ctx.save();
    ctx.globalAlpha = p.life;
    ctx.fillStyle   = p.color;
    ctx.shadowBlur  = 8;
    ctx.shadowColor = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
    ctx.fill();
    ctx.restore();
  }
}

function drawDangerLine() {
  const sy = canvas.height - 55;
  ctx.save();
  ctx.setLineDash([8,6]);
  ctx.strokeStyle = 'rgba(255,60,60,0.35)';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(0, sy); ctx.lineTo(canvas.width, sy);
  ctx.stroke();
  ctx.restore();
}

// ─────────────────────────────────────────────────
// PARTICLES
// ─────────────────────────────────────────────────
function spawnParticles(x, y, colorIdx, count=14) {
  const col = palette[colorIdx % palette.length];
  for (let i=0; i<count; i++) {
    const a = (Math.PI*2*i/count) + Math.random()*0.5;
    const spd = 2.5 + Math.random()*5;
    particles.push({
      x, y,
      vx: Math.cos(a)*spd,
      vy: Math.sin(a)*spd - 1,
      r:  3 + Math.random()*4,
      color: col.fill,
      life: 1.0,
      decay: 0.018 + Math.random()*0.02
    });
  }
}

function updateParticles() {
  for (const p of particles) {
    p.x += p.vx; p.y += p.vy;
    p.vy += 0.12;
    p.r  *= 0.96;
    p.life -= p.decay;
  }
  particles = particles.filter(p => p.life > 0 && p.r > 0.3);
}

// ─────────────────────────────────────────────────
// SHOOTING
// ─────────────────────────────────────────────────
function shoot(sx, sy) {
  if (flying || gameState !== 'playing') return;
  // Clamp angle so we never shoot straight down
  let a = aimAngle;
  const minUp = -Math.PI + 0.1;
  const maxUp = -0.1;
  a = Math.max(minUp, Math.min(maxUp, a));

  flying = {
    x: sx, y: sy,
    vx: Math.cos(a) * BALL_SPEED,
    vy: Math.sin(a) * BALL_SPEED,
    colorIdx: curColor
  };
}

function placeBall(ball) {
  const pos = nearestEmpty(ball.x, ball.y);
  if (!pos) { flying = null; return; }
  let [row, col] = pos;

  // Expand grid if needed
  while (row >= grid.length) {
    const newRow = [];
    for (let c=0; c < colsInRow(grid.length); c++) newRow.push(null);
    grid.push(newRow);
  }
  grid[row][col] = ball.colorIdx;
  flying = null;

  // Find matches
  const matches = findConnected(row, col, ball.colorIdx);
  if (matches.length >= MIN_MATCH) {
    combo++;
    const pts = matches.length * 10 * combo;
    score += pts;
    matches.forEach(([r,c]) => {
      const {x,y} = bubbleXY(r,c);
      spawnParticles(x, y, grid[r][c]);
      grid[r][c] = null;
    });
    showFloatScore(pts, bubbleXY(row,col));

    // Drop orphans
    const orphans = findOrphans();
    orphans.forEach(([r,c]) => {
      const {x,y} = bubbleXY(r,c);
      spawnParticles(x, y, grid[r][c], 8);
      score += 5;
      grid[r][c] = null;
    });

    misses = 0;
    checkLevel();
  } else {
    combo = 0;
    misses++;
    if (misses >= MISS_LIMIT) {
      misses = 0;
      addTopRow(true);
    }
  }

  // Trim empty bottom rows
  while (grid.length > 0) {
    const lastRow = grid[grid.length-1];
    if (lastRow.every(v => v === null || v === undefined)) grid.pop();
    else break;
  }

  // Check game over: any bubble below danger line
  const dangerY = canvas.height - 60;
  let over = false;
  for (let r=0; r<grid.length; r++) {
    for (let c=0; c<colsInRow(r); c++) {
      if (grid[r][c] !== null && grid[r][c] !== undefined) {
        if (bubbleXY(r,c).y + R >= dangerY) { over = true; break; }
      }
    }
    if (over) break;
  }
  if (over) endGame();

  curColor = nxtColor;
  nxtColor = randColor();
  updateUI();
}

function checkLevel() {
  const thresh = level * 300;
  if (score >= thresh) {
    level++;
    numColors = Math.min(6, numColors + (level % 3 === 0 ? 1 : 0));
    // Speed already tied to level via display
  }
}

// ─────────────────────────────────────────────────
// FLOAT SCORE POPUP
// ─────────────────────────────────────────────────
function showFloatScore(pts, {x, y}) {
  const el = document.createElement('div');
  el.className = 'float-score';
  el.textContent = `+${pts}`;
  el.style.left  = (canvas.offsetLeft + x - 20) + 'px';
  el.style.top   = (canvas.offsetTop  + y - 20) + 'px';
  el.style.color = combo > 2 ? '#ff6699' : '#ffcc00';
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 950);
}

// ─────────────────────────────────────────────────
// GAME OVER
// ─────────────────────────────────────────────────
function endGame() {
  gameState = 'over';
  const emoji = score > 500 ? '🏆' : score > 200 ? '🎉' : '💥';
  const sub   = score > 500 ? 'Amazing run!' : score > 200 ? 'Nice shooting!' : 'The grid caught up!';
  document.getElementById('ov-emoji').textContent = emoji;
  document.getElementById('ov-title').textContent = 'Game Over';
  document.getElementById('ov-sub').textContent   = sub;
  document.getElementById('ov-score').textContent = `⭐ ${score}`;
  document.getElementById('overlay').classList.add('show');
}

// ─────────────────────────────────────────────────
// UI UPDATES
// ─────────────────────────────────────────────────
function updateUI() {
  document.getElementById('level-pill').textContent = `LVL ${level}`;
  document.getElementById('score-pill').textContent = `⭐ ${score}`;
  document.getElementById('combo-pill').textContent = combo > 1 ? `🔥 ×${combo}` : '';

  // Draw next bubble preview
  nextCtx.clearRect(0,0,nextCanvas.width,nextCanvas.height);
  const cx = nextCanvas.width/2, cy = nextCanvas.height/2;
  drawBubble(nextCtx, cx, cy, nxtColor);
}

// ─────────────────────────────────────────────────
// GAME LOOP
// ─────────────────────────────────────────────────
function gameLoop() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Background gradient
  const bg = ctx.createLinearGradient(0,0,0,canvas.height);
  bg.addColorStop(0,'#0d0010');
  bg.addColorStop(1,'#100018');
  ctx.fillStyle = bg;
  ctx.fillRect(0,0,canvas.width,canvas.height);

  drawDangerLine();

  // Draw grid
  for (let r=0; r<grid.length; r++) {
    for (let c=0; c<colsInRow(r); c++) {
      const v = grid[r][c];
      if (v !== null && v !== undefined) {
        const {x,y} = bubbleXY(r,c);
        drawBubble(ctx, x, y, v);
      }
    }
  }

  // Update + draw flying ball
  const sx = canvas.width/2;
  const sy = canvas.height - 55;

  if (flying) {
    flying.x += flying.vx;
    flying.y += flying.vy;

    // Wall bounce
    if (flying.x - R < 0)              { flying.x = R;                  flying.vx =  Math.abs(flying.vx); }
    if (flying.x + R > canvas.width)   { flying.x = canvas.width - R;   flying.vx = -Math.abs(flying.vx); }
    if (flying.y - R < GRID_TOP)       { flying.y = GRID_TOP + R; placeBall(flying); }

    // Collision with grid
    if (flying) {
      let hit = false;
      for (let r=0; r<grid.length && !hit; r++) {
        for (let c=0; c<colsInRow(r) && !hit; c++) {
          if (grid[r][c] !== null && grid[r][c] !== undefined) {
            const {x,y} = bubbleXY(r,c);
            if (Math.hypot(flying.x-x, flying.y-y) < D - 2) {
              hit = true;
              placeBall(flying);
            }
          }
        }
      }
      // Draw ball if still flying
      if (flying) drawBubble(ctx, flying.x, flying.y, flying.colorIdx, true);
    }
  }

  if (gameState === 'playing') drawShooter(sx, sy);

  updateParticles();
  drawParticles();

  animId = requestAnimationFrame(gameLoop);
}

// ─────────────────────────────────────────────────
// INPUT
// ─────────────────────────────────────────────────
function getAngle(ex, ey) {
  const sx = canvas.width/2;
  const sy = canvas.height - 55;
  const rect = canvas.getBoundingClientRect();
  const cx = (ex - rect.left) * (canvas.width / rect.width);
  const cy = (ey - rect.top)  * (canvas.height / rect.height);
  return Math.atan2(cy - sy, cx - sx);
}

canvas.addEventListener('mousemove', e => {
  aimAngle = getAngle(e.clientX, e.clientY);
});
canvas.addEventListener('click', e => {
  aimAngle = getAngle(e.clientX, e.clientY);
  shoot(canvas.width/2, canvas.height - 55);
});

// Touch
let touchStart = null;
canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  const t = e.touches[0];
  touchStart = { x: t.clientX, y: t.clientY };
  aimAngle = getAngle(t.clientX, t.clientY);
}, { passive: false });
canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  const t = e.touches[0];
  aimAngle = getAngle(t.clientX, t.clientY);
}, { passive: false });
canvas.addEventListener('touchend', e => {
  e.preventDefault();
  if (touchStart) {
    shoot(canvas.width/2, canvas.height - 55);
    touchStart = null;
  }
}, { passive: false });

// ─────────────────────────────────────────────────
// MODE TOGGLE
// ─────────────────────────────────────────────────
function toggleMode() {
  colorblind = !colorblind;
  palette    = colorblind ? CB_SAFE : VIBRANT;
  const btn  = document.getElementById('mode-btn');
  btn.textContent = colorblind ? '🌈 Vibrant Mode' : '👁 Colorblind Mode';
  btn.classList.toggle('cb-active', colorblind);
}

// ─────────────────────────────────────────────────
// START / RESTART
// ─────────────────────────────────────────────────
function startGame() {
  document.getElementById('overlay').classList.remove('show');
  if (animId) cancelAnimationFrame(animId);
  initGame();
  updateUI();
  gameLoop();
}

// ─────────────────────────────────────────────────
// BOOT
// ─────────────────────────────────────────────────
window.addEventListener('DOMContentLoaded', () => {
  makeStars();
  initCanvas();
  startGame();
});
window.addEventListener('resize', () => {
  if (animId) cancelAnimationFrame(animId);
  initCanvas();
  startGame();
});
</script>
