<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🧩 Carly Brain</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;900&family=Lora:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Nunito', sans-serif;
    background: #f5f0ff;
    background-image:
      radial-gradient(ellipse at 10% 10%, rgba(167,139,250,0.12) 0%, transparent 50%),
      radial-gradient(ellipse at 90% 90%, rgba(244,114,182,0.08) 0%, transparent 50%);
    color: #2d2244;
    min-height: 100vh;
  }

  /* Navbar */
  .navbar {
    background: rgba(255,255,255,0.85);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid rgba(167,139,250,0.2);
    padding: 0 28px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 58px;
    position: sticky;
    top: 0;
    z-index: 50;
  }
  .navbar-left { display: flex; align-items: center; gap: 16px; }
  .navbar h1 { font-size: 18px; font-weight: 900; color: #2d2244; letter-spacing: -0.5px; }
  .navbar h1 span { color: #a78bfa; }
  .nav-link { font-size: 12px; color: #a78bfa; text-decoration: none; font-weight: 700; letter-spacing: 0.5px; opacity: 0.7; transition: opacity 0.15s; }
  .nav-link:hover { opacity: 1; }

  /* Capture bar */
  .capture-wrap {
    background: rgba(255,255,255,0.9);
    border-bottom: 1px solid rgba(167,139,250,0.15);
    padding: 14px 28px;
    display: flex;
    gap: 10px;
    align-items: center;
  }
  .capture-input {
    flex: 1;
    background: #faf7ff;
    border: 1.5px solid rgba(167,139,250,0.3);
    border-radius: 12px;
    padding: 11px 18px;
    color: #2d2244;
    font-size: 15px;
    font-family: 'Nunito', sans-serif;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .capture-input::placeholder { color: #c4b5e8; font-style: italic; }
  .capture-input:focus { border-color: #a78bfa; box-shadow: 0 0 0 3px rgba(167,139,250,0.12); }
  .capture-select {
    background: #faf7ff;
    border: 1.5px solid rgba(167,139,250,0.3);
    border-radius: 10px;
    padding: 10px 14px;
    color: #5b3f7a;
    font-size: 13px;
    font-family: 'Nunito', sans-serif;
    outline: none;
    cursor: pointer;
  }
  .capture-select:focus { border-color: #a78bfa; }
  .btn-capture {
    background: linear-gradient(135deg, #a78bfa, #818cf8);
    color: white;
    border: none;
    border-radius: 10px;
    padding: 11px 22px;
    font-size: 14px;
    font-weight: 700;
    font-family: 'Nunito', sans-serif;
    cursor: pointer;
    transition: opacity 0.15s, transform 0.15s;
    white-space: nowrap;
  }
  .btn-capture:hover { opacity: 0.9; transform: translateY(-1px); }

  .auto-tag {
    font-size: 11px;
    color: #a78bfa;
    font-style: italic;
    white-space: nowrap;
  }

  /* Layout */
  .layout { display: flex; min-height: calc(100vh - 58px - 57px); }

  /* Sidebar */
  .sidebar {
    width: 210px;
    background: rgba(255,255,255,0.7);
    border-right: 1px solid rgba(167,139,250,0.15);
    padding: 20px 0;
    flex-shrink: 0;
    position: sticky;
    top: 58px;
    height: calc(100vh - 58px);
    overflow-y: auto;
  }
  .sidebar-section { padding: 6px 18px 4px; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 1.5px; color: #c4b5e8; margin-top: 8px; }
  .sidebar-item {
    padding: 9px 18px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 600;
    color: #7c5fa0;
    display: flex;
    align-items: center;
    gap: 9px;
    border-left: 3px solid transparent;
    transition: all 0.15s;
    margin: 1px 0;
  }
  .sidebar-item:hover { background: rgba(167,139,250,0.08); color: #5b3f7a; }
  .sidebar-item.active { background: rgba(167,139,250,0.12); color: #5b3f7a; border-left-color: #a78bfa; }
  .sidebar-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .sidebar-count { margin-left: auto; background: rgba(167,139,250,0.15); border-radius: 10px; padding: 1px 8px; font-size: 11px; color: #a78bfa; }

  /* Main content */
  .main-content { flex: 1; padding: 28px 32px; overflow-y: auto; }

  /* Stage headers */
  .stage-section { margin-bottom: 36px; }
  .stage-header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 14px;
    padding-bottom: 8px;
    border-bottom: 1.5px solid rgba(167,139,250,0.15);
  }
  .stage-title { font-size: 13px; font-weight: 800; text-transform: uppercase; letter-spacing: 1.5px; color: #c4b5e8; }
  .stage-count { background: rgba(167,139,250,0.15); border-radius: 10px; padding: 2px 9px; font-size: 11px; font-weight: 700; color: #a78bfa; }

  /* Item rows */
  .item-row {
    background: rgba(255,255,255,0.85);
    border: 1px solid rgba(167,139,250,0.15);
    border-radius: 12px;
    padding: 14px 16px;
    margin-bottom: 8px;
    display: flex;
    align-items: flex-start;
    gap: 12px;
    transition: all 0.2s;
    cursor: pointer;
    position: relative;
  }
  .item-row:hover { border-color: rgba(167,139,250,0.4); box-shadow: 0 4px 16px rgba(167,139,250,0.12); transform: translateY(-1px); }
  .item-row.done { opacity: 0.5; }
  .item-row.done .item-row-text { text-decoration: line-through; color: #b0a0cc; }

  .item-row-check {
    width: 20px;
    height: 20px;
    border-radius: 50%;
    border: 2px solid rgba(167,139,250,0.4);
    flex-shrink: 0;
    margin-top: 1px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s;
    background: transparent;
  }
  .item-row-check:hover { border-color: #a78bfa; background: rgba(167,139,250,0.1); }
  .item-row-check.checked { background: #a78bfa; border-color: #a78bfa; }
  .item-row-check.in-progress { background: #fef3c7; border-color: #f59e0b; }

  .item-row-body { flex: 1; min-width: 0; }
  .item-row-text { font-size: 14px; font-weight: 600; color: #2d2244; line-height: 1.5; }
  .item-row-meta { display: flex; align-items: center; gap: 8px; margin-top: 6px; flex-wrap: wrap; }

  .cat-pill {
    font-size: 10px;
    font-weight: 700;
    padding: 2px 9px;
    border-radius: 20px;
    letter-spacing: 0.3px;
  }
  .due-pill { font-size: 11px; color: #f472b6; font-weight: 600; }
  .due-pill.overdue { color: #ef4444; }
  .provider-pill {
    font-size: 11px;
    color: #818cf8;
    font-weight: 600;
    text-decoration: none;
  }
  .provider-pill:hover { text-decoration: underline; }

  .item-row-actions { display: flex; gap: 4px; opacity: 0; transition: opacity 0.15s; flex-shrink: 0; }
  .item-row:hover .item-row-actions { opacity: 1; }
  .action-btn {
    background: rgba(167,139,250,0.1);
    border: none;
    border-radius: 6px;
    color: #a78bfa;
    cursor: pointer;
    font-size: 11px;
    padding: 4px 8px;
    font-family: 'Nunito', sans-serif;
    font-weight: 600;
    transition: background 0.15s;
    white-space: nowrap;
  }
  .action-btn:hover { background: rgba(167,139,250,0.2); }
  .action-btn.del { background: rgba(244,114,182,0.1); color: #f472b6; }
  .action-btn.del:hover { background: rgba(244,114,182,0.2); }

  /* Stage toggle circles */
  .stage-toggle { display: flex; gap: 4px; }
  .stage-dot {
    width: 8px; height: 8px; border-radius: 50%;
    cursor: pointer;
    transition: transform 0.15s;
  }
  .stage-dot:hover { transform: scale(1.3); }

  /* Modal */
  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(45,34,68,0.4);
    backdrop-filter: blur(4px);
    display: flex; align-items: center; justify-content: center;
    z-index: 200; padding: 24px;
  }
  .modal {
    background: #faf7ff;
    border: 1px solid rgba(167,139,250,0.25);
    border-radius: 20px;
    max-width: 540px;
    width: 100%;
    padding: 28px;
    box-shadow: 0 20px 60px rgba(100,60,180,0.15);
  }
  .modal-title { font-size: 17px; font-weight: 900; color: #2d2244; margin-bottom: 20px; letter-spacing: -0.3px; }
  .form-group { margin-bottom: 14px; }
  .form-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: #b0a0cc; display: block; margin-bottom: 6px; }
  .form-input, .form-select, .form-textarea {
    width: 100%;
    background: white;
    border: 1.5px solid rgba(167,139,250,0.25);
    border-radius: 10px;
    padding: 10px 14px;
    color: #2d2244;
    font-size: 14px;
    font-family: 'Nunito', sans-serif;
    outline: none;
    transition: border-color 0.15s;
  }
  .form-input:focus, .form-select:focus, .form-textarea:focus { border-color: #a78bfa; }
  .form-select option { background: white; }
  .form-textarea { resize: vertical; min-height: 80px; line-height: 1.6; }
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .btn-row { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; }
  .btn { padding: 9px 18px; border-radius: 10px; border: none; cursor: pointer; font-size: 13px; font-weight: 700; font-family: 'Nunito', sans-serif; transition: all 0.15s; }
  .btn-primary { background: linear-gradient(135deg, #a78bfa, #818cf8); color: white; }
  .btn-primary:hover { opacity: 0.9; }
  .btn-ghost { background: rgba(167,139,250,0.1); color: #7c5fa0; }
  .btn-ghost:hover { background: rgba(167,139,250,0.2); }
  .btn-danger { background: rgba(244,114,182,0.12); color: #db2777; }

  /* Empty state */
  .empty { text-align: center; padding: 32px 16px; color: #c4b5e8; font-style: italic; font-size: 13px; font-family: 'Lora', serif; }

  /* Stats */
  .stats-row { display: flex; gap: 12px; margin-bottom: 24px; flex-wrap: wrap; }
  .stat-pill { background: rgba(255,255,255,0.8); border: 1px solid rgba(167,139,250,0.15); border-radius: 12px; padding: 10px 18px; }
  .stat-pill strong { font-size: 22px; font-weight: 900; color: #a78bfa; display: block; line-height: 1; }
  .stat-pill span { font-size: 11px; color: #b0a0cc; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }

  /* Sparkles */
  .sparkle { position: fixed; pointer-events: none; z-index: 0; font-size: var(--sz); color: #c4b5e8; opacity: var(--op); top: var(--t); left: var(--l); animation: twinkle var(--dur) ease-in-out infinite alternate; }
  @keyframes twinkle { from { opacity: var(--op); } to { opacity: calc(var(--op) * 0.15); } }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">

const STAGES = ['Todo', 'In Progress', 'Done'];
const STAGE_COLORS = { 'Todo': '#c4b5e8', 'In Progress': '#f59e0b', 'Done': '#a78bfa' };

const KEYWORDS = {
  'Onboarding': ['onboard','provider','credenti','rippling','training','malpractice','nextech','npi','license','dr.','doctor'],
  'NextGen': ['nextgen','ehr','migration','nextech','chart','emr','template'],
  'Audits': ['audit','review','compliance','report','check','inspect'],
  'Side Projects': ['project','build','app','website','dashboard','design','idea','launch'],
  'To Do': ['call','email','schedule','book','pay','buy','order','remind','follow up','send'],
};

function detectCategory(text) {
  const lower = text.toLowerCase();
  for (const [cat, keys] of Object.entries(KEYWORDS)) {
    if (keys.some(k => lower.includes(k))) return cat;
  }
  return 'Inbox';
}

const api = (url, opts) => fetch(url, { headers: {'Content-Type':'application/json'}, ...opts }).then(r => r.json());

function ItemModal({ item, categories, onSave, onDelete, onClose }) {
  const [form, setForm] = React.useState({
    text: item?.text || '',
    category: item?.category || 'Inbox',
    status: item?.status || 'Todo',
    priority: item?.priority || 'Normal',
    notes: item?.notes || '',
    due_date: item?.due_date || '',
    provider_name: item?.provider_name || '',
  });
  const set = (k, v) => setForm(f => ({...f, [k]: v}));
  const save = () => { if (!form.text.trim()) return; onSave(form); };

  return (
    <div className="modal-overlay" onClick={e => e.target===e.currentTarget && onClose()}>
      <div className="modal">
        <div className="modal-title">{item ? '✦ Edit item' : '✦ New item'}</div>
        <div className="form-group">
          <label className="form-label">What's on your mind?</label>
          <textarea className="form-textarea" value={form.text} onChange={e=>set('text',e.target.value)} placeholder="Type anything..." autoFocus />
        </div>
        <div className="form-row">
          <div className="form-group">
            <label className="form-label">Category</label>
            <select className="form-select" value={form.category} onChange={e=>set('category',e.target.value)}>
              {categories.map(c => <option key={c.name} value={c.name}>{c.name}</option>)}
            </select>
          </div>
          <div className="form-group">
            <label className="form-label">Stage</label>
            <select className="form-select" value={form.status} onChange={e=>set('status',e.target.value)}>
              {STAGES.map(s => <option key={s}>{s}</option>)}
            </select>
          </div>
        </div>
        <div className="form-row">
          <div className="form-group">
            <label className="form-label">Due Date</label>
            <input type="date" className="form-input" value={form.due_date} onChange={e=>set('due_date',e.target.value)} />
          </div>
          <div className="form-group">
            <label className="form-label">Priority</label>
            <select className="form-select" value={form.priority} onChange={e=>set('priority',e.target.value)}>
              {['High','Normal','Low'].map(p => <option key={p}>{p}</option>)}
            </select>
          </div>
        </div>
        <div className="form-group">
          <label className="form-label">Link to Provider (optional)</label>
          <input className="form-input" value={form.provider_name} onChange={e=>set('provider_name',e.target.value)} placeholder="e.g. Dr. McKinley" />
        </div>
        <div className="form-group">
          <label className="form-label">Notes</label>
          <textarea className="form-textarea" value={form.notes} onChange={e=>set('notes',e.target.value)} placeholder="Any extra details..." style={{minHeight:60}} />
        </div>
        <div className="btn-row">
          {item && <button className="btn btn-danger" onClick={()=>onDelete(item.id)}>Delete</button>}
          <button className="btn btn-ghost" onClick={onClose}>Cancel</button>
          <button className="btn btn-primary" onClick={save}>Save ✦</button>
        </div>
      </div>
    </div>
  );
}

function App() {
  const [items, setItems] = React.useState([]);
  const [categories, setCategories] = React.useState([]);
  const [activeCategory, setActiveCategory] = React.useState('All');
  const [editItem, setEditItem] = React.useState(null);
  const [showModal, setShowModal] = React.useState(false);
  const [captureText, setCaptureText] = React.useState('');
  const [captureCategory, setCaptureCategory] = React.useState('');
  const [detectedCat, setDetectedCat] = React.useState('');

  const load = () => {
    api('/api/items').then(setItems);
    api('/api/categories').then(setCategories);
  };
  React.useEffect(load, []);

  const handleCaptureChange = (val) => {
    setCaptureText(val);
    if (!captureCategory) {
      const d = detectCategory(val);
      setDetectedCat(d !== 'Inbox' ? d : '');
    }
  };

  const capture = async () => {
    if (!captureText.trim()) return;
    const cat = captureCategory || detectedCat || 'Inbox';
    await api('/api/items', { method:'POST', body: JSON.stringify({ text: captureText.trim(), category: cat }) });
    setCaptureText(''); setCaptureCategory(''); setDetectedCat('');
    load();
  };

  const handleKeyDown = (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); capture(); } };

  const cycleStatus = async (item) => {
    const next = STAGES[(STAGES.indexOf(item.status) + 1) % STAGES.length];
    await api(`/api/items/${item.id}`, { method:'PUT', body: JSON.stringify({...item, status: next}) });
    load();
  };

  const saveItem = async (form) => {
    if (editItem?.id) {
      await api(`/api/items/${editItem.id}`, { method:'PUT', body: JSON.stringify(form) });
    } else {
      await api('/api/items', { method:'POST', body: JSON.stringify(form) });
    }
    setShowModal(false); setEditItem(null); load();
  };

  const deleteItem = async (id) => {
    await api(`/api/items/${id}`, { method:'DELETE' });
    setShowModal(false); setEditItem(null); load();
  };

  const openEdit = (item) => { setEditItem(item); setShowModal(true); };
  const openNew  = () => { setEditItem(null); setShowModal(true); };

  const filtered = activeCategory === 'All' ? items : items.filter(i => i.category === activeCategory);

  const catColor = name => categories.find(c => c.name === name)?.color || '#94a3b8';

  const todo       = filtered.filter(i => i.status === 'Todo');
  const inProgress = filtered.filter(i => i.status === 'In Progress');
  const done       = filtered.filter(i => i.status === 'Done');

  const categoryCounts = {};
  items.forEach(i => { categoryCounts[i.category] = (categoryCounts[i.category] || 0) + 1; });

  const formatDue = (d) => {
    if (!d) return null;
    const today = new Date(); today.setHours(0,0,0,0);
    const due = new Date(d + 'T00:00:00');
    const diff = Math.round((due - today) / 86400000);
    if (diff < 0) return { label: `${Math.abs(diff)}d overdue`, overdue: true };
    if (diff === 0) return { label: 'Today', overdue: false };
    if (diff === 1) return { label: 'Tomorrow', overdue: false };
    return { label: due.toLocaleDateString('en-US', { month:'short', day:'numeric' }), overdue: false };
  };

  const ItemRow = ({ item }) => {
    const due = formatDue(item.due_date);
    const color = catColor(item.category);
    return (
      <div className={`item-row${item.status==='Done'?' done':''}`} onClick={()=>openEdit(item)}>
        <div
          className={`item-row-check${item.status==='Done'?' checked':item.status==='In Progress'?' in-progress':''}`}
          onClick={e=>{ e.stopPropagation(); cycleStatus(item); }}
          title="Click to advance stage"
        >
          {item.status==='Done' && <span style={{color:'white',fontSize:11}}>✓</span>}
          {item.status==='In Progress' && <span style={{color:'#f59e0b',fontSize:10}}>●</span>}
        </div>
        <div className="item-row-body">
          <div className="item-row-text">{item.text}</div>
          <div className="item-row-meta">
            <span className="cat-pill" style={{background:`${color}22`,color}}>{item.category}</span>
            {item.priority === 'High' && <span style={{fontSize:10,color:'#f472b6',fontWeight:700}}>↑ High</span>}
            {due && <span className={`due-pill${due.overdue?' overdue':''}`}>📅 {due.label}</span>}
            {item.provider_name && <span className="provider-pill">👤 {item.provider_name}</span>}
            {item.notes && <span style={{fontSize:10,color:'#c4b5e8'}}>📝</span>}
          </div>
        </div>
        <div className="item-row-actions" onClick={e=>e.stopPropagation()}>
          <button className="action-btn del" onClick={()=>deleteItem(item.id)}>×</button>
        </div>
      </div>
    );
  };

  const StageSection = ({ title, items }) => (
    <div className="stage-section">
      <div className="stage-header">
        <div className="stage-title">{title}</div>
        <div className="stage-count">{items.length}</div>
      </div>
      {items.length === 0
        ? <div className="empty">nothing here ✦</div>
        : items.map(i => <ItemRow key={i.id} item={i} />)
      }
    </div>
  );

  return (
    <div>
      {/* Sparkles */}
      {['✦','✧','⋆','·'].map((c,i) => (
        [0,1,2,3].map(j => (
          <span key={`${i}-${j}`} className="sparkle" style={{
            '--sz': `${10+Math.random()*10}px`,
            '--op': (0.08+Math.random()*0.15).toFixed(2),
            '--t': `${Math.random()*100}%`,
            '--l': `${Math.random()*100}%`,
            '--dur': `${2+Math.random()*4}s`,
            animationDelay: `${Math.random()*4}s`
          }}>{c}</span>
        ))
      ))}

      <nav className="navbar">
        <div className="navbar-left">
          <h1>🧩 Carly <span>Brain</span></h1>
          <a href="https://fridaybrain.onrender.com" target="_blank" className="nav-link">↗ FridayBrain</a>
          <a href="https://friday-launchpad.onrender.com" target="_blank" className="nav-link">⌂ Launchpad</a>
        </div>
        <button onClick={openNew} style={{background:'linear-gradient(135deg,#a78bfa,#818cf8)',color:'white',border:'none',borderRadius:10,padding:'8px 18px',fontFamily:'Nunito',fontWeight:700,fontSize:13,cursor:'pointer'}}>+ New</button>
      </nav>

      <div className="capture-wrap">
        <input
          className="capture-input"
          placeholder="What's on your mind? Hit enter to capture ✦"
          value={captureText}
          onChange={e=>handleCaptureChange(e.target.value)}
          onKeyDown={handleKeyDown}
        />
        {detectedCat && !captureCategory && (
          <span className="auto-tag">✦ {detectedCat}</span>
        )}
        <select className="capture-select" value={captureCategory} onChange={e=>setCaptureCategory(e.target.value)}>
          <option value="">Auto-detect</option>
          {categories.map(c => <option key={c.name} value={c.name}>{c.name}</option>)}
        </select>
        <button className="btn-capture" onClick={capture}>Capture</button>
      </div>

      <div className="layout">
        <div className="sidebar">
          <div className="sidebar-section">Categories</div>
          <div className={`sidebar-item${activeCategory==='All'?' active':''}`} onClick={()=>setActiveCategory('All')}>
            <span className="sidebar-dot" style={{background:'#a78bfa'}} />
            All
            <span className="sidebar-count">{items.length}</span>
          </div>
          {categories.map(c => (
            <div key={c.name} className={`sidebar-item${activeCategory===c.name?' active':''}`} onClick={()=>setActiveCategory(c.name)}>
              <span className="sidebar-dot" style={{background:c.color}} />
              {c.name}
              {categoryCounts[c.name] > 0 && <span className="sidebar-count">{categoryCounts[c.name]}</span>}
            </div>
          ))}
        </div>

        <div className="main-content">
          <div className="stats-row">
            {[
              {label:'Total', val:filtered.length},
              {label:'To Do', val:todo.length},
              {label:'In Progress', val:inProgress.length},
              {label:'Done', val:done.length},
            ].map(s => (
              <div key={s.label} className="stat-pill">
                <strong>{s.val}</strong>
                <span>{s.label}</span>
              </div>
            ))}
          </div>

          <StageSection title="Todo" items={todo} />
          <StageSection title="In Progress" items={inProgress} />
          <StageSection title="Done" items={done} />
        </div>
      </div>

      {showModal && (
        <ItemModal
          item={editItem}
          categories={categories}
          onSave={saveItem}
          onDelete={deleteItem}
          onClose={()=>{ setShowModal(false); setEditItem(null); }}
        />
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
