<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carly Brain</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0f0f1a; color: #e2e8f0; min-height: 100vh; }
  .navbar { background: #1a1a2e; border-bottom: 1px solid rgba(255,255,255,0.08); padding: 0 24px; display: flex; align-items: center; justify-content: space-between; height: 56px; }
  .navbar h1 { font-size: 18px; font-weight: 700; color: white; }
  .navbar h1 span { color: #a78bfa; }
  .capture-bar { background: #1a1a2e; border-bottom: 1px solid rgba(255,255,255,0.08); padding: 12px 24px; display: flex; gap: 10px; align-items: center; }
  .capture-input { flex: 1; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12); border-radius: 8px; padding: 10px 16px; color: white; font-size: 15px; outline: none; transition: border-color 0.15s; }
  .capture-input::placeholder { color: rgba(255,255,255,0.3); }
  .capture-input:focus { border-color: #a78bfa; background: rgba(167,139,250,0.08); }
  .capture-select { background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12); border-radius: 8px; padding: 10px 12px; color: white; font-size: 13px; outline: none; cursor: pointer; }
  .capture-select option { background: #1a1a2e; }
  .btn-capture { background: #7c3aed; color: white; border: none; border-radius: 8px; padding: 10px 20px; font-size: 14px; font-weight: 600; cursor: pointer; transition: background 0.15s; white-space: nowrap; }
  .btn-capture:hover { background: #6d28d9; }
  .main { display: flex; height: calc(100vh - 56px - 57px); overflow: hidden; }
  .sidebar { width: 200px; background: #1a1a2e; border-right: 1px solid rgba(255,255,255,0.08); padding: 16px 0; flex-shrink: 0; overflow-y: auto; }
  .sidebar-item { padding: 8px 16px; cursor: pointer; font-size: 13px; color: rgba(255,255,255,0.6); display: flex; align-items: center; gap: 8px; border-left: 3px solid transparent; transition: all 0.15s; }
  .sidebar-item:hover { background: rgba(255,255,255,0.05); color: white; }
  .sidebar-item.active { background: rgba(167,139,250,0.1); color: white; border-left-color: #a78bfa; }
  .sidebar-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .sidebar-count { margin-left: auto; background: rgba(255,255,255,0.1); border-radius: 10px; padding: 1px 7px; font-size: 11px; }
  .sidebar-section { padding: 8px 16px 4px; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: rgba(255,255,255,0.3); margin-top: 8px; }
  .content { flex: 1; overflow-y: auto; padding: 20px 24px; }
  .status-cols { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
  .status-col { background: rgba(255,255,255,0.03); border-radius: 10px; padding: 12px; min-height: 200px; }
  .status-col-header { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: rgba(255,255,255,0.4); margin-bottom: 12px; display: flex; align-items: center; justify-content: space-between; }
  .status-col-header .count { background: rgba(255,255,255,0.08); border-radius: 8px; padding: 1px 7px; font-size: 11px; }
  .item-card { background: #1e2035; border: 1px solid rgba(255,255,255,0.08); border-radius: 8px; padding: 12px; margin-bottom: 8px; cursor: pointer; transition: all 0.15s; position: relative; }
  .item-card:hover { border-color: rgba(167,139,250,0.4); background: #23253d; transform: translateY(-1px); }
  .item-card.priority-high { border-left: 3px solid #ef4444; }
  .item-card.priority-low { border-left: 3px solid #6b7280; }
  .item-text { font-size: 14px; color: #e2e8f0; line-height: 1.5; margin-bottom: 6px; }
  .item-text.done { text-decoration: line-through; color: rgba(255,255,255,0.3); }
  .item-meta { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .cat-badge { font-size: 10px; padding: 2px 7px; border-radius: 8px; font-weight: 600; }
  .priority-badge { font-size: 10px; padding: 2px 6px; border-radius: 8px; }
  .priority-high-badge { background: rgba(239,68,68,0.2); color: #fca5a5; }
  .priority-normal-badge { background: rgba(255,255,255,0.08); color: rgba(255,255,255,0.4); }
  .priority-low-badge { background: rgba(107,114,128,0.2); color: #9ca3af; }
  .item-time { font-size: 10px; color: rgba(255,255,255,0.25); margin-left: auto; }
  .item-actions { position: absolute; top: 8px; right: 8px; display: none; gap: 4px; }
  .item-card:hover .item-actions { display: flex; }
  .action-btn { background: rgba(255,255,255,0.1); border: none; border-radius: 4px; color: rgba(255,255,255,0.6); cursor: pointer; font-size: 11px; padding: 2px 6px; }
  .action-btn:hover { background: rgba(255,255,255,0.2); color: white; }
  .action-btn.del { background: rgba(239,68,68,0.15); color: #fca5a5; }
  .action-btn.del:hover { background: rgba(239,68,68,0.3); }
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); display: flex; align-items: center; justify-content: center; z-index: 100; padding: 24px; }
  .modal { background: #1e2035; border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; max-width: 520px; width: 100%; padding: 24px; }
  .modal h2 { font-size: 16px; font-weight: 700; margin-bottom: 16px; }
  .form-group { margin-bottom: 12px; }
  .form-group label { font-size: 12px; font-weight: 600; color: rgba(255,255,255,0.5); text-transform: uppercase; letter-spacing: 0.5px; display: block; margin-bottom: 6px; }
  .form-group input, .form-group select, .form-group textarea { width: 100%; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12); border-radius: 6px; padding: 8px 12px; color: white; font-size: 14px; outline: none; }
  .form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color: #a78bfa; }
  .form-group select option { background: #1e2035; }
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .btn-row { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }
  .btn { padding: 8px 16px; border-radius: 6px; border: none; cursor: pointer; font-size: 13px; font-weight: 500; }
  .btn-primary { background: #7c3aed; color: white; }
  .btn-secondary { background: rgba(255,255,255,0.08); color: rgba(255,255,255,0.7); }
  .btn-danger { background: rgba(239,68,68,0.2); color: #fca5a5; }
  .empty-col { text-align: center; padding: 24px 12px; color: rgba(255,255,255,0.2); font-size: 12px; }
  .stats-bar { display: flex; gap: 16px; margin-bottom: 20px; flex-wrap: wrap; }
  .stat { background: rgba(255,255,255,0.04); border-radius: 8px; padding: 10px 16px; font-size: 12px; color: rgba(255,255,255,0.5); }
  .stat strong { font-size: 20px; font-weight: 800; color: white; display: block; }
  .add-cat-btn { width: 100%; padding: 8px 16px; background: none; border: 1px dashed rgba(255,255,255,0.15); border-radius: 6px; color: rgba(255,255,255,0.3); cursor: pointer; font-size: 12px; margin: 8px 12px; width: calc(100% - 24px); }
  .add-cat-btn:hover { border-color: rgba(167,139,250,0.4); color: rgba(167,139,250,0.7); }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef } = React;

const api = async (path, options = {}) => {
  const res = await fetch(path, { headers: { 'Content-Type': 'application/json' }, ...options });
  if (!res.ok) throw new Error(await res.text());
  return res.json();
};

const STATUSES = ['Todo', 'In Progress', 'Parked', 'Done'];
const STATUS_COLORS = { 'Todo': '#a78bfa', 'In Progress': '#f59e0b', 'Parked': '#6b7280', 'Done': '#10b981' };
const PRIORITIES = ['High', 'Normal', 'Low'];

const timeAgo = (dt) => {
  const diff = (Date.now() - new Date(dt)) / 1000;
  if (diff < 60) return 'just now';
  if (diff < 3600) return `${Math.floor(diff/60)}m ago`;
  if (diff < 86400) return `${Math.floor(diff/3600)}h ago`;
  return `${Math.floor(diff/86400)}d ago`;
};

function ItemCard({ item, categories, onUpdate, onDelete }) {
  const cat = categories.find(c => c.name === item.category);
  const cycleStatus = () => {
    const idx = STATUSES.indexOf(item.status);
    const next = STATUSES[(idx + 1) % STATUSES.length];
    onUpdate({ ...item, status: next });
  };

  return (
    <div className={`item-card priority-${item.priority.toLowerCase()}`} onClick={cycleStatus}>
      <div className="item-actions" onClick={e => e.stopPropagation()}>
        <button className="action-btn" onClick={() => onUpdate(item, true)}>✏️</button>
        <button className="action-btn del" onClick={() => onDelete(item.id)}>✕</button>
      </div>
      <div className={`item-text ${item.status === 'Done' ? 'done' : ''}`}>{item.text}</div>
      {item.notes && <div style={{fontSize:12,color:'rgba(255,255,255,0.35)',marginBottom:6,lineHeight:1.4}}>{item.notes}</div>}
      <div className="item-meta">
        {cat && <span className="cat-badge" style={{background: cat.color+'25', color: cat.color}}>{item.category}</span>}
        {item.priority !== 'Normal' && <span className={`priority-badge priority-${item.priority.toLowerCase()}-badge`}>{item.priority}</span>}
        <span className="item-time">{timeAgo(item.updated_at)}</span>
      </div>
    </div>
  );
}

function EditModal({ item, categories, onSave, onClose }) {
  const [form, setForm] = useState(item ? { text: item.text, category: item.category, status: item.status, priority: item.priority, notes: item.notes || '' } : { text: '', category: 'Inbox', status: 'Todo', priority: 'Normal', notes: '' });

  const handleSubmit = (e) => { e.preventDefault(); onSave(form); };

  return (
    <div className="modal-overlay" onClick={e => e.target === e.currentTarget && onClose()}>
      <div className="modal">
        <h2>{item ? 'Edit Item' : 'Add Item'}</h2>
        <form onSubmit={handleSubmit}>
          <div className="form-group"><label>What's on your mind?</label>
            <textarea rows={3} required value={form.text} onChange={e => setForm(f => ({ ...f, text: e.target.value }))} placeholder="Type anything..." style={{resize:'vertical'}} />
          </div>
          <div className="form-row">
            <div className="form-group"><label>Category</label>
              <select value={form.category} onChange={e => setForm(f => ({ ...f, category: e.target.value }))}>
                {categories.map(c => <option key={c.id} value={c.name}>{c.name}</option>)}
              </select>
            </div>
            <div className="form-group"><label>Priority</label>
              <select value={form.priority} onChange={e => setForm(f => ({ ...f, priority: e.target.value }))}>
                {PRIORITIES.map(p => <option key={p}>{p}</option>)}
              </select>
            </div>
          </div>
          <div className="form-group"><label>Status</label>
            <select value={form.status} onChange={e => setForm(f => ({ ...f, status: e.target.value }))}>
              {STATUSES.map(s => <option key={s}>{s}</option>)}
            </select>
          </div>
          <div className="form-group"><label>Notes (optional)</label>
            <textarea rows={2} value={form.notes} onChange={e => setForm(f => ({ ...f, notes: e.target.value }))} placeholder="Any extra context..." style={{resize:'vertical'}} />
          </div>
          <div className="btn-row">
            <button type="button" className="btn btn-secondary" onClick={onClose}>Cancel</button>
            <button type="submit" className="btn btn-primary">Save</button>
          </div>
        </form>
      </div>
    </div>
  );
}

function App() {
  const [items, setItems] = useState([]);
  const [categories, setCategories] = useState([]);
  const [activeFilter, setActiveFilter] = useState('all');
  const [captureText, setCaptureText] = useState('');
  const [captureCategory, setCaptureCategory] = useState('Inbox');
  const [editItem, setEditItem] = useState(null);
  const [showEdit, setShowEdit] = useState(false);
  const [showAddCat, setShowAddCat] = useState(false);
  const [newCatName, setNewCatName] = useState('');
  const captureRef = useRef(null);

  useEffect(() => {
    api('/api/categories').then(cats => { setCategories(cats); });
    api('/api/items').then(setItems);
  }, []);

  const capture = async () => {
    if (!captureText.trim()) return;
    const item = await api('/api/items', { method: 'POST', body: JSON.stringify({ text: captureText, category: captureCategory }) });
    setItems(prev => [item, ...prev]);
    setCaptureText('');
    captureRef.current?.focus();
  };

  const updateItem = async (item, openEdit = false) => {
    if (openEdit) { setEditItem(item); setShowEdit(true); return; }
    const updated = await api(`/api/items/${item.id}`, { method: 'PUT', body: JSON.stringify(item) });
    setItems(prev => prev.map(i => i.id === updated.id ? updated : i));
  };

  const deleteItem = async (id) => {
    await api(`/api/items/${id}`, { method: 'DELETE' });
    setItems(prev => prev.filter(i => i.id !== id));
  };

  const saveEdit = async (form) => {
    if (editItem) {
      const updated = await api(`/api/items/${editItem.id}`, { method: 'PUT', body: JSON.stringify({ ...editItem, ...form }) });
      setItems(prev => prev.map(i => i.id === updated.id ? updated : i));
    } else {
      const item = await api('/api/items', { method: 'POST', body: JSON.stringify(form) });
      setItems(prev => [item, ...prev]);
    }
    setShowEdit(false); setEditItem(null);
  };

  const addCategory = async () => {
    if (!newCatName.trim()) return;
    const colors = ['#f59e0b','#ef4444','#10b981','#3b82f6','#ec4899','#8b5cf6'];
    const color = colors[categories.length % colors.length];
    await api('/api/categories', { method: 'POST', body: JSON.stringify({ name: newCatName.trim(), color }) });
    const cats = await api('/api/categories');
    setCategories(cats);
    setNewCatName(''); setShowAddCat(false);
  };

  const filtered = activeFilter === 'all' ? items : activeFilter === 'high' ? items.filter(i => i.priority === 'High') : items.filter(i => i.category === activeFilter);

  const catCounts = {};
  categories.forEach(c => { catCounts[c.name] = items.filter(i => i.category === c.name && i.status !== 'Done').length; });
  const highCount = items.filter(i => i.priority === 'High' && i.status !== 'Done').length;
  const totalOpen = items.filter(i => i.status !== 'Done').length;

  const grouped = {};
  STATUSES.forEach(s => { grouped[s] = filtered.filter(i => i.status === s); });

  return (
    <div>
      <nav className="navbar">
        <h1>🧠 Carly <span>Brain</span></h1>
        <div style={{display:'flex',gap:8,alignItems:'center'}}>
          {highCount > 0 && <span style={{background:'rgba(239,68,68,0.2)',color:'#fca5a5',padding:'4px 10px',borderRadius:20,fontSize:12,fontWeight:600}}>🔴 {highCount} high priority</span>}
          <button className="btn btn-secondary" style={{fontSize:12}} onClick={()=>{setEditItem(null);setShowEdit(true);}}>+ Add</button>
        </div>
      </nav>

      <div className="capture-bar">
        <input ref={captureRef} className="capture-input" value={captureText} onChange={e=>setCaptureText(e.target.value)} placeholder="Brain dump anything... (Enter to save)" onKeyDown={e=>e.key==='Enter'&&capture()} />
        <select className="capture-select" value={captureCategory} onChange={e=>setCaptureCategory(e.target.value)}>
          {categories.map(c => <option key={c.id} value={c.name}>{c.name}</option>)}
        </select>
        <button className="btn-capture" onClick={capture}>Capture</button>
      </div>

      <div className="main">
        <div className="sidebar">
          <div className="sidebar-section">Views</div>
          <div className={`sidebar-item ${activeFilter==='all'?'active':''}`} onClick={()=>setActiveFilter('all')}>
            <span className="sidebar-dot" style={{background:'#a78bfa'}} />
            All Items
            <span className="sidebar-count">{totalOpen}</span>
          </div>
          <div className={`sidebar-item ${activeFilter==='high'?'active':''}`} onClick={()=>setActiveFilter('high')}>
            <span className="sidebar-dot" style={{background:'#ef4444'}} />
            High Priority
            {highCount > 0 && <span className="sidebar-count" style={{background:'rgba(239,68,68,0.2)',color:'#fca5a5'}}>{highCount}</span>}
          </div>

          <div className="sidebar-section" style={{marginTop:12}}>Categories</div>
          {categories.map(c => (
            <div key={c.id} className={`sidebar-item ${activeFilter===c.name?'active':''}`} onClick={()=>setActiveFilter(c.name)}>
              <span className="sidebar-dot" style={{background: c.color}} />
              {c.name}
              {catCounts[c.name] > 0 && <span className="sidebar-count">{catCounts[c.name]}</span>}
            </div>
          ))}
          {showAddCat ? (
            <div style={{padding:'8px 12px'}}>
              <input value={newCatName} onChange={e=>setNewCatName(e.target.value)} onKeyDown={e=>{if(e.key==='Enter')addCategory();if(e.key==='Escape')setShowAddCat(false);}} placeholder="Category name..." style={{width:'100%',background:'rgba(255,255,255,0.08)',border:'1px solid rgba(255,255,255,0.15)',borderRadius:6,padding:'6px 8px',color:'white',fontSize:12,outline:'none'}} autoFocus />
            </div>
          ) : (
            <button className="add-cat-btn" onClick={()=>setShowAddCat(true)}>+ Add category</button>
          )}
        </div>

        <div className="content">
          <div className="stats-bar">
            {STATUSES.map(s => (
              <div key={s} className="stat">
                <strong style={{color: STATUS_COLORS[s]}}>{grouped[s].length}</strong>
                {s}
              </div>
            ))}
          </div>

          <div className="status-cols">
            {STATUSES.map(status => (
              <div key={status} className="status-col">
                <div className="status-col-header">
                  <span style={{color: STATUS_COLORS[status]}}>{status}</span>
                  <span className="count">{grouped[status].length}</span>
                </div>
                {grouped[status].length === 0 ? <div className="empty-col">Nothing here</div> :
                  grouped[status].map(item => (
                    <ItemCard key={item.id} item={item} categories={categories} onUpdate={updateItem} onDelete={deleteItem} />
                  ))
                }
              </div>
            ))}
          </div>
        </div>
      </div>

      {showEdit && <EditModal item={editItem} categories={categories} onSave={saveEdit} onClose={()=>{setShowEdit(false);setEditItem(null);}} />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
