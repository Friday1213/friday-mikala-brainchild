<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>VIP Provider Training Hub</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Poppins:wght@600;700;800;900&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;background:#f1f5f9;color:#1e293b;min-height:100vh}
h1,h2,h3,h4,.poppins{font-family:'Poppins',sans-serif!important}
.navbar-logo,.navbar-logo span{font-family:'Poppins',sans-serif!important}
/* Poppins on all bold large text — tab headers, game titles, section heads */
[style*="fontWeight:900"],[style*="font-weight:900"],[style*="font-weight: 900"]{font-family:'Poppins',sans-serif}
.navbar{background:linear-gradient(135deg,#2d1b69,#6C3CB5);padding:0 28px;height:64px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:0 2px 16px rgba(30,58,95,0.35)}
.navbar-brand{display:flex;flex-direction:column}
.navbar-logo{font-size:20px;font-weight:900;color:white;letter-spacing:-0.3px}
.navbar-logo span{color:#93c5fd}
.navbar-sub{font-size:11px;color:#93c5fd;font-weight:700;margin-top:1px}
/* Mode toggle bar */
.mode-bar{background:#0f2240;padding:10px 24px;display:flex;align-items:center;gap:8px;position:sticky;top:64px;z-index:99;box-shadow:0 2px 8px rgba(0,0,0,0.2)}
.mode-home{background:none;border:none;color:rgba(255,255,255,0.55);font-family:'DM Sans',sans-serif;font-size:13px;font-weight:800;cursor:pointer;padding:7px 14px;border-radius:8px;transition:all 0.15s;display:flex;align-items:center;gap:6px}
.mode-home:hover{color:white;background:rgba(255,255,255,0.1)}
.mode-home.active{color:white;background:rgba(255,255,255,0.15)}
.mode-divider{width:1px;height:22px;background:rgba(255,255,255,0.15);margin:0 4px}
.mode-toggle{display:flex;background:rgba(255,255,255,0.08);border-radius:12px;padding:4px;gap:4px}
.mode-btn{border:none;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:900;cursor:pointer;padding:8px 20px;border-radius:9px;transition:all 0.18s;display:flex;align-items:center;gap:7px;letter-spacing:0.01em}
.mode-btn-clinical{background:transparent;color:rgba(255,255,255,0.6)}
.mode-btn-clinical:hover{color:white;background:rgba(172,74,189,0.2)}
.mode-btn-clinical.active{background:linear-gradient(135deg,#AC4ABD,#9333ea);color:white;box-shadow:0 2px 10px rgba(172,74,189,0.4)}
.mode-btn-admin{background:transparent;color:rgba(255,255,255,0.6)}
.mode-btn-admin:hover{color:white;background:rgba(139,92,246,0.2)}
.mode-btn-admin.active{background:linear-gradient(135deg,#6C3CB5,#AC4ABD);color:white;box-shadow:0 2px 10px rgba(124,58,237,0.4)}
/* Sub-tab bar */
.sub-bar{padding:0 20px;display:flex;gap:2px;align-items:flex-end;overflow-x:auto;scrollbar-width:none}
.sub-bar::-webkit-scrollbar{display:none}
.sub-bar-clinical{background:#2d1b69}
.sub-bar-admin{background:#4c1d95}
.tab{padding:8px 16px 10px;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:800;border:none;cursor:pointer;border-radius:10px 10px 0 0;transition:all 0.15s;white-space:nowrap;color:rgba(255,255,255,0.65);background:rgba(255,255,255,0.08);margin-top:6px}
.tab:hover{background:rgba(255,255,255,0.18);color:white}
.tab.active{background:#f1f5f9;margin-top:4px;padding-bottom:12px}
.tab.active-clinical{color:#2d1b69}
.tab.active-admin{color:#4c1d95}
.container{max-width:1080px;margin:0 auto;padding:24px 20px}
.hero{background:linear-gradient(135deg,#2d1b69,#6C3CB5);color:white;border-radius:20px;padding:32px 36px;margin-bottom:24px;position:relative;overflow:hidden}
.hero::after{content:'🏥';position:absolute;right:28px;top:50%;transform:translateY(-50%);font-size:72px;opacity:0.12}
.hero h1{font-size:26px;font-weight:900;margin-bottom:8px}
.hero p{font-size:14px;opacity:0.85;max-width:560px;line-height:1.6}
.search-wrap{background:white;border-radius:50px;padding:4px 8px 4px 20px;display:flex;gap:8px;align-items:center;margin-top:18px;max-width:480px;box-shadow:0 2px 12px rgba(0,0,0,0.15)}
.search-wrap input{flex:1;border:none;outline:none;font-family:'DM Sans',sans-serif;font-size:14px;font-weight:600;color:#1e293b;background:transparent}
.search-wrap input::placeholder{color:#94a3b8}
.search-btn{background:#1078B9;color:white;border:none;border-radius:50px;padding:8px 18px;font-family:'DM Sans',sans-serif;font-weight:800;font-size:13px;cursor:pointer}
.card{background:white;border-radius:16px;padding:24px;box-shadow:0 1px 8px rgba(0,0,0,0.06);margin-bottom:16px}
.card-title{font-size:16px;font-weight:900;color:#1e293b;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
/* Quick link tiles */
.ql-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;margin-bottom:16px}
.ql-tile{background:white;border:2px solid #e2e8f0;border-radius:14px;padding:16px 14px;cursor:pointer;transition:all 0.15s;text-align:center;text-decoration:none;color:inherit}
.ql-tile:hover{border-color:#1078B9;box-shadow:0 4px 12px rgba(29,78,216,0.12);transform:translateY(-1px)}
.ql-icon{font-size:26px;margin-bottom:8px}
.ql-label{font-size:12px;font-weight:800;color:#374151;line-height:1.3}
/* FAQ accordion */
.faq-item{border:1px solid #e2e8f0;border-radius:12px;margin-bottom:8px;overflow:hidden;background:white}
.faq-q{padding:14px 18px;cursor:pointer;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;font-size:14px;font-weight:800;color:#1e293b;line-height:1.4}
.faq-q:hover{background:#f8fafc}
.faq-chevron{color:#94a3b8;font-size:13px;flex-shrink:0;margin-top:1px}
.faq-a{padding:0 18px 16px;font-size:13px;color:#374151;line-height:1.7;border-top:1px solid #f1f5f9}
.faq-a a{color:#1078B9;font-weight:700}
.faq-a strong{color:#1e293b}
.faq-tag{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:800;margin-right:6px;margin-bottom:4px}
.tag-blue{background:#ede9fe;color:#6C3CB5}
.tag-green{background:#f3e8ff;color:#4c1d95}
.tag-amber{background:#fef3c7;color:#92400e}
.tag-red{background:#fee2e2;color:#991b1b}
.tag-purple{background:#ede9fe;color:#5b21b6}
/* Contact cards */
.contact-card{background:#f8fafc;border:1px solid #e2e8f0;border-radius:12px;padding:14px 16px;display:flex;gap:12px;align-items:flex-start}
.contact-avatar{width:38px;height:38px;border-radius:50%;background:#1078B9;color:white;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.contact-name{font-size:14px;font-weight:800;color:#1e293b}
.contact-role{font-size:11px;color:#64748b;font-weight:700;margin-top:1px}
.contact-info{font-size:12px;color:#1078B9;margin-top:4px;font-weight:700}
/* Checklist */
.checklist{list-style:none}
.checklist li{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-bottom:1px solid #f1f5f9;font-size:13px;color:#374151;line-height:1.5}
.checklist li:last-child{border-bottom:none}
.checklist li::before{content:'☐';font-size:16px;color:#94a3b8;flex-shrink:0;line-height:1.2}
.checklist li.done::before{content:'✅';color:#22c55e}
/* Highlight boxes */
.hbox{border-radius:12px;padding:14px 18px;margin-bottom:12px}
.hbox-blue{background:#faf5ff;border-left:4px solid #3b82f6}
.hbox-green{background:#faf5ff;border-left:4px solid #22c55e}
.hbox-amber{background:#fefce8;border-left:4px solid #eab308}
.hbox-red{background:#fef2f2;border-left:4px solid #ef4444}
.hbox-purple{background:#faf5ff;border-left:4px solid #a855f7}
.hbox-title{font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:0.06em;color:#64748b;margin-bottom:6px}
.hbox-body{font-size:13px;color:#374151;line-height:1.6}
/* Step list */
.step-list{list-style:none;counter-reset:s}
.step-list li{counter-increment:s;display:flex;gap:12px;margin-bottom:12px;align-items:flex-start;font-size:13px;color:#374151;line-height:1.6}
.step-list li::before{content:counter(s);background:#1078B9;color:white;min-width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:900;flex-shrink:0;margin-top:1px}
.section-label{font-size:11px;font-weight:900;color:#94a3b8;text-transform:uppercase;letter-spacing:0.07em;margin-bottom:8px}
.divider{font-size:11px;font-weight:900;color:#94a3b8;text-transform:uppercase;letter-spacing:0.07em;padding:14px 0 8px;border-top:1px solid #f1f5f9;margin-top:4px}
.search-result-item{border:1px solid #e2e8f0;border-radius:12px;padding:12px 16px;margin-bottom:8px;background:white;cursor:pointer}
.search-result-item:hover{border-color:#1078B9;background:#f8fafc}
.sri-title{font-size:14px;font-weight:800;color:#1e293b;margin-bottom:4px}
.sri-excerpt{font-size:12px;color:#64748b;line-height:1.5}
.sri-section{font-size:11px;font-weight:800;color:#1078B9;margin-top:4px}
em.hl{background:#fef08a;border-radius:3px;font-style:normal;padding:0 2px}
@media(max-width:680px){.grid-2,.grid-3{grid-template-columns:1fr}.hero{padding:20px}.hero::after{display:none}}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script type="text/babel">
const { useState, useMemo } = React;

// ── SEARCH DATA ───────────────────────────────────────────────────────────────
const SEARCH_INDEX = [
  { section:'Getting Started', q:'What should I do before my first day?', a:'Complete your pre-arrival checklist: select benefits on Rippling, choose scrub/white coat size, set up two-factor authentication on Gmail per IT instructions, add your email signature, complete Jumpcloud login setup, and set up your digital signature.' },
  { section:'Getting Started', q:'What do I wear on my first day?', a:'Wear dark scrubs. Most MDs and APPs wear black.' },
  { section:'Getting Started', q:'What happens on my first day?', a:'Meet the onboarding team at your designated clinic. You\'ll tour the office, finish setting up your computer, get Nextech and Medwork set up, and begin seeing scheduled patients — starting with shadowing, then supervised visits, then solo. Goal is to confidently complete an initial visit with vein talk by end of day.' },
  { section:'Systems', q:'What is Nextech used for?', a:'Nextech is your EMR. It handles clinical documentation, patient charts, and generates visit and procedure bills. Daily login: make sure to change your location to the clinic of the day.' },
  { section:'Systems', q:'What is Medwork used for?', a:'Medwork is the CRM. It tracks patient leads, monitors insurance auth status, tracks completion of approved procedures, and makes sure no leads, patients, or procedures are left behind. The provider-specific prior auth list is the most frequently used feature.' },
  { section:'Systems', q:'What is Luma used for?', a:'Luma handles patient engagement and communication: automated reminders, digital intake forms, secure patient messaging, and post-visit instructions.' },
  { section:'Systems', q:'What is Ring Central used for?', a:'Ring Central is the Provider Emergency Line and is used for post-procedure check-ins with patients. It is NOT for scheduling or admin calls.' },
  { section:'Systems', q:'What is Rippling used for?', a:'Rippling is the HR portal. Use it for your schedule, benefit registration, PTO requests, and HR documents.' },
  { section:'Systems', q:'How do I sign notes in Nextech?', a:'Ideally sign notes within 24 hours. Do NOT sign same-day — techs need time to finish notes and adjust PRN for insurance. On busy days, sign at end of day or first thing in the morning. If you have pop-ups on your to-do list, you have delinquent notes. For tech issues, email IT with a screenshot of your signature settings and your ANYDESK ID.' },
  { section:'Systems', q:'What are the different appointment/note types in Nextech?', a:'Initial, US Review, Procedure, Follow Up (post-procedure, 1 mo, 3 mo, 6 mo, 9 mo, f/u other), Conservative Review, plus separate notes for US results, compression Rx, and US orders. The EMN type must match what was actually done — this is critical for billing.' },
  { section:'Systems', q:'What are the Note Section / Social Notes used for?', a:'The Note section is for intra-office personal use (not part of the official medical record). You must place a note for every patient you see. Use it to avoid awkward re-introductions, help the call center, and capture personal details for rapport-building (e.g., "patient\'s son is starting college at GW").' },
  { section:'Systems', q:'How does prior authorization work?', a:'After a US review, tell staff to submit for procedures. The tech clicks a box in the review note generating a LOMN. The LOMN team reviews, ensures medical necessity criteria are met, and passes to the PA team who submits to insurance and follows up. Check status via Medwork. Always verify PA is approved for the correct provider, location, and dates before performing a procedure.' },
  { section:'Systems', q:'What are the PA email contacts by region?', a:'NYC Vein (Midtown, FIDI, Bronx, Brooklyn): NYC Vein PA@lomn | Long Island: LI Vein PA | Hartsdale: Hartsdale Vein PA | Maryland/DC: MD Vein PA | New Jersey: NJ Vein PA | California (SD, SJ, PA): SD/SJ/PA Vein | Connecticut: CT Vein PA | Texas: TX Vein PA' },
  { section:'FAQs', q:'How do I call out sick or handle a family emergency?', a:'As soon as you know you\'ll be out, EMAIL Gabriella Soares, Dr. Caroline Novak, HR, and your ROD. They will initiate rescheduling patients and relocating staff.' },
  { section:'FAQs', q:'How do I block days for a meeting or personal appointment?', a:'Enter the block yourself in Nextech (include a reason if under 1 hour), then email your region-specific scheduling listserv (e.g. nyc.veinscheduling@vipmedicalgroup.com) and cc Gabriella Soares.' },
  { section:'FAQs', q:'What do I do if there is a scheduling error?', a:'Email schedulingerror@vipmedicalgroup.com. Mistakes happen — sending them to the team helps identify patterns and improve workflow.' },
  { section:'FAQs', q:'What do I do if there is no front desk?', a:'Sonographers should know how to check in patients, scan insurance, verify coverage, collect copays, and schedule patients. Marjorie Vandermeulen can help set up a virtual front desk via iPad.' },
  { section:'FAQs', q:'How do I handle a walk-in patient?', a:'If you have reasonable availability, try to accommodate. Collect insurance and ID, send to verification-team@medwork.io marked URGENT. If the schedule can\'t accommodate, ask front desk to collect info and schedule an appointment.' },
  { section:'FAQs', q:'How do I request vacation or time off?', a:'Request in Rippling. If no response within a week, email HR and cc Dr. Caroline Novak with your dates and note it was requested in Rippling. Always request at least one month in advance — ideally more. You can take up to two consecutive weeks.' },
  { section:'FAQs', q:'What do I do with an unhappy patient?', a:'Room the patient quickly to get them out of the waiting room. Inform the doctor who should come quickly to mitigate. Leave a note in the chart and email customerservice@medwork.io. To "fire" a patient (DNC), reach out to Dr. Caroline Novak and customerservice@medwork.io with full context.' },
  { section:'FAQs', q:'How do I handle medical records requests?', a:'Have the front desk handle all records requests. If you receive a direct request, reply to all MR team emails within 24-48 hours. For insurance requests, skim and reply "approved." For non-insurance, review and consider a brief cover letter.' },
  { section:'FAQs', q:'How do I write a work or jury duty excuse note?', a:'Email/chat your front desk the text in quotes (e.g. "To Whom It May Concern — Patient had procedures on [date]...") and ask them to place it on letterhead. For jury duty, stay vague — you can provide lifestyle modifications and exercise restrictions, but you cannot excuse a patient from jury duty — that is for a judge.' },
  { section:'FAQs', q:'What is the supply closet/login password?', a:'Usually 4141 for supply closets. Passwords/logins are usually 414141. For inventory requests: inventorymanager@vipmedicalgroup.com. For facility issues (leak, AC, etc.): facilities@vipmedicalgroup.com.' },
  { section:'FAQs', q:'What about the after-hours / emergency line?', a:'Login info sent to your Gmail — use the Ring Central app. Expectations: respond within 24 hours to after-hours communications. Redirect scheduling requests to the appropriate team. If working with an APP, MDs and APPs share monitoring on an alternating schedule.' },
  { section:'Clinical', q:'What should I expect at an initial consultation?', a:'MA/sonographer does intake → presents to MD/APP at a med-student level. MD/APP confirms history and does the Vein Talk (script and slides). Sonographer scans (~35 min). Front desk checks out and books next appointment. Timing: 10-15 min intake, 10-15 min physician encounter, 35 min scan. Never let patients leave without their next appointment scheduled.' },
  { section:'Clinical', q:'What is the Vein Talk?', a:'A scripted but adaptable patient education session explaining venous insufficiency pathophysiology, the patient\'s individual risk factors, and next steps. Always do the vein talk — even if a patient has seen another doctor. Use the script and slides from your Google Drive Resource Folder. Develop your own style over time.' },
  { section:'Clinical', q:'What are the classic symptoms of vein disease?', a:'Dull, achy, heavy, fatigue, throbbing — worse at end of day, worse with prolonged standing or sitting. Often improves with elevation or compression. Symptoms are subtle and progress slowly. Always try to elicit symptoms even if the sonographer says "asymptomatic" or "only cosmetic."' },
  { section:'Clinical', q:'What are the US thresholds for treatment?', a:'Minimum vein diameter: 3 mm. Minimum reflux time: 500 ms. Proximal GSV → RFA. Distal GSV → Varithena (UGFS). SSV → RFA. Varicose veins → UGFS. Duplicate veins → anatomy dependent.' },
  { section:'Clinical', q:'When is conservative therapy required?', a:'Many insurers require a documented conservative trial (usually 6 or 12 weeks of compression stocking use) before approving procedures. Always prescribe compression stockings at the first visit so the clock starts. Check the Vein Policy Hub for payer-specific requirements. Exceptions: active VV rupture, ulceration, recurrent thrombophlebitis.' },
  { section:'Clinical', q:'How does the conservative therapy workflow go?', a:'6-week trial: Initial → Conservative Review → 6-week phone follow-up with RN → Auth submitted → patient called to schedule when approved. 12-week trial: Initial → Conservative Review → 6-week follow-up visit → 12-week phone follow-up → Auth submitted → procedures scheduled.' },
  { section:'Clinical', q:'What is the US Review appointment?', a:'The second visit where physician reviews scan results with patient, explains treatment plan, and communicates plan to the IB team. When you leave the room, communicate the plan to the sonographer: e.g. "BL GSV RFA, BL Varithena x2." Patient leaves without a scheduled appointment — the team calls them when procedures are approved.' },
  { section:'Clinical', q:'What happens at follow-up appointments?', a:'Post-procedure scan: ideally 3-7 days post-procedure (acceptable 2 days to 2 weeks). Always take new photos at every follow-up. Schedule full scans at 1, 3, 6, 9, and 12 months with photos.' },
  { section:'Clinical', q:'What are the Varithena CPT codes?', a:'CPT 36465: Injection of foam sclerosant into a single incompetent extremity truncal vein (ultrasound guided). CPT 36466: Injection into multiple incompetent extremity truncal veins in the same leg. These apply to GSV, SSV, and their accessory veins.' },
  { section:'Clinical', q:'What is phlebolymphedema?', a:'The coexistence of chronic venous insufficiency (CVI) and lymphedema. Caused by lymphatic overload from chronic venous hypertension, leading to lymphatic dysfunction and protein-rich fluid accumulation. Management includes compression therapy (Class II 20-30 mmHg), CDT (complete decongestive therapy) via certified lymphedema therapist, and venous ablation if significant reflux confirmed. VIP uses Tactile as the main referral for pneumatic compression pumps.' },
  { section:'Protocols', q:'What is the needlestick injury protocol?', a:'1. Assess risk and document in Nextech using the Needlestick Protocol note. 2. Ask patient about HBV vaccination, needle contamination, recent HBV/HCV/HIV testing, and risk factors. 3. Get verbal consent for testing and document it. 4. Contact Medical Directors IMMEDIATELY (Dr. Caroline Novak / Dr. Schoenfeld for Vein; Dr. Hanna for Pain). 5. Send patient to Quest Diagnostics — VIP reimburses travel and testing costs (patient brings receipt). 6. Email HR to complete OSHA incident form at hr@vipmedicalgroup.com. Tests: Rapid HIV, HCV antibody, HBV antigen and antibody. For employees: go to ER/Urgent Care/Concentra immediately. NYC employees: NYU ED at 570 1st Ave. Workers Comp: AP Intego Insurance Group, Policy #76WEGZU7497.' },
  { section:'Protocols', q:'What do I do for an aborted procedure?', a:'You still bill for an aborted procedure — supplies and time were used. Make sure to free-text the note to include the reason for aborting. If a patient checks in but the visit is determined to be in error (scheduling/insurance issue), you can reschedule or remove the appointment.' },
  { section:'Marketing', q:'How does the referral system work?', a:'Outbound: Clinical staff generate a Nextech Outbound Referral Form → referrals team sends via email/fax. Inbound: Referrals team creates profile on ClickUp, Medwork, and Nextech, contacts patient 4+ times to book. Internal (Vein ↔ Pain): Generate Nextech Internal Referral Form or book directly using the Internal Referrals Appointment Type.' },
  { section:'Marketing', q:'What are my marketing responsibilities?', a:'Attend an introductory meeting with the CMO. Participate in an onboarding photoshoot (coordinated by marketing). Encourage social media — marketing handles editing and publishing. Submit Before & After photos 2x/month. Encourage Google reviews — QR codes and email templates are available.' },
];

// ── FAQ ITEM ────────────────────────────────────────────────────────────────
function FaqItem({ q, a, section, highlight }) {
  const [open, setOpen] = useState(false);
  const hl = (text) => {
    if (!highlight) return text;
    const re = new RegExp(`(${highlight.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')})`, 'gi');
    const parts = text.split(re);
    return parts.map((p,i) => re.test(p) ? <em key={i} className="hl">{p}</em> : p);
  };
  return (
    <div className="faq-item">
      <div className="faq-q" onClick={()=>setOpen(o=>!o)}>
        <span>{hl(q)}</span>
        <span className="faq-chevron">{open ? '▲' : '▼'}</span>
      </div>
      {open && (
        <div className="faq-a">
          {section && <div style={{marginBottom:8}}><span className="faq-tag tag-blue">{section}</span></div>}
          <div style={{whiteSpace:'pre-wrap'}}>{hl(a)}</div>
        </div>
      )}
    </div>
  );
}

// ── HOME TAB ────────────────────────────────────────────────────────────────
function HomeTab({ setMode, setAdminTab, setClinicalTab }) {
  const go = (mode, sub) => {
    if (mode === 'admin') { setAdminTab(sub); setMode('admin'); }
    else { setClinicalTab(sub); setMode('clinical'); }
  };
  const quickLinks = [
    { icon:'📋', label:'Getting Started', mode:'admin', sub:'start' },
    { icon:'🛠️', label:'Tools & Systems', mode:'admin', sub:'systems' },
    { icon:'🩺', label:'Clinical Guide', mode:'clinical', sub:'clinical' },
    { icon:'💉', label:'Treatments', mode:'clinical', sub:'treatment' },
    { icon:'🔬', label:'Procedures', mode:'clinical', sub:'procedures' },
    { icon:'⚠️', label:'Complications', mode:'clinical', sub:'complications' },
    { icon:'🔤', label:'Glossary', mode:'clinical', sub:'glossary' },
    { icon:'📞', label:'P2P Calls', mode:'clinical', sub:'p2p' },
    { icon:'🏅', label:'RPhS Cert Prep', mode:'clinical', sub:'rphs' },
  { icon:'📞', label:'Peer-to-Peer Calls', mode:'clinical', sub:'p2p' },
    { icon:'❓', label:'FAQs', mode:'admin', sub:'faq' },
    { icon:'📞', label:'Contacts', mode:'admin', sub:'contacts' },
    { icon:'🚨', label:'Protocols', mode:'admin', sub:'protocols' },
    { icon:'🎯', label:'Marketing', mode:'admin', sub:'marketing' },
    { icon:'🔗', label:'Resources & Links', mode:'admin', sub:'resources' },
  ];
  return (
    <div>
      <div className="card">

function TreatmentSequenceGame() {
  const STEPS = [
    'Initial',
    'Review + Rescan (conservative)',
    '6-week call with RN',
    'L GSV RFA',
    'R GSV RFA + L GSV post-scan',
    'L SSV RFA + R GSV post-scan',
    'R GSV Varithena + L SSV post-scan',
    'L GSV Varithena + R GSV Varithena post-scan',
    'L GSV Varithena post-scan (+/- cosmetics)',
    '1 mo — full scan of all treated veins, PHOTOS',
    '3 mo — full scan, PHOTOS',
    '6 mo — scan PRN, PHOTOS (graduate if doing great)',
    '9 mo — scan PRN, PHOTOS',
    '12 mo — scan PRN, PHOTOS',
  ];

  const [mode, setMode] = React.useState('idle'); // idle | playing | done
  const [items, setItems] = React.useState([]);
  const [dragging, setDragging] = React.useState(null);
  const [dragOver, setDragOver] = React.useState(null);
  const [checked, setChecked] = React.useState(null); // array of booleans
  const [score, setScore] = React.useState(0);

  function shuffle(arr) {
    const a = [...arr]; for (let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a;
  }

  function startGame() {
    setItems(shuffle(STEPS.map((s,i)=>({id:i,text:s}))));
    setChecked(null); setScore(0); setMode('playing');
  }

  function handleDragStart(idx) { setDragging(idx); }
  function handleDragOver(e, idx) { e.preventDefault(); setDragOver(idx); }
  function handleDrop(e, idx) {
    e.preventDefault();
    if (dragging === null || dragging === idx) { setDragging(null); setDragOver(null); return; }
    const next = [...items];
    const [moved] = next.splice(dragging, 1);
    next.splice(idx, 0, moved);
    setItems(next);
    setDragging(null); setDragOver(null);
  }

  function checkAnswer() {
    const results = items.map((item, i) => item.id === i);
    const correct = results.filter(Boolean).length;
    setChecked(results);
    setScore(correct);
    setMode('done');
  }

  const allCorrect = score === STEPS.length;

  return React.createElement('div', {style:{marginTop:20,borderRadius:14,border:'2px solid #e9d5ff',overflow:'hidden'}},
    // Header
    React.createElement('div', {style:{background:'linear-gradient(135deg,#2d1b69,#AC4ABD)',padding:'14px 20px',display:'flex',justifyContent:'space-between',alignItems:'center',flexWrap:'wrap',gap:8}},
      React.createElement('div', null,
        React.createElement('div', {style:{fontWeight:900,fontSize:15,color:'white',fontFamily:'Poppins,sans-serif'}}, '🎮 Sequence Game — Put It In Order'),
        React.createElement('div', {style:{fontSize:12,color:'rgba(255,255,255,0.8)',marginTop:2}}, 'Drag the steps into the correct treatment order')
      ),
      mode === 'idle' && React.createElement('button', {onClick:startGame,
        style:{background:'white',color:'#2d1b69',border:'none',borderRadius:8,padding:'8px 18px',fontWeight:900,fontSize:13,cursor:'pointer'}}, '▶ Start Game'),
      mode !== 'idle' && React.createElement('button', {onClick:startGame,
        style:{background:'rgba(255,255,255,0.2)',color:'white',border:'none',borderRadius:8,padding:'8px 18px',fontWeight:800,fontSize:12,cursor:'pointer'}}, '🔄 Restart')
    ),

    // Idle state
    mode === 'idle' && React.createElement('div', {style:{padding:'24px',textAlign:'center',color:'#64748b',fontSize:13,background:'#faf5ff'}},
      'Steps will be shuffled — drag them back into the correct order, then hit Check!'
    ),

    // Playing
    mode === 'playing' && React.createElement('div', {style:{padding:'14px',background:'#faf5ff'}},
      React.createElement('div', {style:{fontSize:12,color:'#7c3aed',fontWeight:700,marginBottom:10,textAlign:'center'}},
        '☝️ Drag to reorder — then tap Check Answer when ready'
      ),
      items.map((item, idx) =>
        React.createElement('div', {
          key:item.id,
          draggable:true,
          onDragStart:()=>handleDragStart(idx),
          onDragOver:(e)=>handleDragOver(e,idx),
          onDrop:(e)=>handleDrop(e,idx),
          onDragEnd:()=>{setDragging(null);setDragOver(null);},
          style:{
            display:'flex', alignItems:'center', gap:10,
            padding:'9px 12px', marginBottom:6, borderRadius:10,
            background: dragOver===idx ? '#ede9fe' : 'white',
            border: `2px solid ${dragOver===idx?'#AC4ABD':'#e2e8f0'}`,
            cursor:'grab', transition:'all 0.1s',
            opacity: dragging===idx ? 0.4 : 1,
            boxShadow: dragging===idx ? '0 4px 12px rgba(172,74,189,0.2)' : '0 1px 3px rgba(0,0,0,0.05)',
          }
        },
          React.createElement('div', {style:{color:'#94a3b8',fontSize:14,flexShrink:0}}, '⠿'),
          React.createElement('div', {style:{background:'#e9d5ff',color:'#6b21a8',width:22,height:22,borderRadius:'50%',display:'flex',alignItems:'center',justifyContent:'center',fontSize:10,fontWeight:900,flexShrink:0}}, idx+1),
          React.createElement('div', {style:{fontSize:13,color:'#1e293b',flex:1}}, item.text)
        )
      ),
      React.createElement('button', {onClick:checkAnswer,
        style:{width:'100%',marginTop:10,padding:'12px',background:'#2d1b69',color:'white',border:'none',borderRadius:10,fontWeight:900,fontSize:14,cursor:'pointer'}},
        '✅ Check Answer'
      )
    ),

    // Done
    mode === 'done' && React.createElement('div', {style:{padding:'14px',background:'#faf5ff'}},
      React.createElement('div', {style:{textAlign:'center',padding:'16px',marginBottom:14,background:allCorrect?'#f0fdf4':'#faf5ff',borderRadius:12,border:`2px solid ${allCorrect?'#22c55e':'#e9d5ff'}`}},
        React.createElement('div', {style:{fontSize:36,marginBottom:6}}, allCorrect?'🏆':score>=10?'🎉':score>=7?'💪':'📚'),
        React.createElement('div', {style:{fontSize:20,fontWeight:900,color:'#1e293b',fontFamily:'Poppins,sans-serif'}}, score+' / '+STEPS.length+' correct'),
        React.createElement('div', {style:{fontSize:13,color:'#64748b',marginTop:4}},
          allCorrect ? 'Perfect! You know the sequence cold. 🌟' :
          score>=10 ? 'Almost there — review the highlighted steps' :
          'Check the red steps and try again!'
        )
      ),
      items.map((item, idx) =>
        React.createElement('div', {key:item.id,
          style:{display:'flex',alignItems:'center',gap:10,padding:'9px 12px',marginBottom:6,borderRadius:10,
            background: checked[idx]?'#f0fdf4':'#fff1f2',
            border:`2px solid ${checked[idx]?'#22c55e':'#fca5a5'}`}},
          React.createElement('div', {style:{width:22,height:22,borderRadius:'50%',background:checked[idx]?'#22c55e':'#ef4444',
            color:'white',display:'flex',alignItems:'center',justifyContent:'center',fontSize:11,fontWeight:900,flexShrink:0}},
            checked[idx]?'✓':idx+1
          ),
          React.createElement('div', {style:{flex:1,fontSize:13,color:'#1e293b'}}, item.text),
          !checked[idx] && React.createElement('div', {style:{fontSize:11,color:'#ef4444',fontWeight:700,flexShrink:0}},
            `→ should be #${item.id+1}`
          )
        )
      )
    )
  );
}

function FaqTab({ searchQ }) {
  const [q, setQ] = useState(searchQ || '');
  const [section, setSection] = useState('All');
  const sections = ['All','Getting Started','Systems','Clinical','FAQs','Protocols','Marketing'];

  const filtered = useMemo(() => {
    return SEARCH_INDEX.filter(item => {
      const matchSection = section === 'All' || item.section === section;
      const matchQ = !q || item.q.toLowerCase().includes(q.toLowerCase()) || item.a.toLowerCase().includes(q.toLowerCase());
      return matchSection && matchQ;
    });
  }, [q, section]);

  return (
    <div>
      <div className="card" style={{marginBottom:16}}>
        <div className="card-title">❓ Frequently Asked Questions</div>
        <div style={{display:'flex',gap:10,flexWrap:'wrap',marginBottom:14}}>

            <button key={s} onClick={()=>setSection(s)} style={{padding:'7px 14px',borderRadius:20,border:'none',cursor:'pointer',fontSize:12,fontWeight:800,background:section===s?'#1078B9':'#e2e8f0',color:section===s?'white':'#475569',transition:'all 0.15s'}}>{s}</button>
          ))}
        </div>
        <input value={q} onChange={e=>setQ(e.target.value)} placeholder="Search all FAQs..." style={{width:'100%',padding:'10px 16px',border:'2px solid #e2e8f0',borderRadius:10,fontFamily:'DM Sans',fontSize:14,fontWeight:600,outline:'none'}} />
        <div style={{fontSize:12,color:'#94a3b8',marginTop:8,fontWeight:600}}>{filtered.length} result{filtered.length!==1?'s':''}</div>
      </div>
      {filtered.length === 0 && <div style={{textAlign:'center',padding:48,color:'#94a3b8'}}>No FAQs match your search</div>}

  );
}

        <div className="hbox hbox-green" style={{marginBottom:14}}>
          <div className="hbox-title">💡 A Note on Aborted Procedures</div>
          <div className="hbox-body">Aborted ablations are a normal part of vein practice and happen to every provider regardless of experience. Veins can be too small, spasm unexpectedly, or have challenging anatomy — none of which reflect on your skills. What matters is keeping the patient safe, documenting clearly, and communicating next steps.</div>
        </div>

        <div className="section-label">Step-by-Step Protocol</div>
        <div className="grid-2" style={{marginBottom:14}}>
          <div className="card" style={{margin:0,boxShadow:'none',border:'1px solid #e2e8f0'}}>

            <ul className="step-list">

          </div>
        </div>

        <div className="card" style={{margin:'0 0 14px',boxShadow:'none',border:'1px solid #e2e8f0'}}>
          <div style={{fontWeight:900,fontSize:13,color:'#1e293b',marginBottom:10}}>3️⃣ Nextech Documentation (Physician Responsibility)</div>
          <ul className="step-list">
            {['Change the EMN title to: <strong>ABLATION - ABORTED</strong>',
              'Complete the required section in the note so it turns green (this generates the narrative)',
              'Edit the auto-generated narrative to accurately reflect what occurred — including an alteration of your plan',
              'For any reattempt: a new LOMN must be created for resubmission. Email <strong>PA Aborted Procedures</strong> immediately',
              'Do not reschedule for same or next day — allow 3–7 days for new authorization'].map((s,i)=>(
              <li key={i} dangerouslySetInnerHTML={{__html:s}} />
            ))}

        <div className="card" style={{margin:'0 0 14px',boxShadow:'none',border:'1px solid #e2e8f0'}}>

            The target vein was accessed under ultrasound guidance using the Seldinger technique. A guide wire was introduced through the needle, and a 7F sheath was successfully placed and flushed. At this point, further progression of the procedure was aborted due to <strong>[insert reason: e.g., inability to advance catheter, vein spasm, thrombosis, small caliber vein]</strong>.<br/><br/>
            The sheath and wire were removed, and hemostasis was obtained with direct pressure at the access site. A sterile bandage and compression wrap were applied. The patient tolerated the procedure well and was fully ambulatory at the time of discharge.<br/><br/>

        <div className="grid-2">

            <div className="hbox-title">Nervous Patients — Pre-Procedure</div>
            <div className="hbox-body">Consider 0.5mg PO Xanax (encourage patient to get from PCP). Tell them to arrange a ride. Rare need — "like dental work, but on your leg." Avoid general anesthesia — risks outweigh procedure risks.</div>

          <div className="hbox hbox-blue">
            <div className="hbox-title">4️⃣ Questions & Escalation</div>

          <div className="hbox hbox-purple">
            <div className="hbox-title">Session Limits</div>
            <div className="hbox-body"><strong>Per session max:</strong> 2 IVs, 1 body position, OR 10cc total — whichever comes first.<br/>Exception: impatient patient → can do more IVs/positions but <strong>never exceed 10cc total</strong> for safety.</div>
          </div>
          <div className="hbox hbox-blue">
            <div className="hbox-title">Needle Selection</div>
            <div className="hbox-body">
              <div>• <strong>Catheter:</strong> Veins deeper than 1–1.5cm, veins within fascia (saphenous veins almost always use catheter)</div>
              <div style={{marginTop:4}}>• <strong>Butterfly:</strong> Veins &lt;1cm from skin (most varicosities). Rule of thumb: visible vein, no ultrasound needed → butterfly!</div>
            </div>
          </div>
        </div>
        <div className="section-label">Classic Plan — Distal GSV with Mid-Calf Perforators</div>
        <ul className="step-list">
          {['Staff prescans and marks perforators. Rule: any perf >50% diameter of GSV → compress it and inject past, OR go proximal',
            'Place all IVs BEFORE injecting any sclero (injecting first causes vein to spasm)',
            'Place catheter distal to the perf → attach closed stopcock',
            'Place catheter just proximal to the perf',
            'Inject proximal portion while holding pressure on the perf → remove proximal IV',
            'Inject distal portion while holding pressure on perf and proximal IV site (~1 minute)',
            'Call for foam. Staff should be making Tessari foam or readying Varithena when they see flash',
            'Inject slowly: ½–1cc every 20 seconds. Watch for bruising (extravasation). Massage and scan — watch it travel up the saphenous vein, check if going deep',
            'If foam goes deep: point and flex toe, calf raises x20 before dressing. Consider earlier follow-up (non-billable)',
            'Scan in multiple planes — quick pass posterior and lateral calf even if GSV is medial'].map((s,i)=><li key={i}>{s}</li>)}
        </ul>
        <div className="grid-2" style={{marginTop:12}}>
          <div>
            <div className="section-label">Goals by Vein</div>
            {[['GSV','Close proximal ⅓ of calf (essential). Distal ⅓ rarely needed. Middle ⅓ — assess: large VVs/tribs? GSV large or refluxing?'],
              ['Any VV','Understand source (closed saphenous vs perf vs both). Compress any connections to deep system. Inject distal → proximal.']].map(([v,d])=>(

              </div>
            ))}
          </div>
          <div>
            <div className="section-label">⚠️ Special Considerations</div>
            {['Lactating women must pump and dump for 48 hours post-procedure',
              'Headache/migraine immediately after injection → STOP, lay on left side, wait 1 hour. If not resolved → send to ER. If resolved → refer to cardiology to rule out PFO before more foam',
              'Smokers: terrible phlebitis → prefer phlebectomy',
              'Tamoxifen: widespread phlebitis risk — use with caution'].map((s,i)=>(
              <div key={i} style={{fontSize:12,color:'#374151',padding:'5px 0',borderBottom:'1px solid #f1f5f9',display:'flex',gap:6}}><span style={{color:'#ef4444'}}>⚠️</span>{s}</div>
            ))}
          </div>
        </div>
        <div className="section-label" style={{marginTop:14}}>Post-Procedure Results & Management</div>
        <div className="hbox hbox-green">
          <div className="hbox-body">
            <div>• Vein will be hard and palpable for 3 weeks–3 months, then shrinks. Barely palpable at 6 months — <strong>reassure patients</strong></div>
            <div style={{marginTop:4}}>• Hyperpigmentation: mild, like a bruise, fades by 1 year in &gt;95%. Recommend Shea Butter or Dermaka</div>
            <div style={{marginTop:4}}>• Significant phlebitis → consider trigger point injection: methylpred 1 vial (~2cc) + 2-3cc lido, inject at most dense phlebitis area under US</div>
          </div>
        </div>
      </T>

      <T id="cosmetic" title="✨ Cosmetic Sclerotherapy">
        <div className="hbox hbox-blue" style={{marginBottom:14}}>
          <div className="hbox-title">Indications</div>
          <div className="hbox-body">Patient negative for VI, OR positive for mild reflux but asymptomatic. If any reflux present: set expectations that veins will return sooner since the underlying problem isn't addressed.</div>
        </div>
        <div className="grid-2" style={{marginBottom:14}}>
          <div>
            <div className="section-label">Medication</div>
            {[['Polidocanol (Asclera)','Liquid only for cosmetics'],['Concentration','0.5% standard; rarely 1% for reticulars'],['Mix ratio','NSS + poli 9:1 (diluted in vial = 0.5%)'],['Foam option','2.5cc air + 0.8cc poli (higher pigmentation risk)'],['Max per leg','6 × 3cc syringes (18cc total)'],['Session max','10cc including any Varithena received that day']].map(([k,v])=>(
              <div key={k} style={{fontSize:13,padding:'5px 0',borderBottom:'1px solid #f1f5f9',display:'flex',gap:8}}>
                <span style={{fontWeight:800,color:'#1e293b',minWidth:130}}>{k}</span>
                <span style={{color:'#64748b'}}>{v}</span>
              </div>
            ))}

          <div>
            <div className="section-label">Pricing</div>
            <div className="hbox hbox-green" style={{marginTop:0}}>
              <div className="hbox-body">
                <div>• <strong>$1,000 per leg/per session</strong> (location-dependent)</div>
                <div style={{marginTop:4}}>• Not by area, injection, or time increment</div>
                <div style={{marginTop:4}}>• Large area (entire lateral thigh): $750, but second round complimentary</div>
                <div style={{marginTop:4}}>• Refer to Patient Success to provide quote with anticipated sessions</div>
                <div style={{marginTop:4}}>• Do NOT offer payment plans for cosmetic treatments</div>
              </div>
            </div>
          </div>
        </div>
        <div className="section-label">Injection Technique</div>
        <ul className="step-list">
          {['Bevel up, same angle as the vein. Stretch skin with one hand or vein light',
            'Aim at the center of the patch if possible. Anything that blanches will see improvement',
            'If vein flushes/blanches → keep going. If you see a wheal → stop. Inject up to ~1cc SLOWLY',
            'Large clusters (≥1mm): hold manual pressure briefly after injecting each area',
            'Change needle tip every 5–10 injections (tip gets dull)',
            'Avoid injecting below the medial malleolus without guidance from experienced injector',
            'Use cotton balls for extra compression on larger reticulars/spiders to avoid trapped blood'].map((s,i)=><li key={i}>{s}</li>)}
        </ul>
        <div className="grid-2" style={{marginTop:12}}>
          <div className="hbox hbox-amber">
            <div className="hbox-title">Hyperpigmentation Risk Groups</div>
            <div className="hbox-body">Light-skinned Hispanic, biracial or light-skinned African American, South Asian (Indian/Pakistani). Very difficult to predict — always set expectations and show photos. Consider test injection first (1cc above the knee, hidden).</div>
          </div>
          <div className="hbox hbox-green">
            <div className="hbox-title">Aftercare</div>
            <div className="hbox-body">
              <div>• Gauze wrap tightly, then compression/ACE for 24 hours</div>
              <div>• Shower after 24 hours (cool, quick)</div>
              <div>• Stockings 5+ days, daytime only (~12h/day)</div>
              <div>• Avoid sun x3 weeks, SPF 30+ for another 3 weeks. High-risk: no tanning 6–8 weeks</div>
            </div>
          </div>
        </div>
        <div className="hbox hbox-red" style={{marginTop:12}}>
          <div className="hbox-title">Who NOT to Treat</div>
          <div className="hbox-body">
            <div>• Veins too small for needle → refer to MDCS/Derm for laser</div>
            <div>• Significant hyperpigmentation from prior injections or Keloids</div>
            <div>• Difficult patients with unrealistic expectations — not worth it</div>
            <div>• <strong>Tamoxifen patients → widespread phlebitis risk</strong></div>
          </div>
        </div>
        <div className="hbox hbox-blue" style={{marginTop:12}}>
          <div className="hbox-title">Results / Expectations</div>
          <div className="hbox-body">20–60% improvement per round (wide range is deliberate). Reinject at 4 weeks minimum (6 weeks if still healing/trapped blood — never sooner than 4 weeks). Results visible at 3 weeks, maximum at 6 weeks. Matting: wait 3–6 months before re-injection.</div>
        </div>
      </T>

      <T id="misc" title="🌍 Misc Clinical Pearls">
        <div className="grid-2">
          <div className="hbox hbox-blue">
            <div className="hbox-title">Translator App</div>
            <div className="hbox-body">At least 1 iPad per clinic has the translator app. You can also call directly: <strong>718-838-9317, PIN 94291926</strong>. Spanish and Russian slides available for initial and review visits.</div>
          </div>
          <div className="hbox hbox-green">
            <div className="hbox-title">Travel Precautions</div>
            <div className="hbox-body">Recommend at least 1 week before long-distance travel after any procedure (want post-scan first). During travel: increase hydration, get up frequently, wear compression.</div>
          </div>

            <div className="hbox-title">Pregnant Patients</div>
            <div className="hbox-body">Generally avoid procedures during pregnancy. If terrible symptoms: consider ablation only (NO polidocanol/Asclera/Varithena, no NSAIDs). Recommend treatment starting 3 months postpartum. Prescribe pregnancy compression garments for pelvic support.</div>
          </div>
          <div className="hbox hbox-amber">
            <div className="hbox-title">Medical Clearances</div>
            <div className="hbox-body">Almost never needed — creates unnecessary delays and decreases conversions. You can calculate DVT risk better than most specialists given your procedure knowledge. Use your medical judgement. If in doubt, contact Dr. Caroline Novak.</div>
          </div>
        </div>
      </T>
    </div>
  );
}

// ── COMPLICATIONS TAB ─────────────────────────────────────────────────────────
function ComplicationsTab() {
  const [open, setOpen] = useState({dvt:true,svt:false,ehit:false,varithenacx:false});
  const T = ({id,title,children}) => (
    <div className="card" style={{marginBottom:12}}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',cursor:'pointer'}} onClick={()=>setOpen(o=>({...o,[id]:!o[id]}))}>

        <span style={{color:'#94a3b8',fontSize:13}}>{open[id]?'▲':'▼'}</span>
      </div>
      {open[id]&&<div style={{marginTop:14}}>{children}</div>}
    </div>
  );
  return (
    <div>
      <div className="hbox hbox-red" style={{marginBottom:16}}>
        <div className="hbox-title">Any concerns or questions → contact Dr. Caroline Novak directly</div>
        <div className="hbox-body">Do not manage complications in isolation. Reach out early.</div>
      </div>
      <T id="dvt" title="🩸 DVT — Deep Vein Thrombosis">
        <div className="grid-2" style={{marginBottom:14}}>
          <div>
            <div className="section-label">Risk Factors</div>
            {['Age >60','Immobility (bed-bound OR travel)','Recent surgery','Family history or known hypercoagulability','Active cancer','OCPs or HRT','Pregnancy','Smoking'].map(r=>(
              <div key={r} style={{fontSize:13,color:'#374151',padding:'4px 0',borderBottom:'1px solid #f1f5f9',display:'flex',gap:6}}><span style={{color:'#ef4444'}}>•</span>{r}</div>
            ))}
          </div>
          <div>
            <div className="section-label">Ultrasound Findings</div>
            <div style={{marginBottom:8,fontSize:12,fontWeight:800,color:'#2d1b69'}}>ACUTE (&lt;4 weeks)</div>
            {['Non-compressibility','Hypoechoic thrombus within lumen','Venous distension','Complete absence of color Doppler signal','Loss of response to Valsalva or augmentation'].map(f=>(
              <div key={f} style={{fontSize:12,color:'#374151',padding:'3px 0',borderBottom:'1px solid #f1f5f9'}}>• {f}</div>
            ))}
            <div style={{marginTop:10,marginBottom:6,fontSize:12,fontWeight:800,color:'#2d1b69'}}>CHRONIC (&gt;4 weeks)</div>
            {['Non-compressibility','Vein may be narrow and irregular, or normal size','Hyperechoic thrombus','Development of collaterals','Calcifications'].map(f=>(
              <div key={f} style={{fontSize:12,color:'#374151',padding:'3px 0',borderBottom:'1px solid #f1f5f9'}}>• {f}</div>
            ))}
          </div>
        </div>
      </T>
      <T id="svt" title="🔴 SVT — Superficial Venous Thrombosis">
        <div className="hbox hbox-amber" style={{marginBottom:12}}>
          <div className="hbox-title">⚠️ Commonly Mistaken for DVT in the ER</div>
          <div className="hbox-body">Provide reassurance to patients who have been seen in the ER and explain the difference between SVT and DVT.</div>
        </div>
        <div className="grid-2">
          <div className="hbox hbox-red">
            <div className="hbox-title">SVT ≥5cm OR within 3cm of deep system</div>
            <div className="hbox-body">Treat like a DVT — full anticoagulation. Follow-up scan within 3–7 days to evaluate for progression. Anticoagulation duration: 6–12 weeks (or longer based on response, symptoms, risk factors).</div>
          </div>
          <div className="hbox hbox-amber">
            <div className="hbox-title">SVT &lt;5cm AND &gt;3cm from deep veins</div>
            <div className="hbox-body">Follow SVT treatment paradigm. Early follow-up scan within 3–7 days to evaluate for progression. Instruct patient to call if signs of spreading.</div>
          </div>
        </div>
        <div className="hbox hbox-blue" style={{marginTop:12}}>
          <div className="hbox-title">Elective Vein Treatments After SVT</div>
          <div className="hbox-body">Delay elective vein treatments for at least 12 weeks from SVT onset due to increased clotting risk. Longer conservative care may be needed in the area of the SVT prior to treatment.</div>
        </div>
      </T>
      <T id="ehit" title="⚡ EHIT — Endothermal Heat-Induced Thrombosis">
        <div className="hbox hbox-blue" style={{marginBottom:12}}>
          <div className="hbox-title">What is EHIT?</div>
          <div className="hbox-body">Direct propagation of clot from an ablated vein into the deep system at the junction.</div>
        </div>
        <div className="hbox hbox-green">
          <div className="hbox-title">Prevention</div>
          <div className="hbox-body">Adjust distance from junction (maintain 3–3.5cm) in higher-risk patients: older patients, known hypercoagulable states.</div>
        </div>
        <div className="hbox hbox-amber" style={{marginTop:10}}>
          <div className="hbox-title">Treatment</div>

function GlossaryTab() {
  const [q, setQ] = useState('');
  const sections = [
    { title:'🫀 Superficial Venous System', items:[
      ['GSV','Great Saphenous Vein — longest superficial vein, runs from foot up inner leg/thigh to join CFV at SFJ. Primary source of varicose veins when refluxing.'],
      ['SSV','Small Saphenous Vein — superficial vein along the back of the calf, joins popliteal vein at SPJ.'],
      ['AASV','Anterior Accessory Saphenous Vein — branch of GSV along the front of the thigh; common site of recurrent reflux.'],
      ['PASV','Posterior Accessory Saphenous Vein — branch of GSV along the posterior thigh; may cause posterior thigh varicosities.'],
      ['ISV','Intersaphenous Vein (Vein of Giacomini) — communicating vein between GSV and SSV systems.'],
      ['Tributary Veins','Smaller veins draining into larger superficial veins (GSV or SSV). "Trib/s" in documentation.'],
      ['Reticular Veins','Small bluish veins beneath the skin, usually cosmetic. "Retics."'],
      ['Posterior Arch Vein',"Leonardo's Vein — superficial communicating vein along the inner calf connecting with perforators."],
      ['SFJ','Saphenofemoral Junction — where GSV drains into CFV (common femoral vein).'],
      ['SPJ','Saphenopopliteal Junction — where SSV drains into the popliteal vein.'],
    ]},
    { title:'🔵 Deep Venous System', items:[
      ['CFV','Common Femoral Vein — main deep vein of upper thigh; receives the GSV, drains into external iliac vein.'],
      ['FV','Femoral Vein — deep vein of the thigh, from popliteal vein to CFV.'],
      ['PFV','Profunda Femoris / Deep Femoral Vein — major deep vein draining thigh musculature.'],
      ['Popliteal Vein','Deep vein behind the knee receiving SSV and gastrocnemius veins.'],
      ['PTVs','Posterior Tibial Veins — deep veins of the posterior lower leg; join peroneal veins to form popliteal vein.'],
      ['ATVs','Anterior Tibial Veins — deep veins draining the anterior compartment of the leg.'],
      ['Peroneal Veins','Deep veins along the lateral leg, joining with PTVs.'],
      ['Gastrocnemius Veins','Paired deep veins within the calf muscle draining into the popliteal vein. "Gastrocs."'],
      ['Soleal Veins','Deep calf veins draining into the posterior tibial or peroneal systems.'],
      ['Perforator Veins','Connect superficial and deep systems. Flow: superficial → deep (one-way). Incompetent perfs allow backward flow → localized venous hypertension.'],
    ]},
    { title:'🩺 Venous Conditions', items:[
      ['Venous Insufficiency (VI)','General term for valve dysfunction causing backward blood flow (reflux).'],
      ['CVI','Chronic Venous Insufficiency — longstanding reflux causing swelling, pain, skin changes, ulceration.'],
      ['Varicose Veins (VVs)','Enlarged, twisted superficial veins from reflux.'],
      ['SVT','Superficial Venous Thrombosis — clot in a superficial vein, often painful and palpable.'],
      ['DVT','Deep Vein Thrombosis — clot in a deep vein; risk of pulmonary embolism.'],
      ['EHIT','Endothermal Heat-Induced Thrombosis — clot propagation from an ablated superficial vein into the deep system.'],
      ['Lipodermatosclerosis','Chronic inflammation and fibrosis of lower leg skin/subcutaneous tissue due to venous disease. Hyperpigmentation, induration, "inverted champagne bottle" legs.'],
      ['Corona Phlebectatica (CP)','Fan-shaped network of dilated intradermal veins around the ankle. Early sign of advanced venous disease.'],
      ['Phlebolymphedema','Coexistence of CVI and lymphedema. Chronic venous hypertension overwhelms lymphatic drainage → protein-rich edema.'],
      ['PFO','Patent Foramen Ovale — cardiac variant relevant in foam sclerotherapy due to embolic risk.'],
    ]},
    { title:'📊 Diagnostics & Classification', items:[
      ['CEAP','Standard classification of chronic venous disease: C=Clinical (C0–C6), E=Etiologic, A=Anatomic, P=Pathophysiologic.'],
      ['RPVI / PRVI','Post-Radiofrequency Venous Inspection — US performed after RFA to confirm closure and rule out EHIT.'],
      ['LVM','Lower Venous Mapping — ultrasound assessment of reflux and anatomy.'],
      ['Dupe','Duplicated Vein — anatomical variant where two parallel veins exist (commonly GSV).'],
      ['TTP','Tender to Palpation — physical exam finding of localized pain.'],
      ['Stemmer Sign','Inability to pinch skin at base of 2nd toe — positive in lymphedema.'],
    ]},
    { title:'💉 Procedures & Treatments', items:[
      ['RFA','Radiofrequency Ablation — heat-based closure of refluxing veins; standard at VIP. CPT 36475/36476.'],
      ['EVLT','Endovenous Laser Treatment — laser-based thermal ablation (less commonly used at VIP). CPT 36478.'],
      ['UGFS','Ultrasound-Guided Foam Sclerotherapy — injection of foam sclerosant under ultrasound to close veins.'],
      ['Varithena','Brand name foam sclerosant (polidocanol injectable foam). CPT 36465 (single vein) / 36466 (multiple veins same leg).'],
      ['VenaSeal','Cyanoacrylate-based closure. No tumescent. No compression post-procedure. CPT 36482.'],
      ['Sclerotherapy (Sclero)','Chemical vein closure; medical (for refluxing veins) or cosmetic (for spider veins).'],
      ['Phlebectomy','Surgical removal of varicose veins through micro-incisions. Faster result but downtime and small scars.'],
      ['AC','Anticoagulation — medication preventing or treating thrombosis.'],
      ['Tumescent','Local anesthetic solution injected around the vein before thermal ablation to provide anesthesia and protect surrounding tissue.'],
    ]},
    { title:'⚙️ Insurance & Billing', items:[
      ['LOMN','Letter of Medical Necessity — documentation supporting insurance coverage for procedures.'],
      ['PA','Prior Authorization — required insurance approval before procedures.'],
      ['IC','Insurance Criteria — clinical and imaging requirements for authorization.'],
      ['IB','Insurance Billing — team handling claims submission and management.'],
      ['OON','Out of Network — provider not contracted with patient\'s insurance.'],
      ['OOP','Out of Pocket — direct patient payment.'],
      ['CPT Code','Current Procedural Terminology — standardized billing codes for procedures.'],
      ['ICD-10','International Classification of Diseases — diagnosis codes required on all claims.'],
      ['HMO / PPO','Insurance plan models — HMO: restricted network; PPO: flexible network.'],
    ]},
    { title:'👥 Roles & Teams', items:[
      ['APP','Advanced Practice Provider — Nurse Practitioners (NPs) and Physician Assistants (PAs).'],
      ['RVT / RVS','Registered Vascular Technologist / Sonographer — certified vascular ultrasound specialists.'],
      ['ROD','Regional Operations Director — oversees clinic operations for a region. First contact for local issues.'],
      ['FD','Front Desk — handles check-in/out, forms, scheduling.'],
      ['ASC','Ambulatory Surgery Center — outpatient procedural facility.'],
      ['IB Team','Insurance/Billing team — receives treatment plan from sonographer, processes PA and LOMN.'],
    ]},
    { title:'🖥️ Systems & Tech', items:[
      ['Nextech / NT','VIP\'s EMR (Electronic Medical Record). Clinical documentation, billing, scheduling.'],

      ['Luma','Patient engagement platform. Reminders, intake forms, secure messaging.'],
      ['Rippling','HR portal. Schedule, benefits, PTO.'],

      ['Social Notes','Informal note section in Nextech for intra-office use. Not part of the official medical record.'],
    ]},
  ];

  const allItems = sections.flatMap(s => s.items.map(([term,def]) => ({term, def, section:s.title})));
  const filtered = q ? allItems.filter(i => i.term.toLowerCase().includes(q.toLowerCase()) || i.def.toLowerCase().includes(q.toLowerCase())) : null;

  return (
    <div>
      <div className="card" style={{marginBottom:16}}>
        <div className="card-title">🔤 Clinical Glossary</div>
        <input value={q} onChange={e=>setQ(e.target.value)} placeholder="Search terms, acronyms, definitions..." style={{width:'100%',padding:'10px 16px',border:'2px solid #e2e8f0',borderRadius:10,fontFamily:'DM Sans',fontSize:14,fontWeight:600,outline:'none'}} />
        {q && <div style={{fontSize:12,color:'#94a3b8',marginTop:6,fontWeight:600}}>{filtered.length} result{filtered.length!==1?'s':''}</div>}
      </div>

      {filtered ? (

      ) : (
        sections.map(s=>(
          <div key={s.title} className="card" style={{marginBottom:12}}>
            <div className="card-title">{s.title}</div>
            {s.items.map(([term,def])=>(
              <div key={term} style={{display:'flex',gap:10,alignItems:'flex-start',padding:'8px 0',borderBottom:'1px solid #f1f5f9'}}>

                <div style={{fontSize:13,color:'#64748b',lineHeight:1.5}}>{def}</div>

  const [gameMode, setGameMode] = React.useState('study');

  const [score, setScore] = React.useState({c:0,t:0});

  // SVG ultrasound simulator — draws a fake US cross-section
  // bg = vessel background fill, echoes = array of {cx,cy,r,opacity} bright spots
  // compressed = show compressed oval shape, label = vessel label

        React.createElement('ellipse', {cx:vX,cy:vY,rx:vRx,ry:vRy,fill:vFill}),

        showCollateral && React.createElement('text', {x:130,y:42,textAnchor:'middle',fontSize:7,fill:'#aaa',fontWeight:700},'collateral'),

    { id:'physiology', title:'⚙️ Why Reflux Happens', color:'#6C3CB5',
      body:'Normal venous valves prevent retrograde flow. When valves become incompetent — from chronic hemodynamic stress, DVT-related damage, or genetic connective tissue changes — blood falls backward during valve closure. During calf muscle contraction, deep vein pressure rises to ~140 mmHg. Competent valves then prevent this pressure from transmitting to superficial veins. When valves fail, the full hydrostatic column (up to 90 mmHg at the ankle) exerts force on distal veins, causing dilation, symptoms, and over time, CVI.' },
    { id:'definition', title:'⏱ Defining Pathologic Reflux', color:'#dc2626',
      body:'Physiologic reflux lasts 200–300 ms in veins with competent valves after calf muscle relaxation. PATHOLOGIC reflux is defined as retrograde flow ≥500 ms after augmentation (manual calf compression + release) or Valsalva (for SFJ/CFV). Some labs use 1000 ms for deep veins. The 500 ms threshold is the standard for superficial veins (GSV, SSV) in clinical practice.' },
    { id:'technique', title:'🔊 Ultrasound Technique', color:'#1078B9',

    { id:'locations', title:'📍 Sites to Assess', color:'#059669',

        onToggle:e=>setExpanded(e.target.open?s.id:null),
        style:{marginBottom:8,borderRadius:12,overflow:'hidden',border:`2px solid ${s.color}33`}},
        React.createElement('summary', {style:{background:s.color,color:'white',padding:'11px 16px',fontWeight:900,fontSize:13,cursor:'pointer',listStyle:'none',display:'flex',justifyContent:'space-between'}},
          s.title, React.createElement('span',{style:{fontSize:11,opacity:0.8}},'▼ tap')
        ),
        React.createElement('div', {style:{padding:'14px 16px',background:'white',fontSize:13,color:'#374151',lineHeight:1.7}},s.body)
      )),
      // Real images study panel
      React.createElement('div', {style:{marginTop:16}},
        React.createElement('div', {style:{fontSize:13,fontWeight:900,color:'#6C3CB5',marginBottom:10}}, '📸 Doppler Images from PMC5220199'),
        React.createElement('div', {style:{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(260px,1fr))',gap:12}},
          [
            {src:'/anatomy/reflux-f1.jpg', cap:'Fig 1. GSV and SSV anatomy with tributaries and common SSV variants (SFJ/SPJ).'},
            {src:'/anatomy/reflux-f6.jpg', cap:'Fig 6. Right SFJ — blue color Doppler signal = retrograde reflux after augmentation. Dilated SFJ (1.80 cm). This is a POSITIVE reflux study.'},
            {src:'/anatomy/reflux-f5.jpg', cap:'Fig 5. Right SFJ — color Doppler showing GSV junctional incompetence at three levels.'},
            {src:'/anatomy/reflux-f3.jpg', cap:'Fig 3. Left GSV at groin — B-mode 4-panel with color Doppler showing flow assessment technique.'},
            {src:'/anatomy/reflux-f4.jpg', cap:'Fig 4. Compression study of distal GSV — normal compressibility (arrows). Used for DVT evaluation.'},
          ].map((fig,i)=>React.createElement('div', {key:i,style:{borderRadius:10,overflow:'hidden',border:'1px solid #e9d5ff',background:'white'}},
            React.createElement('img', {src:fig.src,alt:fig.cap,style:{width:'100%',display:'block'}}),
            React.createElement('div', {style:{padding:'8px 10px',fontSize:11,color:'#374151',lineHeight:1.5}},fig.cap)
          ))
        )
      )
    ),

    // QUIZ
    tab==='quiz' && done && React.createElement('div', {style:{textAlign:'center',padding:'40px',background:'#faf5ff',borderRadius:16,border:'2px solid #e9d5ff'}},
      React.createElement('div', {style:{fontSize:48,marginBottom:8}}, score.c===QUESTIONS.length?'🏆':'📚'),
      React.createElement('h3', {style:{color:'#7c3aed',fontWeight:900,margin:'0 0 8px'}},'Quiz Complete!'),
      React.createElement('div', {style:{fontSize:32,fontWeight:900,color:'#1e293b',marginBottom:16}},`${score.c}/${QUESTIONS.length}`),
      React.createElement('button', {onClick:restart, style:{padding:'10px 28px',borderRadius:10,border:'none',background:'#7c3aed',color:'white',fontWeight:900,cursor:'pointer',fontSize:14,display:'block',margin:'16px auto 0'}},'🔄 Try Again')
    ),

    tab==='quiz' && !done && React.createElement('div', {style:{maxWidth:540,margin:'0 auto'}},
      React.createElement('div', {style:{background:'#faf5ff',borderRadius:12,padding:'12px 16px',marginBottom:12,border:'1px solid #e9d5ff'}},
        React.createElement('div', {style:{fontSize:11,fontWeight:900,color:'#7c3aed',marginBottom:4}},`Image ${quizIdx+1} of ${QUESTIONS.length}`),
        React.createElement('div', {style:{fontSize:13,color:'#374151',marginBottom:8,lineHeight:1.5}},q.label)
      ),
      React.createElement('img', {src:q.image, alt:'Ultrasound image', style:{width:'100%',borderRadius:10,marginBottom:12,border:'2px solid #e9d5ff',display:'block'}}),
      React.createElement('div', {style:{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10,marginBottom:12}},
        [['reflux','🔄 Reflux','#dc2626','#fff1f2','#fecaca'],['no_reflux','✅ No Reflux','#059669','#f0fdf4','#bbf7d0']].map(([val,lbl,col,bg,border])=>{
          let bkg=bg, bdr=border, textCol=col;
          if(choice){if(val===q.answer){bkg='#dcfce7';bdr='#22c55e';textCol='#166534';}else if(val===choice){bkg='#fee2e2';bdr='#ef4444';textCol='#991b1b';}else{bkg='#f8fafc';textCol='#94a3b8';}}
          return React.createElement('button', {key:val, onClick:()=>handleAnswer(val),
            style:{padding:'18px',borderRadius:12,border:`2px solid ${bdr}`,background:bkg,color:textCol,fontWeight:900,fontSize:15,cursor:choice?'default':'pointer'}}, lbl);
        })
      ),
      choice && React.createElement('div', {style:{background:choice===q.answer?'#f0fdf4':'#fff1f2',borderRadius:10,padding:'12px 16px',border:`1px solid ${choice===q.answer?'#bbf7d0':'#fecaca'}`}},
        React.createElement('div', {style:{fontSize:12,fontWeight:900,color:choice===q.answer?'#166534':'#991b1b',marginBottom:4}},choice===q.answer?'✅ Correct!':'❌ Not quite — here\'s why:'),
        React.createElement('div', {style:{fontSize:12,color:'#374151',lineHeight:1.6}},q.exp)
      )
    )
  );
}

// ── GAMES HUB ────────────────────────────────────────────────────────────────
function VeinGamesHub() {
  const [game, setGame] = React.useState(null);
  const games = [
    { id:'anatomy', icon:'🫀', title:'Vein Anatomy', desc:'Label the superficial & deep veins of the lower extremity', color:'#AC4ABD', ready:true },
    { id:'dvt',     icon:'🩸', title:'DVT Treatment', desc:'Learn DVT classification, PE risk, and treatment by location', color:'#dc2626', ready:true },
    { id:'ehit',    icon:'🔥', title:'EHIT Identification', desc:'Classify EHIT grades and learn post-ablation management', color:'#f97316', ready:true },
    { id:'acutechronic', icon:'🔬', title:'Acute vs Chronic DVT', desc:'Identify DVT age from ultrasound findings and clinical scenarios', color:'#0369a1', ready:true },
    { id:'us_id',   icon:'🔊', title:'Ultrasound ID', desc:'Identify which vein is shown in the ultrasound image', color:'#1078B9', ready:false },
    { id:'reflux',  icon:'🔄', title:'Reflux or No Reflux?', desc:'Real Doppler images — identify venous reflux from PMC5220199', color:'#7c3aed', ready:true },
    { id:'cpt',     icon:'💻', title:'CPT Code Challenge', desc:'Match the clinical scenario to the correct CPT code', color:'#f59e0b', ready:true },
  ];

  const backBtn = React.createElement('button', {onClick:()=>setGame(null), style:{marginBottom:16,background:'none',border:'none',cursor:'pointer',fontSize:13,color:'#1078B9',fontWeight:700}}, '← Back to Games');

  if (game==='anatomy') return React.createElement('div', null, backBtn, React.createElement(VeinAnatomyGame));
  if (game==='dvt')     return React.createElement('div', null, backBtn, React.createElement(DVTGame));
  if (game==='ehit')    return React.createElement('div', null, backBtn, React.createElement(EHITGame));
  if (game==='cpt')          return React.createElement('div', null, backBtn, React.createElement(CPTGame));
  if (game==='acutechronic') return React.createElement('div', null, backBtn, React.createElement(AcuteChronicGame));
  if (game==='reflux')      return React.createElement('div', null, backBtn, React.createElement(RefluxGame));

  return React.createElement('div', {style:{padding:'0 4px'}},
    React.createElement('div', {style:{background:'linear-gradient(135deg,#2d1b69,#AC4ABD)',borderRadius:16,padding:'20px 24px',marginBottom:20,color:'white'}},
      React.createElement('div', {style:{fontSize:22,fontWeight:900,marginBottom:4,fontFamily:'Poppins,sans-serif'}}, '🎮 Vein Learning Games'),
      React.createElement('div', {style:{fontSize:13,opacity:0.85}}, 'Interactive games to sharpen your vein anatomy and ultrasound skills')
    ),
    React.createElement('div', {style:{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(260px,1fr))',gap:14}},
      games.map(g=>React.createElement('div', {key:g.id,
        onClick:()=>g.ready&&setGame(g.id),
        style:{borderRadius:14,border:`2px solid ${g.ready?g.color+'44':'#e2e8f0'}`,padding:'18px 20px',cursor:g.ready?'pointer':'default',background:g.ready?'white':'#f8fafc',transition:'all 0.15s',position:'relative',overflow:'hidden'}},
        !g.ready && React.createElement('div', {style:{position:'absolute',top:10,right:10,background:'#f1f5f9',color:'#94a3b8',fontSize:10,fontWeight:800,padding:'2px 8px',borderRadius:20}}, 'COMING SOON'),
        React.createElement('div', {style:{fontSize:28,marginBottom:8}}, g.icon),
        React.createElement('div', {style:{fontSize:15,fontWeight:900,color:g.ready?'#1e293b':'#94a3b8',marginBottom:4}}, g.title),
        React.createElement('div', {style:{fontSize:12,color:'#64748b',lineHeight:1.5}}, g.desc),
        g.ready && React.createElement('div', {style:{marginTop:12,fontSize:12,fontWeight:800,color:g.color}}, 'Play →')
      ))
    )
  );
}


function App() {
  // Read initial state from URL hash e.g. #clinical/p2p or #admin/faq
  const parseHash = () => {
    const h = window.location.hash.replace('#','').split('/');
    return { mode: h[0]||'home', sub: h[1]||null };
  };
  const initHash = parseHash();
  const [mode, setMode] = useState(initHash.mode);
  const [clinicalTab, setClinicalTab] = useState(initHash.mode==='clinical' && initHash.sub ? initHash.sub : 'clinical');
  const [adminTab, setAdminTab] = useState(initHash.mode==='admin' && initHash.sub ? initHash.sub : 'start');
  const [globalSearch, setGlobalSearch] = useState('');

  // Keep hash in sync with state
  React.useEffect(() => {
    if (mode === 'home') { window.location.hash = ''; return; }
    const sub = mode === 'clinical' ? clinicalTab : adminTab;
    window.location.hash = `${mode}/${sub}`;
  }, [mode, clinicalTab, adminTab]);

  const goMode = (m) => {
    setMode(m);
    window.scrollTo(0,0);
  };

  const handleSearch = (e) => {
    e.preventDefault();
    if (globalSearch.trim()) { setMode('admin'); setAdminTab('faq'); }
  };

  const activeTab = mode === 'clinical' ? clinicalTab : adminTab;

  return (
    <div>
      {/* Navbar */}
      <nav className="navbar">
        <div className="navbar-brand">
          <div className="navbar-logo">VIP <span>Provider Training Hub</span></div>
          <div className="navbar-sub">VIP Medical Group · Onboarding & Clinical Resources</div>
        </div>
        <form onSubmit={handleSearch} style={{display:'flex',alignItems:'center',background:'rgba(255,255,255,0.12)',borderRadius:50,padding:'5px 6px 5px 16px',gap:6,border:'1px solid rgba(255,255,255,0.2)',backdropFilter:'blur(6px)'}}>
          <input
            value={globalSearch}
            onChange={e=>setGlobalSearch(e.target.value)}
            placeholder="Search FAQs, tools, protocols..."
            style={{background:'transparent',border:'none',outline:'none',color:'white',fontFamily:'DM Sans',fontSize:13,fontWeight:600,width:220}}
          />
          <button type="submit" style={{background:'white',color:'#1078B9',border:'none',borderRadius:50,padding:'6px 14px',fontFamily:'DM Sans',fontWeight:800,fontSize:12,cursor:'pointer',whiteSpace:'nowrap'}}>
            Search
          </button>
        </form>
      </nav>

      {/* Mode toggle bar */}
      <div className="mode-bar">
        <button className={`mode-home${mode==='home'?' active':''}`} onClick={()=>goMode('home')}>
          🏠 Home
        </button>
        <div className="mode-divider"/>
        <div className="mode-toggle">
          <button
            className={`mode-btn mode-btn-clinical${mode==='clinical'?' active':''}`}
            onClick={()=>goMode('clinical')}
          >
            🩺 Clinical
          </button>
          <button
            className={`mode-btn mode-btn-admin${mode==='admin'?' active':''}`}
            onClick={()=>goMode('admin')}
          >
            ⚙️ Systems
          </button>
        </div>
      </div>

      {/* Sub-tab bar — only when not on home */}
      {mode === 'clinical' && (
        <div className="sub-bar sub-bar-clinical">
          {CLINICAL_TABS.map(t=>(
            <button key={t.id}
              className={`tab${clinicalTab===t.id?' active active-clinical':''}`}
              onClick={()=>setClinicalTab(t.id)}
            >{t.label}</button>
          ))}
        </div>
      )}
      {mode === 'admin' && (
        <div className="sub-bar sub-bar-admin">
          {ADMIN_TABS.map(t=>(
            <button key={t.id}
              className={`tab${adminTab===t.id?' active active-admin':''}`}
              onClick={()=>setAdminTab(t.id)}
            >{t.label}</button>
          ))}
        </div>
      )}

      {/* Hero — home only */}
      {mode === 'home' && (
        <div style={{background:'linear-gradient(135deg,#2d1b69,#6C3CB5)',padding:'32px 24px'}}>
          <div style={{maxWidth:1080,margin:'0 auto'}}>
            <h1 style={{fontSize:26,fontWeight:900,color:'white',marginBottom:8}}>Welcome to VIP Medical Group 👋</h1>
            <p style={{fontSize:14,color:'rgba(255,255,255,0.85)',maxWidth:560,lineHeight:1.6,marginBottom:18}}>Your one-stop hub for everything you need — from pre-arrival checklists to clinical protocols to FAQs.</p>
            <div style={{display:'flex',gap:10,marginTop:8}}>
              <button onClick={()=>goMode('clinical')} style={{background:'linear-gradient(135deg,#AC4ABD,#9333ea)',color:'white',border:'none',borderRadius:12,padding:'12px 24px',fontFamily:'DM Sans',fontWeight:900,fontSize:14,cursor:'pointer',boxShadow:'0 2px 10px rgba(172,74,189,0.35)'}}>🩺 Clinical Content →</button>
              <button onClick={()=>goMode('admin')} style={{background:'linear-gradient(135deg,#6C3CB5,#AC4ABD)',color:'white',border:'none',borderRadius:12,padding:'12px 24px',fontFamily:'DM Sans',fontWeight:900,fontSize:14,cursor:'pointer',boxShadow:'0 2px 10px rgba(124,58,237,0.35)'}}>⚙️ Systems →</button>
            </div>
          </div>
        </div>
      )}

      {/* Content */}
      <div className="container">
        {mode === 'home'     && <HomeTab setMode={goMode} setAdminTab={setAdminTab} setClinicalTab={setClinicalTab} />}
        {mode === 'clinical' && clinicalTab === 'clinical'       && <ClinicalTab />}
        {mode === 'clinical' && clinicalTab === 'treatment'      && <TreatmentTab />}
        {mode === 'clinical' && clinicalTab === 'procedures'     && <ProceduresTab />}
        {mode === 'clinical' && clinicalTab === 'complications'  && <ComplicationsTab />}
        {mode === 'clinical' && clinicalTab === 'glossary'       && <GlossaryTab />}
        {mode === 'clinical' && clinicalTab === 'p2p'           && <P2PTab />}
        {mode === 'clinical' && clinicalTab === 'rphs'          && <RPhSTab />}
        {mode === 'clinical' && clinicalTab === 'veingame'      && <VeinGamesHub />}
        {mode === 'admin'    && adminTab === 'start'      && <StartTab />}
        {mode === 'admin'    && adminTab === 'systems'    && <SystemsTab />}
        {mode === 'admin'    && adminTab === 'faq'        && <FaqTab searchQ={globalSearch} />}
        {mode === 'admin'    && adminTab === 'contacts'   && <ContactsTab />}
        {mode === 'admin'    && adminTab === 'protocols'  && <ProtocolsTab />}
        {mode === 'admin'    && adminTab === 'marketing'  && <MarketingTab />}
        {mode === 'admin'    && adminTab === 'resources'  && <ResourcesTab />}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
