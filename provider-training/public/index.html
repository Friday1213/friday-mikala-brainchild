            >{t.label}</button>
          ))}
        </div>
      )}

      {/* Hero — home only */}
      {mode === 'home' && (
        <div style={{background:'linear-gradient(135deg,#2d1b69,#6C3CB5)',padding:'32px 24px'}}>
          <div style={{maxWidth:1080,margin:'0 auto'}}>
            {/* MODULE BUTTONS */}
            <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:10,marginBottom:24,alignItems:'stretch'}}>
              {[
                {m:'intro',           bg:'linear-gradient(135deg,#E45487,#AC4ABD)', shadow:'rgba(228,84,135,0.4)',  tag:'NEW PROVIDER',      title:'🚀 New Provider Onboarding', sub:'~90 min · Complete in one sitting',              btnColor:'#E45487', btn:'Begin →'},
                {m:'selfguided',      bg:'linear-gradient(135deg,#1078B9,#6C3CB5)', shadow:'rgba(16,120,185,0.35)', tag:'ONGOING',            title:'📋 Training Checklist',       sub:'Pre-Start · Week 1 · 30 Days · 60 Days',        btnColor:'#1078B9', btn:'Open →'},
                {m:'cosmeticmodule',  bg:'linear-gradient(135deg,#7C3AED,#EC4899)', shadow:'rgba(124,58,237,0.4)', tag:'ALL PROVIDERS',      title:'✨ Cosmetic Sclerotherapy',    sub:'Foam vs liquid · Complications · ~45 min',      btnColor:'#7C3AED', btn:'Open →'},
              ].map(c=>(
                <div key={c.m} onClick={()=>{ setMode(c.m); window.scrollTo(0,0); }}
                  style={{background:c.bg,borderRadius:14,padding:'14px 16px',cursor:'pointer',
                    display:'flex',flexDirection:'column',justifyContent:'space-between',gap:10,
                    boxShadow:`0 6px 24px ${c.shadow}`,border:'2px solid rgba(255,255,255,0.2)'}}>
                  <div>
                    <div style={{fontSize:10,fontWeight:900,color:'rgba(255,255,255,0.8)',letterSpacing:1.5,marginBottom:6}}>{c.tag}</div>
                    <div style={{fontSize:15,fontWeight:900,color:'white',marginBottom:6,lineHeight:1.3}}>{c.title}</div>
                    <div style={{fontSize:12,color:'rgba(255,255,255,0.85)',lineHeight:1.4}}>{c.sub}</div>
                  </div>
                  <div style={{background:'white',color:c.btnColor,borderRadius:10,padding:'8px 16px',fontWeight:900,fontSize:13,textAlign:'center'}}>
                    {c.btn}
                  </div>
                </div>
              ))}
            </div>
            <h1 style={{fontSize:26,fontWeight:900,color:'white',marginBottom:8}}>Welcome to VIP Medical Group 👋</h1>
            <p style={{fontSize:14,color:'rgba(255,255,255,0.85)',maxWidth:560,lineHeight:1.6,marginBottom:18}}>Your one-stop hub for everything you need — from pre-arrival checklists to clinical protocols to FAQs.</p>
            <div style={{display:'flex',gap:10,marginTop:8}}>
              <button onClick={()=>goMode('clinical')} style={{background:'linear-gradient(135deg,#AC4ABD,#9333ea)',color:'white',border:'none',borderRadius:12,padding:'12px 24px',fontFamily:'DM Sans',fontWeight:900,fontSize:14,cursor:'pointer',boxShadow:'0 2px 10px rgba(172,74,189,0.35)'}}>🩺 Clinical Content →</button>
              <button onClick={()=>goMode('admin')} style={{background:'linear-gradient(135deg,#6C3CB5,#AC4ABD)',color:'white',border:'none',borderRadius:12,padding:'12px 24px',fontFamily:'DM Sans',fontWeight:900,fontSize:14,cursor:'pointer',boxShadow:'0 2px 10px rgba(124,58,237,0.35)'}}>⚙️ Systems →</button>
            </div>
          </div>
        </div>
      )}

      {/* Training modules */}
      {mode === 'prepost'     && <PrePostTest />}
      {mode === 'quiz'        && <QuestionBankTab />}
      {mode === 'intro'          && <IntroModule         onExit={(m)=>{ setMode(m); window.scrollTo(0,0); }} />}
      {mode === 'selfguided'     && <SelfGuidedModule    onExit={(m)=>{ setMode(m); window.scrollTo(0,0); }} />}
      {mode === 'cosmeticmodule' && <CosmeticModule      onExit={(m)=>{ setMode(m); window.scrollTo(0,0); }} />}
      {mode === 'training'    && (
        <div style={{maxWidth:860,margin:'0 auto',padding:'32px 16px'}}>
          <div style={{marginBottom:24}}>
            <h2 style={{fontSize:22,fontWeight:900,color:'#2d1b69',marginBottom:6}}>🎓 Training Modules</h2>
            <p style={{fontSize:14,color:'#64748b'}}>Complete Module 1 first, then work through the remaining modules at your own pace.</p>
          </div>
          <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:12,alignItems:'stretch'}}>
            {[
              {m:'intro',           bg:'linear-gradient(135deg,#E45487,#AC4ABD)', shadow:'rgba(228,84,135,0.4)',  tag:'MODULE 1 · ONE SITTING',   title:'🚀 New Provider Onboarding',   sub:'Complete in one sitting before your start date. ~90 min.',    btnColor:'#E45487', btn:'Begin →'},
              {m:'selfguided',      bg:'linear-gradient(135deg,#1078B9,#6C3CB5)', shadow:'rgba(16,120,185,0.35)', tag:'MODULE 2 · SELF-GUIDED',   title:'📋 Training Checklist',        sub:'Pre-Start · Week 1 · 30 Days · 60 Days. Work at your pace.', btnColor:'#1078B9', btn:'Open →'},
              {m:'cosmeticmodule',  bg:'linear-gradient(135deg,#7C3AED,#EC4899)', shadow:'rgba(124,58,237,0.4)', tag:'MODULE 3 · ALL PROVIDERS',  title:'✨ Cosmetic Sclerotherapy',     sub:'Foam vs liquid · Complications · Aftercare · ~45 min.',       btnColor:'#7C3AED', btn:'Open →'},
            ].map(c=>(
              <div key={c.m} onClick={()=>{ setMode(c.m); window.scrollTo(0,0); }}
                style={{background:c.bg,borderRadius:14,padding:'16px 18px',cursor:'pointer',
                  display:'flex',flexDirection:'column',justifyContent:'space-between',gap:12,
                  boxShadow:`0 6px 24px ${c.shadow}`,border:'2px solid rgba(255,255,255,0.15)'}}>
                <div>
                  <div style={{fontSize:10,fontWeight:900,color:'rgba(255,255,255,0.75)',letterSpacing:1.5,marginBottom:8}}>{c.tag}</div>
                  <div style={{fontSize:16,fontWeight:900,color:'white',marginBottom:8,lineHeight:1.3}}>{c.title}</div>
                  <div style={{fontSize:12,color:'rgba(255,255,255,0.85)',lineHeight:1.5}}>{c.sub}</div>
                </div>
                <div style={{background:'white',color:c.btnColor,borderRadius:10,padding:'10px 20px',fontWeight:900,fontSize:13,textAlign:'center'}}>
                  {c.btn}
                </div>
              </div>
            ))}
          </div>
        </div>
      )}

      {/* Content */}
      {mode !== 'intro' && mode !== 'selfguided' && mode !== 'cosmeticmodule' && mode !== 'training' && <div className="container">
        {mode === 'search'   && <SearchResults query={globalSearch} setMode={goMode} setAdminTab={setAdminTab} setClinicalTab={setClinicalTab} />}
        {mode === 'home'     && <HomeTab setMode={goMode} setAdminTab={setAdminTab} setClinicalTab={setClinicalTab} />}
        {mode === 'clinical' && clinicalTab === 'clinical'       && <ClinicalTab />}
        {mode === 'clinical' && clinicalTab === 'treatment'      && <TreatmentTab />}
        {mode === 'clinical' && clinicalTab === 'procedures'     && <ProceduresTab />}
        {mode === 'clinical' && clinicalTab === 'complications'  && <ComplicationsTab />}
        {mode === 'clinical' && clinicalTab === 'glossary'       && <GlossaryTab />}
        {mode === 'clinical' && clinicalTab === 'p2p'           && <P2PTab />}
        {mode === 'clinical' && clinicalTab === 'rphs'          && <RPhSTab />}
        {mode === 'clinical' && clinicalTab === 'phantom'       && <PhantomDrillsTab />}
        {mode === 'clinical' && clinicalTab === 'veingame'      && <VeinGamesHub />}
        {mode === 'clinical' && clinicalTab === 'pearls'        && <ClinicalPearlsTab />}
        {mode === 'admin'    && adminTab === 'start'      && <StartTab />}
        {mode === 'admin'    && adminTab === 'systems'    && <SystemsTab />}
        {mode === 'admin'    && adminTab === 'faq'        && <FaqTab searchQ={globalSearch} />}
        {mode === 'admin'    && adminTab === 'contacts'   && <ContactsTab />}
        {mode === 'admin'    && adminTab === 'protocols'  && <ProtocolsTab />}
        {mode === 'admin'    && adminTab === 'marketing'  && <MarketingTab />}
        {mode === 'admin'    && adminTab === 'resources'  && <ResourcesTab />}
        {mode === 'admin'    && adminTab === 'toolkit'    && <ToolkitTab />}
      </div>}
      {mode === 'changelog' && <ChangelogPage setMode={goMode} />}
      <FeedbackWidget />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
