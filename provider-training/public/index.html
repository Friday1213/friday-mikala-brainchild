<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>VIP Provider Training Hub</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Nunito',sans-serif;background:#f1f5f9;color:#1e293b;min-height:100vh}
.navbar{background:linear-gradient(135deg,#1e3a5f,#1d4ed8);padding:0 28px;height:64px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:0 2px 16px rgba(30,58,95,0.35)}
.navbar-brand{display:flex;flex-direction:column}
.navbar-logo{font-size:20px;font-weight:900;color:white;letter-spacing:-0.3px}
.navbar-logo span{color:#93c5fd}
.navbar-sub{font-size:11px;color:#93c5fd;font-weight:700;margin-top:1px}
/* Mode toggle bar */
.mode-bar{background:#0f2240;padding:10px 24px;display:flex;align-items:center;gap:8px;position:sticky;top:64px;z-index:99;box-shadow:0 2px 8px rgba(0,0,0,0.2)}
.mode-home{background:none;border:none;color:rgba(255,255,255,0.55);font-family:'Nunito',sans-serif;font-size:13px;font-weight:800;cursor:pointer;padding:7px 14px;border-radius:8px;transition:all 0.15s;display:flex;align-items:center;gap:6px}
.mode-home:hover{color:white;background:rgba(255,255,255,0.1)}
.mode-home.active{color:white;background:rgba(255,255,255,0.15)}
.mode-divider{width:1px;height:22px;background:rgba(255,255,255,0.15);margin:0 4px}
.mode-toggle{display:flex;background:rgba(255,255,255,0.08);border-radius:12px;padding:4px;gap:4px}
.mode-btn{border:none;font-family:'Nunito',sans-serif;font-size:13px;font-weight:900;cursor:pointer;padding:8px 20px;border-radius:9px;transition:all 0.18s;display:flex;align-items:center;gap:7px;letter-spacing:0.01em}
.mode-btn-clinical{background:transparent;color:rgba(255,255,255,0.6)}
.mode-btn-clinical:hover{color:white;background:rgba(16,185,129,0.2)}
.mode-btn-clinical.active{background:linear-gradient(135deg,#059669,#10b981);color:white;box-shadow:0 2px 10px rgba(5,150,105,0.4)}
.mode-btn-admin{background:transparent;color:rgba(255,255,255,0.6)}
.mode-btn-admin:hover{color:white;background:rgba(139,92,246,0.2)}
.mode-btn-admin.active{background:linear-gradient(135deg,#7c3aed,#8b5cf6);color:white;box-shadow:0 2px 10px rgba(124,58,237,0.4)}
/* Sub-tab bar */
.sub-bar{padding:0 20px;display:flex;gap:2px;align-items:flex-end;overflow-x:auto;scrollbar-width:none}
.sub-bar::-webkit-scrollbar{display:none}
.sub-bar-clinical{background:#065f46}
.sub-bar-admin{background:#4c1d95}
.tab{padding:8px 16px 10px;font-family:'Nunito',sans-serif;font-size:13px;font-weight:800;border:none;cursor:pointer;border-radius:10px 10px 0 0;transition:all 0.15s;white-space:nowrap;color:rgba(255,255,255,0.65);background:rgba(255,255,255,0.08);margin-top:6px}
.tab:hover{background:rgba(255,255,255,0.18);color:white}
.tab.active{background:#f1f5f9;margin-top:4px;padding-bottom:12px}
.tab.active-clinical{color:#065f46}
.tab.active-admin{color:#4c1d95}
.container{max-width:1080px;margin:0 auto;padding:24px 20px}
.hero{background:linear-gradient(135deg,#1e3a5f,#1d4ed8);color:white;border-radius:20px;padding:32px 36px;margin-bottom:24px;position:relative;overflow:hidden}
.hero::after{content:'🏥';position:absolute;right:28px;top:50%;transform:translateY(-50%);font-size:72px;opacity:0.12}
.hero h1{font-size:26px;font-weight:900;margin-bottom:8px}
.hero p{font-size:14px;opacity:0.85;max-width:560px;line-height:1.6}
.search-wrap{background:white;border-radius:50px;padding:4px 8px 4px 20px;display:flex;gap:8px;align-items:center;margin-top:18px;max-width:480px;box-shadow:0 2px 12px rgba(0,0,0,0.15)}
.search-wrap input{flex:1;border:none;outline:none;font-family:'Nunito',sans-serif;font-size:14px;font-weight:600;color:#1e293b;background:transparent}
.search-wrap input::placeholder{color:#94a3b8}
.search-btn{background:#1d4ed8;color:white;border:none;border-radius:50px;padding:8px 18px;font-family:'Nunito',sans-serif;font-weight:800;font-size:13px;cursor:pointer}
.card{background:white;border-radius:16px;padding:24px;box-shadow:0 1px 8px rgba(0,0,0,0.06);margin-bottom:16px}
.card-title{font-size:16px;font-weight:900;color:#1e293b;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
/* Quick link tiles */
.ql-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;margin-bottom:16px}
.ql-tile{background:white;border:2px solid #e2e8f0;border-radius:14px;padding:16px 14px;cursor:pointer;transition:all 0.15s;text-align:center;text-decoration:none;color:inherit}
.ql-tile:hover{border-color:#1d4ed8;box-shadow:0 4px 12px rgba(29,78,216,0.12);transform:translateY(-1px)}
.ql-icon{font-size:26px;margin-bottom:8px}
.ql-label{font-size:12px;font-weight:800;color:#374151;line-height:1.3}
/* FAQ accordion */
.faq-item{border:1px solid #e2e8f0;border-radius:12px;margin-bottom:8px;overflow:hidden;background:white}
.faq-q{padding:14px 18px;cursor:pointer;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;font-size:14px;font-weight:800;color:#1e293b;line-height:1.4}
.faq-q:hover{background:#f8fafc}
.faq-chevron{color:#94a3b8;font-size:13px;flex-shrink:0;margin-top:1px}
.faq-a{padding:0 18px 16px;font-size:13px;color:#374151;line-height:1.7;border-top:1px solid #f1f5f9}
.faq-a a{color:#1d4ed8;font-weight:700}
.faq-a strong{color:#1e293b}
.faq-tag{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:800;margin-right:6px;margin-bottom:4px}
.tag-blue{background:#dbeafe;color:#1e40af}
.tag-green{background:#dcfce7;color:#166534}
.tag-amber{background:#fef3c7;color:#92400e}
.tag-red{background:#fee2e2;color:#991b1b}
.tag-purple{background:#ede9fe;color:#5b21b6}
/* Contact cards */
.contact-card{background:#f8fafc;border:1px solid #e2e8f0;border-radius:12px;padding:14px 16px;display:flex;gap:12px;align-items:flex-start}
.contact-avatar{width:38px;height:38px;border-radius:50%;background:#1d4ed8;color:white;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.contact-name{font-size:14px;font-weight:800;color:#1e293b}
.contact-role{font-size:11px;color:#64748b;font-weight:700;margin-top:1px}
.contact-info{font-size:12px;color:#1d4ed8;margin-top:4px;font-weight:700}
/* Checklist */
.checklist{list-style:none}
.checklist li{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-bottom:1px solid #f1f5f9;font-size:13px;color:#374151;line-height:1.5}
.checklist li:last-child{border-bottom:none}
.checklist li::before{content:'☐';font-size:16px;color:#94a3b8;flex-shrink:0;line-height:1.2}
.checklist li.done::before{content:'✅';color:#22c55e}
/* Highlight boxes */
.hbox{border-radius:12px;padding:14px 18px;margin-bottom:12px}
.hbox-blue{background:#eff6ff;border-left:4px solid #3b82f6}
.hbox-green{background:#f0fdf4;border-left:4px solid #22c55e}
.hbox-amber{background:#fefce8;border-left:4px solid #eab308}
.hbox-red{background:#fef2f2;border-left:4px solid #ef4444}
.hbox-purple{background:#faf5ff;border-left:4px solid #a855f7}
.hbox-title{font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:0.06em;color:#64748b;margin-bottom:6px}
.hbox-body{font-size:13px;color:#374151;line-height:1.6}
/* Step list */
.step-list{list-style:none;counter-reset:s}
.step-list li{counter-increment:s;display:flex;gap:12px;margin-bottom:12px;align-items:flex-start;font-size:13px;color:#374151;line-height:1.6}
.step-list li::before{content:counter(s);background:#1d4ed8;color:white;min-width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:900;flex-shrink:0;margin-top:1px}
.section-label{font-size:11px;font-weight:900;color:#94a3b8;text-transform:uppercase;letter-spacing:0.07em;margin-bottom:8px}
.divider{font-size:11px;font-weight:900;color:#94a3b8;text-transform:uppercase;letter-spacing:0.07em;padding:14px 0 8px;border-top:1px solid #f1f5f9;margin-top:4px}
.search-result-item{border:1px solid #e2e8f0;border-radius:12px;padding:12px 16px;margin-bottom:8px;background:white;cursor:pointer}
.search-result-item:hover{border-color:#1d4ed8;background:#f8fafc}
.sri-title{font-size:14px;font-weight:800;color:#1e293b;margin-bottom:4px}
.sri-excerpt{font-size:12px;color:#64748b;line-height:1.5}
.sri-section{font-size:11px;font-weight:800;color:#1d4ed8;margin-top:4px}
em.hl{background:#fef08a;border-radius:3px;font-style:normal;padding:0 2px}
@media(max-width:680px){.grid-2,.grid-3{grid-template-columns:1fr}.hero{padding:20px}.hero::after{display:none}}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script type="text/babel">
const { useState, useMemo } = React;

// ── SEARCH DATA ───────────────────────────────────────────────────────────────
const SEARCH_INDEX = [
  { section:'Getting Started', q:'What should I do before my first day?', a:'Complete your pre-arrival checklist: select benefits on Rippling, choose scrub/white coat size, set up two-factor authentication on Gmail per IT instructions, add your email signature, complete Jumpcloud login setup, and set up your digital signature.' },
  { section:'Getting Started', q:'What do I wear on my first day?', a:'Wear dark scrubs. Most MDs and APPs wear black.' },
  { section:'Getting Started', q:'What happens on my first day?', a:'Meet the onboarding team at your designated clinic. You\'ll tour the office, finish setting up your computer, get Nextech and Medwork set up, and begin seeing scheduled patients — starting with shadowing, then supervised visits, then solo. Goal is to confidently complete an initial visit with vein talk by end of day.' },
  { section:'Systems', q:'What is Nextech used for?', a:'Nextech is your EMR. It handles clinical documentation, patient charts, and generates visit and procedure bills. Daily login: make sure to change your location to the clinic of the day.' },
  { section:'Systems', q:'What is Medwork used for?', a:'Medwork is the CRM. It tracks patient leads, monitors insurance auth status, tracks completion of approved procedures, and makes sure no leads, patients, or procedures are left behind. The provider-specific prior auth list is the most frequently used feature.' },
  { section:'Systems', q:'What is Luma used for?', a:'Luma handles patient engagement and communication: automated reminders, digital intake forms, secure patient messaging, and post-visit instructions.' },
  { section:'Systems', q:'What is Ring Central used for?', a:'Ring Central is the Provider Emergency Line and is used for post-procedure check-ins with patients. It is NOT for scheduling or admin calls.' },
  { section:'Systems', q:'What is Rippling used for?', a:'Rippling is the HR portal. Use it for your schedule, benefit registration, PTO requests, and HR documents.' },
  { section:'Systems', q:'How do I sign notes in Nextech?', a:'Ideally sign notes within 24 hours. Do NOT sign same-day — techs need time to finish notes and adjust PRN for insurance. On busy days, sign at end of day or first thing in the morning. If you have pop-ups on your to-do list, you have delinquent notes. For tech issues, email IT with a screenshot of your signature settings and your ANYDESK ID.' },
  { section:'Systems', q:'What are the different appointment/note types in Nextech?', a:'Initial, US Review, Procedure, Follow Up (post-procedure, 1 mo, 3 mo, 6 mo, 9 mo, f/u other), Conservative Review, plus separate notes for US results, compression Rx, and US orders. The EMN type must match what was actually done — this is critical for billing.' },
  { section:'Systems', q:'What are the Note Section / Social Notes used for?', a:'The Note section is for intra-office personal use (not part of the official medical record). You must place a note for every patient you see. Use it to avoid awkward re-introductions, help the call center, and capture personal details for rapport-building (e.g., "patient\'s son is starting college at GW").' },
  { section:'Systems', q:'How does prior authorization work?', a:'After a US review, tell staff to submit for procedures. The tech clicks a box in the review note generating a LOMN. The LOMN team reviews, ensures medical necessity criteria are met, and passes to the PA team who submits to insurance and follows up. Check status via Medwork. Always verify PA is approved for the correct provider, location, and dates before performing a procedure.' },
  { section:'Systems', q:'What are the PA email contacts by region?', a:'NYC Vein (Midtown, FIDI, Bronx, Brooklyn): NYC Vein PA@lomn | Long Island: LI Vein PA | Hartsdale: Hartsdale Vein PA | Maryland/DC: MD Vein PA | New Jersey: NJ Vein PA | California (SD, SJ, PA): SD/SJ/PA Vein | Connecticut: CT Vein PA | Texas: TX Vein PA' },
  { section:'FAQs', q:'How do I call out sick or handle a family emergency?', a:'As soon as you know you\'ll be out, EMAIL Gabriella Soares, Dr. Caroline Novak, HR, and your ROD. They will initiate rescheduling patients and relocating staff.' },
  { section:'FAQs', q:'How do I block days for a meeting or personal appointment?', a:'Enter the block yourself in Nextech (include a reason if under 1 hour), then email your region-specific scheduling listserv (e.g. nyc.veinscheduling@vipmedicalgroup.com) and cc Gabriella Soares.' },
  { section:'FAQs', q:'What do I do if there is a scheduling error?', a:'Email schedulingerror@vipmedicalgroup.com. Mistakes happen — sending them to the team helps identify patterns and improve workflow.' },
  { section:'FAQs', q:'What do I do if there is no front desk?', a:'Sonographers should know how to check in patients, scan insurance, verify coverage, collect copays, and schedule patients. Marjorie Vandermeulen can help set up a virtual front desk via iPad.' },
  { section:'FAQs', q:'How do I handle a walk-in patient?', a:'If you have reasonable availability, try to accommodate. Collect insurance and ID, send to verification-team@medwork.io marked URGENT. If the schedule can\'t accommodate, ask front desk to collect info and schedule an appointment.' },
  { section:'FAQs', q:'How do I request vacation or time off?', a:'Request in Rippling. If no response within a week, email HR and cc Dr. Caroline Novak with your dates and note it was requested in Rippling. Always request at least one month in advance — ideally more. You can take up to two consecutive weeks.' },
  { section:'FAQs', q:'What do I do with an unhappy patient?', a:'Room the patient quickly to get them out of the waiting room. Inform the doctor who should come quickly to mitigate. Leave a note in the chart and email customerservice@medwork.io. To "fire" a patient (DNC), reach out to Dr. Caroline Novak and customerservice@medwork.io with full context.' },
  { section:'FAQs', q:'How do I handle medical records requests?', a:'Have the front desk handle all records requests. If you receive a direct request, reply to all MR team emails within 24-48 hours. For insurance requests, skim and reply "approved." For non-insurance, review and consider a brief cover letter.' },
  { section:'FAQs', q:'How do I write a work or jury duty excuse note?', a:'Email/chat your front desk the text in quotes (e.g. "To Whom It May Concern — Patient had procedures on [date]...") and ask them to place it on letterhead. For jury duty, stay vague — you can provide lifestyle modifications and exercise restrictions, but you cannot excuse a patient from jury duty — that is for a judge.' },
  { section:'FAQs', q:'What is the supply closet/login password?', a:'Usually 4141 for supply closets. Passwords/logins are usually 414141. For inventory requests: inventorymanager@vipmedicalgroup.com. For facility issues (leak, AC, etc.): facilities@vipmedicalgroup.com.' },
  { section:'FAQs', q:'What about the after-hours / emergency line?', a:'Login info sent to your Gmail — use the Ring Central app. Expectations: respond within 24 hours to after-hours communications. Redirect scheduling requests to the appropriate team. If working with an APP, MDs and APPs share monitoring on an alternating schedule.' },
  { section:'Clinical', q:'What should I expect at an initial consultation?', a:'MA/sonographer does intake → presents to MD/APP at a med-student level. MD/APP confirms history and does the Vein Talk (script and slides). Sonographer scans (~35 min). Front desk checks out and books next appointment. Timing: 10-15 min intake, 10-15 min physician encounter, 35 min scan. Never let patients leave without their next appointment scheduled.' },
  { section:'Clinical', q:'What is the Vein Talk?', a:'A scripted but adaptable patient education session explaining venous insufficiency pathophysiology, the patient\'s individual risk factors, and next steps. Always do the vein talk — even if a patient has seen another doctor. Use the script and slides from your Google Drive Resource Folder. Develop your own style over time.' },
  { section:'Clinical', q:'What are the classic symptoms of vein disease?', a:'Dull, achy, heavy, fatigue, throbbing — worse at end of day, worse with prolonged standing or sitting. Often improves with elevation or compression. Symptoms are subtle and progress slowly. Always try to elicit symptoms even if the sonographer says "asymptomatic" or "only cosmetic."' },
  { section:'Clinical', q:'What are the US thresholds for treatment?', a:'Minimum vein diameter: 3 mm. Minimum reflux time: 500 ms. Proximal GSV → RFA. Distal GSV → Varithena (UGFS). SSV → RFA. Varicose veins → UGFS. Duplicate veins → anatomy dependent.' },
  { section:'Clinical', q:'When is conservative therapy required?', a:'Many insurers require a documented conservative trial (usually 6 or 12 weeks of compression stocking use) before approving procedures. Always prescribe compression stockings at the first visit so the clock starts. Check the Vein Policy Hub for payer-specific requirements. Exceptions: active VV rupture, ulceration, recurrent thrombophlebitis.' },
  { section:'Clinical', q:'How does the conservative therapy workflow go?', a:'6-week trial: Initial → Conservative Review → 6-week phone follow-up with RN → Auth submitted → patient called to schedule when approved. 12-week trial: Initial → Conservative Review → 6-week follow-up visit → 12-week phone follow-up → Auth submitted → procedures scheduled.' },
  { section:'Clinical', q:'What is the US Review appointment?', a:'The second visit where physician reviews scan results with patient, explains treatment plan, and communicates plan to the IB team. When you leave the room, communicate the plan to the sonographer: e.g. "BL GSV RFA, BL Varithena x2." Patient leaves without a scheduled appointment — the team calls them when procedures are approved.' },
  { section:'Clinical', q:'What happens at follow-up appointments?', a:'Post-procedure scan: ideally 3-7 days post-procedure (acceptable 2 days to 2 weeks). Always take new photos at every follow-up. Schedule full scans at 1, 3, 6, 9, and 12 months with photos.' },
  { section:'Clinical', q:'What are the Varithena CPT codes?', a:'CPT 36465: Injection of foam sclerosant into a single incompetent extremity truncal vein (ultrasound guided). CPT 36466: Injection into multiple incompetent extremity truncal veins in the same leg. These apply to GSV, SSV, and their accessory veins.' },
  { section:'Clinical', q:'What is phlebolymphedema?', a:'The coexistence of chronic venous insufficiency (CVI) and lymphedema. Caused by lymphatic overload from chronic venous hypertension, leading to lymphatic dysfunction and protein-rich fluid accumulation. Management includes compression therapy (Class II 20-30 mmHg), CDT (complete decongestive therapy) via certified lymphedema therapist, and venous ablation if significant reflux confirmed. VIP uses Tactile as the main referral for pneumatic compression pumps.' },
  { section:'Protocols', q:'What is the needlestick injury protocol?', a:'1. Assess risk and document in Nextech using the Needlestick Protocol note. 2. Ask patient about HBV vaccination, needle contamination, recent HBV/HCV/HIV testing, and risk factors. 3. Get verbal consent for testing and document it. 4. Contact Medical Directors IMMEDIATELY (Dr. Caroline Novak / Dr. Schoenfeld for Vein; Dr. Hanna for Pain). 5. Send patient to Quest Diagnostics — VIP reimburses travel and testing costs (patient brings receipt). 6. Email HR to complete OSHA incident form at hr@vipmedicalgroup.com. Tests: Rapid HIV, HCV antibody, HBV antigen and antibody. For employees: go to ER/Urgent Care/Concentra immediately. NYC employees: NYU ED at 570 1st Ave. Workers Comp: AP Intego Insurance Group, Policy #76WEGZU7497.' },
  { section:'Protocols', q:'What do I do for an aborted procedure?', a:'You still bill for an aborted procedure — supplies and time were used. Make sure to free-text the note to include the reason for aborting. If a patient checks in but the visit is determined to be in error (scheduling/insurance issue), you can reschedule or remove the appointment.' },
  { section:'Marketing', q:'How does the referral system work?', a:'Outbound: Clinical staff generate a Nextech Outbound Referral Form → referrals team sends via email/fax. Inbound: Referrals team creates profile on ClickUp, Medwork, and Nextech, contacts patient 4+ times to book. Internal (Vein ↔ Pain): Generate Nextech Internal Referral Form or book directly using the Internal Referrals Appointment Type.' },
  { section:'Marketing', q:'What are my marketing responsibilities?', a:'Attend an introductory meeting with the CMO. Participate in an onboarding photoshoot (coordinated by marketing). Encourage social media — marketing handles editing and publishing. Submit Before & After photos 2x/month. Encourage Google reviews — QR codes and email templates are available.' },
];

// ── FAQ ITEM ────────────────────────────────────────────────────────────────
function FaqItem({ q, a, section, highlight }) {
  const [open, setOpen] = useState(false);
  const hl = (text) => {
    if (!highlight) return text;
    const re = new RegExp(`(${highlight.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')})`, 'gi');
    const parts = text.split(re);
    return parts.map((p,i) => re.test(p) ? <em key={i} className="hl">{p}</em> : p);
  };
  return (
    <div className="faq-item">
      <div className="faq-q" onClick={()=>setOpen(o=>!o)}>
        <span>{hl(q)}</span>
        <span className="faq-chevron">{open ? '▲' : '▼'}</span>
      </div>
      {open && (
        <div className="faq-a">
          {section && <div style={{marginBottom:8}}><span className="faq-tag tag-blue">{section}</span></div>}
          <div style={{whiteSpace:'pre-wrap'}}>{hl(a)}</div>
        </div>
      )}
    </div>
  );
}

// ── HOME TAB ────────────────────────────────────────────────────────────────
function HomeTab({ setMode, setAdminTab, setClinicalTab }) {
  const go = (mode, sub) => {
    if (mode === 'admin') { setAdminTab(sub); setMode('admin'); }
    else { setClinicalTab(sub); setMode('clinical'); }
  };
  const quickLinks = [
    { icon:'📋', label:'Pre-Arrival Checklist', mode:'admin', sub:'start' },
    { icon:'🛠️', label:'Tools & Systems', mode:'admin', sub:'systems' },
    { icon:'🩺', label:'Clinical Guide', mode:'clinical', sub:'clinical' },
    { icon:'💉', label:'Treatment Guide', mode:'clinical', sub:'treatment' },
    { icon:'❓', label:'FAQs', mode:'admin', sub:'faq' },
    { icon:'📞', label:'Contacts', mode:'admin', sub:'contacts' },
    { icon:'🚨', label:'Protocols', mode:'admin', sub:'protocols' },
    { icon:'🎯', label:'Marketing', mode:'admin', sub:'marketing' },
  ];
  return (
    <div>
      <div className="card">
        <div className="card-title">⚡ Quick Access</div>
        <div className="ql-grid">
          {quickLinks.map(l => (
            <div key={l.sub} className="ql-tile" onClick={()=>go(l.mode, l.sub)}
              style={{borderColor: l.mode==='clinical' ? '#d1fae5' : '#ede9fe'}}>
              <div className="ql-icon">{l.icon}</div>
              <div className="ql-label">{l.label}</div>
              <div style={{fontSize:10,fontWeight:800,marginTop:6,color:l.mode==='clinical'?'#059669':'#7c3aed'}}>{l.mode==='clinical'?'🩺 Clinical':'⚙️ Systems'}</div>
            </div>
          ))}
        </div>
      </div>

      <div className="card">
        <div className="card-title">🚨 Emergency Quick Reference</div>
        <div className="grid-2">
          <div className="hbox hbox-red">
            <div className="hbox-title">Needlestick Injury</div>

    return SEARCH_INDEX.filter(item => {
      const matchSection = section === 'All' || item.section === section;
      const matchQ = !q || item.q.toLowerCase().includes(q.toLowerCase()) || item.a.toLowerCase().includes(q.toLowerCase());
      return matchSection && matchQ;
    });
  }, [q, section]);

  return (
    <div>
      <div className="card" style={{marginBottom:16}}>
        <div className="card-title">❓ Frequently Asked Questions</div>
        <div style={{display:'flex',gap:10,flexWrap:'wrap',marginBottom:14}}>
          {sections.map(s=>(
            <button key={s} onClick={()=>setSection(s)} style={{padding:'7px 14px',borderRadius:20,border:'none',cursor:'pointer',fontSize:12,fontWeight:800,background:section===s?'#1d4ed8':'#e2e8f0',color:section===s?'white':'#475569',transition:'all 0.15s'}}>{s}</button>
          ))}
        </div>
        <input value={q} onChange={e=>setQ(e.target.value)} placeholder="Search all FAQs..." style={{width:'100%',padding:'10px 16px',border:'2px solid #e2e8f0',borderRadius:10,fontFamily:'Nunito',fontSize:14,fontWeight:600,outline:'none'}} />
        <div style={{fontSize:12,color:'#94a3b8',marginTop:8,fontWeight:600}}>{filtered.length} result{filtered.length!==1?'s':''}</div>
      </div>
      {filtered.length === 0 && <div style={{textAlign:'center',padding:48,color:'#94a3b8'}}>No FAQs match your search</div>}
      {filtered.map((item,i) => <FaqItem key={i} q={item.q} a={item.a} section={item.section} highlight={q} />)}
    </div>
  );
}
