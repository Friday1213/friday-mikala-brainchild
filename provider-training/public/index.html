  {id:43,cat:'Clinical Decision Making',type:'mc',q:'Which of the following is the best first-line treatment for an isolated incompetent GSV with SFJ reflux?',opts:['Phlebectomy of all visible varicose veins first','Sclerotherapy of tributaries first','Truncal ablation of the GSV (RFA, laser, VenaSeal, or Varithena) as primary treatment','High-dose compression and re-evaluate in 6 months'],ans:2,exp:'Treatment of the underlying source (truncal incompetence) should precede tributary treatment. Ablating the GSV eliminates the high-pressure source driving the varicosities. Treating tributaries before the trunk leads to higher recurrence rates.'},
  {id:44,cat:'Clinical Decision Making',type:'mc',q:'A patient presents with bilateral GSV reflux. What is the standard approach to sequencing treatment?',opts:['Treat both legs simultaneously in one session','Treat the more symptomatic or severe leg first; stage the second leg (typically 2–6 weeks later)','Always treat left leg first','Only treat bilateral disease if CEAP is C4 or higher'],ans:1,exp:'Bilateral GSV reflux is treated in staged fashion — more symptomatic/severe side first, with the contralateral leg treated 2–6 weeks later once the first leg has been confirmed closed on follow-up duplex. Simultaneous bilateral treatment increases DVT risk and recovery burden.'},
  {id:45,cat:'Clinical Decision Making',type:'mc',q:'Absolute contraindications to endovenous thermal ablation (RFA/EVLA) include which of the following?',opts:['CEAP C2 disease','GSV diameter > 6 mm','Acute DVT in the deep system or planned treatment vein; severe vein tortuosity preventing catheter passage','Mild hypertension'],ans:2,exp:'Absolute contraindications: acute DVT in the vessel to be treated or adjacent deep vein, inability to pass catheter (severe tortuosity), known allergy to tumescent components. Relative: pregnancy, hypercoagulable states, immobility, severe peripheral arterial disease.'},
  {id:46,cat:'Clinical Decision Making',type:'mc',q:'VenaSeal (cyanoacrylate glue closure) has which key advantage over thermal ablation?',opts:['Requires tumescent anesthesia along the entire vein','Has a lower rate of nerve injury as it does NOT require tumescent anesthesia','Is FDA-approved for all vein sizes above 20 mm','Requires mandatory anticoagulation post-procedure'],ans:1,exp:'VenaSeal does not require tumescent anesthesia — eliminating the risk of nerve injury from needle trauma along the vein and patient discomfort from multiple injections. Post-procedure compression is simpler. No anticoagulation required.'},
  {id:47,cat:'Clinical Decision Making',type:'mc',q:'Varithena (polidocanol injectable foam) is best used for which clinical scenario?',opts:['Primary treatment of straight GSV > 8 mm with SFJ reflux','Treatment of tortuous GSV, incompetent tributaries, and accessory veins not amenable to catheter-based thermal ablation','First-line treatment for active venous ulcers without prior workup','Standard treatment for SSV in the popliteal fossa'],ans:1,exp:'Varithena is ideal for tortuous veins, AASV, tributaries, and recurrent varicosities not suitable for thermal catheter. It can also treat GSV segments. Limitations: maximum dose of 15 mL per session, less predictable in large-diameter straight veins.'},
  {id:48,cat:'Clinical Decision Making',type:'mc',q:'A patient on anticoagulation for atrial fibrillation needs GSV treatment. What is the recommended approach?',opts:['Always discontinue anticoagulation 7 days before procedure','Continue anticoagulation — do not stop for venous ablation procedures; increases DVT protection peri-procedurally','Switch to aspirin only','Postpone all treatment indefinitely'],ans:1,exp:'Patients on therapeutic anticoagulation (DOAC, warfarin) should generally CONTINUE their anticoagulation for venous ablation. Stopping anticoagulation increases thrombotic risk in patients who need it. Procedures can safely proceed on therapeutic anticoagulation with appropriate precautions.'},
  {id:49,cat:'Clinical Decision Making',type:'mc',q:'A pregnant patient presents with symptomatic varicose veins. What is the appropriate management?',opts:['RFA during second trimester is safe','VenaSeal is safe during all trimesters','Conservative management with compression stockings; defer definitive treatment until at least 3 months postpartum','Sclerotherapy is the only safe option during pregnancy'],ans:2,exp:'All interventional vein treatments (thermal, sclerotherapy, glue, foam) are contraindicated during pregnancy. Conservative management with graduated compression stockings is the standard of care. Definitive treatment is deferred until ≥3 months postpartum to allow spontaneous resolution of pregnancy-related venous dilation.'},
  {id:50,cat:'Clinical Decision Making',type:'mc',q:'A patient with known Factor V Leiden heterozygosity presents for GSV treatment. What is the best approach?',opts:['Hypercoagulable states are an absolute contraindication — never treat','Treat as standard; no additional precautions needed','Consider peri-procedural anticoagulation prophylaxis and post-procedure monitoring; discuss risk/benefit with patient and possibly hematology','Delay until negative genetic testing on all first-degree relatives'],ans:2,exp:'Hypercoagulable states (Factor V Leiden, antiphospholipid syndrome, etc.) are relative contraindications. Consider prophylactic anticoagulation peri-procedurally, thorough post-procedure duplex surveillance, and informed consent about elevated DVT/EHIT risk. Hematology consultation may be appropriate.'},
  {id:51,cat:'Clinical Decision Making',type:'mc',q:'What is the CEAP classification for a patient with an active venous leg ulcer?',opts:['C4b','C5','C6','C3'],ans:2,exp:'C6 = active venous ulcer. C5 = healed venous ulcer. C4b = lipodermatosclerosis/atrophie blanche. C4a = pigmentation/eczema. The "s" or "a" suffix (symptomatic/asymptomatic) may also be added (e.g., C6s).'},
  {id:52,cat:'Clinical Decision Making',type:'ft',q:'A patient has GSV reflux from SFJ to below the knee, with large varicose veins on the medial thigh and calf, and also has varicosities supplied by an incompetent AASV. Describe your treatment sequencing plan.',modelAns:'Step 1: Treat the primary truncal source first — ablate the refluxing GSV (RFA, EVLA, VenaSeal, or Varithena depending on diameter/anatomy) from below SFJ to below knee. Step 2: If the AASV has significant independent reflux and varicosities, plan a second session to ablate the AASV. Step 3: At 4–6 weeks post-truncal ablation, reassess residual varicosities — many will significantly involute once the source is eliminated. Treat remaining significant varicosities with ambulatory phlebectomy or sclerotherapy. This staged approach avoids overtreating tributaries that may resolve spontaneously and ensures insurance coverage.'},
  {id:53,cat:'Clinical Decision Making',type:'mc',q:'What is the recommended minimum conservative therapy duration for Aetna before authorizing lower extremity vein treatment?',opts:['3 weeks','6 weeks','12 weeks','6 months'],ans:2,exp:'Aetna typically requires 12 weeks of conservative therapy (compression stockings 20–30 mmHg, documented compliance). Always verify with current payer policy as requirements change. Documentation of compliance and symptom persistence is critical.'},
  {id:54,cat:'Clinical Decision Making',type:'mc',q:'Phlebectomy (ambulatory phlebectomy / microphlebectomy) is most appropriate for which scenario?',opts:['Treating the incompetent GSV trunk','Removing large, bulging, symptomatic varicose tributaries at or after truncal ablation','First-line treatment for CEAP C6 ulcers before duplex workup','Emergency management of thrombophlebitis'],ans:1,exp:'Ambulatory phlebectomy is a complementary procedure typically performed after (or concurrently with) truncal ablation to remove large, bulging tributaries. It can also be performed as a standalone for isolated varicosities without truncal reflux.'},
  {id:55,cat:'Clinical Decision Making',type:'mc',q:'When treating recurrent varicose veins after prior high ligation/stripping, what is the most important initial step?',opts:['Immediately schedule repeat surgery','Perform comprehensive repeat duplex mapping to identify new sources of reflux (neovascularization, residual GSV, perforators, AASV)','Administer foam sclerotherapy to all visible veins','Order MRI venography'],ans:1,exp:'Recurrent varicose veins are complex and have multiple possible etiologies: neovascularization at the prior SFJ ligation site, residual GSV segments, AASV reflux, perforator incompetence, or new superficial reflux. Thorough repeat duplex mapping is mandatory before any reintervention.'},
  {id:56,cat:'Clinical Decision Making',type:'mc',q:'A patient has documented GSV reflux but no insurance coverage and limited finances. They ask about out-of-pocket options. Which treatment typically has the lowest overall cost for GSV ablation?',opts:['RFA with manufacturer disposables','Foam sclerotherapy (compounded or Varithena)','VenaSeal per session','All options cost the same'],ans:1,exp:'Foam sclerotherapy (particularly office-prepared foam using compounded polidocanol or STS) generally has the lowest equipment cost per session compared to thermal ablation or VenaSeal. However, multiple sessions may be required. Varithena is FDA-approved foam but is significantly more expensive.'},
  {id:57,cat:'Clinical Decision Making',type:'mc',q:'What is the primary goal of tumescent anesthesia in thermal ablation (RFA/EVLA)?',opts:['To dilate the vein for easier catheter passage','To provide anesthesia AND create a perivenous fluid shield that dissipates heat, protects surrounding tissues (nerve, skin), and compresses the vein around the catheter for optimal contact','To prevent the sclerotherapy from spreading','To increase blood flow for augmented hemostasis'],ans:1,exp:'Tumescent anesthesia serves dual purposes: (1) analgesia along the vein; (2) creating a perivenous fluid cushion that insulates surrounding structures from thermal injury AND compresses the vein wall against the catheter for optimal energy delivery. Adequate tumescent is critical for safety and efficacy.'},
  {id:58,cat:'Clinical Decision Making',type:'mc',q:'A patient with a GSV diameter of 14 mm at the mid-thigh seeks treatment. Which factor most impacts your treatment modality choice?',opts:['Large diameter favors VenaSeal exclusively','Large diameter vein (>10–12 mm) may have higher failure rates with VenaSeal; RFA or EVLA with appropriate settings, or a staged approach, may be preferred','Diameter has no bearing on modality selection','Only VenaSeal is approved for veins > 10 mm'],ans:1,exp:'Large GSV diameters (>10–12 mm) are associated with higher recanalization rates with VenaSeal. Thermal ablation (RFA/EVLA) remains effective in larger veins with appropriate energy delivery and adequate tumescence. Some providers use combination approaches for very large veins.'},
  {id:59,cat:'Clinical Decision Making',type:'ft',q:'Describe the CEAP classification system, including the C, E, A, and P components, and give an example of a full CEAP classification for a patient with active venous ulcer due to primary GSV reflux.',modelAns:'CEAP: C=Clinical class (C0-C6: no visible disease through active ulcer), E=Etiology (Ec=congenital, Ep=primary, Es=secondary, En=no identifiable cause), A=Anatomy (As=superficial, Ad=deep, Ap=perforator, An=none), P=Pathophysiology (Pr=reflux, Po=obstruction, Pr,o=both, Pn=none). Example: C6s,Ep,As,Pr — active symptomatic ulcer (C6s), primary etiology, superficial system involvement, reflux as pathophysiology. Full documentation includes reporting all relevant C classes, and a revised CEAP 2020 allows C2r for recurrent varicose veins.'},
  {id:60,cat:'Clinical Decision Making',type:'mc',q:'Which of the following patients is NOT a candidate for outpatient vein treatment and should be referred to a vascular surgeon?',opts:['A 45-year-old with bilateral C2 varicose veins and documented GSV reflux','A patient with C6 active ulcer who has undergone prior treatment and has only perforator/deep reflux driving persistent ulceration','A patient on a DOAC needing GSV ablation','A patient with CEAP C4b on conservative therapy for 12 weeks'],ans:1,exp:'Patients with active C6 ulcers driven by deep venous disease or incompetent perforators unresponsive to superficial treatment, especially when vascular surgical intervention (sub-fascial endoscopic perforator surgery, deep vein reconstruction) may be needed, warrant vascular surgery referral. Straightforward superficial reflux can be managed in the vein office regardless of CEAP class.'},

  // ── PATIENT COMMUNICATION (20) ──
  {id:61,cat:'Patient Communication',type:'mc',q:'A patient asks: "What exactly is venous reflux and why does it cause varicose veins?" Which explanation is most accurate and patient-friendly?',opts:['"Your blood is too thick and pools in your legs."','"The valves inside your leg veins aren\'t closing properly, so blood flows backward instead of toward your heart — it pools, increases pressure, and over time this stretches the vein walls, causing the twisting, bulging veins you can see."','"You have a blockage in your veins from a blood clot."','"Your arteries are pushing blood too hard into the leg veins."'],ans:1,exp:'Reflux is best explained as valve failure causing backward blood flow. Using simple language ("valves not closing," "blood flows backward," "pools and raises pressure") helps patients understand why they have symptoms and why treatment targets the underlying valve problem.'},
  {id:62,cat:'Patient Communication',type:'mc',q:'A patient asks why they need to wear compression stockings for months before insurance will cover treatment. The best response is:',opts:['"Insurance companies just want to delay care."','"Your veins might heal on their own without treatment."','"Most insurance plans require documented conservative therapy first because compression can significantly improve symptoms and is the established first-line treatment. We need to document that your symptoms persist despite compliance with compression before they\'ll authorize a procedure."','"The stockings are more effective than the procedure."'],ans:2,exp:'Explaining the rationale professionally — that compression is standard first-line therapy and payer authorization requires documented failure — helps patients understand the prior authorization process without undermining trust in the medical system or creating false expectations.'},
  {id:63,cat:'Patient Communication',type:'mc',q:'Post-procedure instructions after RFA of the GSV should include all of the following EXCEPT:',opts:['Wear compression stockings continuously for the first 48–72 hours, then during waking hours for 1–2 weeks','Walk 30 minutes daily starting the day of or day after procedure','Avoid strenuous exercise, heavy lifting, and air travel for 1–2 weeks','Take complete bed rest for 2 weeks and avoid any walking'],ans:3,exp:'Early ambulation is ESSENTIAL after venous ablation to reduce DVT risk. Complete bed rest is contraindicated. Patients should walk 30 minutes per day starting the day of or day after the procedure. Compression, activity modification (no heavy lifting/gym), and avoidance of prolonged immobility are key instructions.'},
  {id:64,cat:'Patient Communication',type:'ft',q:'A patient calls your office 3 days after GSV RFA and says their thigh is bruised, warm, and tender along the vein. They are worried. How do you counsel them?',modelAns:'Reassure the patient that bruising, warmth, and tenderness along the treated vein in the first 1–2 weeks are EXPECTED and NORMAL after thermal ablation — this is called post-ablation phlebitis or the inflammatory response that is part of how the vein closes. It is NOT a blood clot or infection. Instruct them to continue wearing compression, walk daily, and take NSAIDs (ibuprofen/naproxen) if not contraindicated to manage inflammation and discomfort. However, ask RED FLAG questions: Is the pain or swelling in the CALF (not just along the treated vein)? Any new groin swelling? Fever? Shortness of breath or chest pain? These would prompt an urgent duplex ultrasound to rule out DVT/EHIT/PE.'},
  {id:65,cat:'Patient Communication',type:'mc',q:'A patient asks: "When can I go back to the gym and do heavy exercise after my vein procedure?" The most appropriate answer is:',opts:['Never — veins are permanently fragile after treatment','You can return to full activities immediately after the procedure','Typically 2 weeks after the procedure for strenuous exercise (weights, running, cycling). Light walking is encouraged from day one. We want the vein to stay closed during the healing period.','Return to gym after 6 months'],ans:2,exp:'Standard return to strenuous exercise is typically 2 weeks (some providers say 1–2 weeks depending on procedure type). Early ambulation (walking) begins same day or next day. The rationale is allowing sufficient vein wall adhesion/closure before high-demand activity that increases venous pressure.'},
  {id:66,cat:'Patient Communication',type:'mc',q:'A patient is frustrated that their varicose veins are "still there" 2 weeks after GSV ablation. How do you explain this?',opts:['The procedure failed — repeat immediately','The procedure only treats the source (the GSV); tributary varicose veins may take 3–6 months to reabsorb. Some may need additional treatment (phlebectomy or sclerotherapy) at your follow-up visit.','You have permanent scarring now','The insurance company made an error'],ans:1,exp:'After truncal ablation, varicose tributaries often improve significantly over 3–6 months as venous pressure decreases. Patients need counseling that the treated vein is now closed and is resolving, and that residual varicosities may be addressed at their follow-up appointment if they persist.'},
  {id:67,cat:'Patient Communication',type:'mc',q:'How do you explain the difference between venous edema and lymphedema to a patient?',opts:['They are the same condition treated identically','"Venous swelling typically worsens throughout the day and improves overnight with leg elevation, is usually pitting, and is caused by high pressure in your veins. Lymphedema is caused by a damaged or blocked lymphatic system, does not pit as easily, does not improve as dramatically with elevation, and requires specialized lymphedema therapy."','"Lymphedema means you have cancer."','"Both are caused by varicose veins and will resolve with vein treatment."'],ans:1,exp:'Distinguishing venous vs. lymphedema is clinically important. Venous edema: pitting, diurnal variation, responds to elevation/compression, caused by venous hypertension. Lymphedema: non-pitting, progressive, not significantly improved with elevation, involves dorsum of foot (Stemmer sign), requires specialized decongestive therapy. Mixed etiology (phlebolymphedema) is common in advanced disease.'},
  {id:68,cat:'Patient Communication',type:'mc',q:'When explaining the prior authorization process to a frustrated patient who has been waiting weeks for approval, which response is most appropriate?',opts:['"The insurance company is trying to deny your care."','"I\'m sorry for the frustration. Prior authorization is a process your insurance requires where we submit documentation showing your diagnosis, symptoms, ultrasound findings, and compliance with compression. We are actively working on your case and will call you as soon as we have approval. Here\'s what you can do to help: call your insurance member services if delays continue beyond [X] days."','"We can\'t control insurance — there\'s nothing we can do."','"Just pay out of pocket to avoid the hassle."'],ans:1,exp:'Empathy + transparency + actionable steps = best communication approach. Explain what prior auth is, that you are actively pursuing it, the typical timeline, and empower the patient with a step they can take. Never blame the payer in a way that increases patient anxiety or undermines the process.'},
  {id:69,cat:'Patient Communication',type:'ft',q:'A patient insists they want both legs treated in one visit "to get it over with." Explain why you recommend staging bilateral treatment.',modelAns:'Acknowledge the patient\'s desire to minimize appointments. Explain: "I completely understand wanting to take care of everything at once. The reason we recommend treating one leg at a time — about 2–4 weeks apart — is safety. When we treat both legs simultaneously, you\'d be wearing compression on both legs, making it harder to walk comfortably, and any post-procedure inflammation or discomfort would affect both sides at once. More importantly, doing bilateral procedures doubles the risk of a blood clot. Treating one leg at a time lets us confirm the first leg is closed and healing well before we treat the second, which is the safest and most effective approach." Offer a reassurance that the second leg will be scheduled promptly.'},
  {id:70,cat:'Patient Communication',type:'mc',q:'A patient calls reporting they developed a firm, tender "cord" along a tributary vein 1 week after sclerotherapy. What do you tell them?',opts:['This is a DVT — go to the ER immediately','This is superficial thrombophlebitis — an expected and normal response to sclerotherapy where the sclerosant is working. The vein is inflaming and hardening. Advise warm compresses, NSAIDs, continued compression, and walking. This resolves over weeks to months. Return to the office if they develop calf pain, significant new swelling, fever, or systemic symptoms.','Tell them to stop all compression','Prescribe antibiotics'],ans:1,exp:'Post-sclerotherapy superficial thrombophlebitis (hardened, tender vein cord) is a normal part of the healing process — not a DVT. Differentiate by location (superficial vs. deep), associated features, and absence of systemic signs. Education prevents unnecessary ER visits and anxiety.'},
  {id:71,cat:'Patient Communication',type:'mc',q:'Which instruction is most important to emphasize about compression stocking use after vein procedures?',opts:['Only wear stockings when experiencing pain','Compression only needs to be worn during the first 24 hours','Wear compression stockings continuously for the first 48–72 hours post-procedure, then during all waking hours for at least 1–2 weeks. Do NOT remove at night during the first 48–72 hours.','Compression can be discontinued immediately if bruising develops'],ans:2,exp:'Continuous compression for 48–72 hours post-procedure is critical to maintaining vein wall apposition during initial closure and reducing post-procedure phlebitis and bruising. Many providers then transition to daytime-only compression for 1–2 weeks. This is a key post-procedure compliance point.'},
  {id:72,cat:'Patient Communication',type:'mc',q:'When should a patient call the office or go to the ER after a vein procedure? (Select the RED FLAG symptom set)',opts:['Minor bruising, mild tenderness along treated vein, mild swelling in treated leg only','New calf pain, unilateral significant leg swelling (calf or thigh), shortness of breath, chest pain, fever above 101°F, sudden severe pain, or skin blistering/ulceration','Mild itching at injection site','Slight skin discoloration over treated vein'],ans:1,exp:'Red flag symptoms requiring urgent evaluation: calf/thigh pain/swelling (DVT concern), SOB/chest pain (PE), high fever (infection), severe skin reactions. Normal post-procedure symptoms: bruising, mild tenderness, cord formation, skin discoloration, mild swelling along the treated vein.'},
  {id:73,cat:'Patient Communication',type:'mc',q:'A patient asks why you recommend a follow-up duplex ultrasound 48–72 hours after their RFA. The best explanation is:',opts:['"It\'s just a formality — we always do it."','"We perform a follow-up ultrasound to confirm the treated vein has closed properly and to check for any blood clot extension near the vein junction. It only takes about 15 minutes and gives us — and you — peace of mind that the procedure worked and everything is safe."','"Insurance requires it."','"We check to see if the varicose veins went away already."'],ans:1,exp:'Patient-centered explanation: the 48–72 hr duplex confirms vein closure (procedure success) and screens for EHIT (thrombus at the SFJ/CFV junction). Explaining the safety rationale — not just "we always do it" — builds trust and improves compliance with follow-up.'},
  {id:74,cat:'Patient Communication',type:'mc',q:'A patient who is 4 months postpartum asks when she can have her vein treatment after having had progressive varicosities during pregnancy. The ideal response is:',opts:['"You can start treatment immediately — postpartum is fine."','"We recommend waiting at least 3 months after delivery (you\'ve met this) and until you are no longer breastfeeding, as sclerosants and some other agents should be avoided during breastfeeding. If you are breastfeeding, thermal ablation without sclerosants may be an option to discuss. Let\'s do a duplex study and evaluate your full clinical picture."','"Wait 2 years for veins to fully resolve on their own."','"Vein treatment is not possible if you have had a pregnancy in the last year."'],ans:1,exp:'At 3+ months postpartum (this patient qualifies), treatment can be considered. Breastfeeding is a relative contraindication for sclerosants. Thermal ablation (RFA/EVLA/VenaSeal without sclerosant) can be discussed. A duplex should be done since postpartum venous anatomy often improves.'},
  {id:75,cat:'Patient Communication',type:'mc',q:'A patient with diabetes and peripheral arterial disease (ABI 0.7) asks about vein treatment for C4 disease. What is the most appropriate initial step?',opts:['Proceed with immediate vein ablation','Prescribe 40 mmHg compression stockings','Caution: compression contraindicated with ABI < 0.8. Refer to vascular surgery for arterial evaluation first. Any compression should be below 20–30 mmHg maximum, and arterial circulation must be optimized before venous treatment.','Prescribe aspirin and recheck in 1 year'],ans:2,exp:'ABI < 0.8 is a relative contraindication to standard compression; ABI < 0.5 is absolute. With ABI 0.7, full compression is potentially harmful (can impair already-compromised arterial supply). Vascular evaluation and management of arterial disease takes priority. Modified low-compression or no compression and specialist co-management is required.'},
  {id:76,cat:'Patient Communication',type:'ft',q:'A new patient is convinced their leg pain is from varicose veins but their duplex shows no significant reflux. How do you counsel this patient?',modelAns:'Acknowledge their symptoms are real and important. Explain: "Your ultrasound today does not show venous reflux (backward blood flow) significant enough to explain your symptoms or qualify for treatment. This is actually reassuring news — it means you don\'t have venous disease. However, that means we need to keep looking for the cause of your pain. Common alternatives include musculoskeletal issues (hip, knee, sciatic), arterial disease, neuropathy, or restless leg syndrome. I recommend we [describe next steps — refer to appropriate specialist, primary care workup, etc.]. I want to find the real answer for you." Do not offer venous treatment when duplex is negative.'},
  {id:77,cat:'Patient Communication',type:'mc',q:'A patient\'s insurance requires 12 weeks of compression stocking compliance. The patient says they "can\'t wear stockings" because they are too tight. What is the clinical and communication approach?',opts:['Waive the requirement and submit for prior auth immediately','Document non-compliance and move forward','Explore barriers: Are they wearing the correct size/grade? Try a different brand, open-toe vs. closed, donning aid, or 15–20 mmHg as a starting option. Document the attempt and any physical limitations. If there is a documented medical reason preventing compression use, this can often be submitted as a contraindication with prior auth.','Tell the patient they cannot have treatment'],ans:2,exp:'Many compliance issues with stockings are fixable: wrong size, too high a compression class, poor donning technique. Explore these first. If true medical contraindication exists (ABI, allergy, severe dermatitis), document it — many payers accept documented contraindication in lieu of full conservative therapy trial.'},
  {id:78,cat:'Patient Communication',type:'mc',q:'A patient is nervous about the RFA procedure and asks if it will hurt. The best response is:',opts:['"It won\'t hurt at all — you\'ll feel nothing."','"It is very painful — you may want general anesthesia."','"We use local tumescent anesthesia along the vein before the procedure, so most patients feel only mild pressure or warmth during treatment. The anesthesia injections can feel like small bee stings, but we work to keep you comfortable. Most patients go home and walk the same day."','"We don\'t use any anesthesia for this procedure."'],ans:2,exp:'Honest, reassuring, realistic communication about tumescent anesthesia: the injections may cause brief discomfort but effective numbing follows. Setting realistic expectations ("mild pressure or warmth") and emphasizing the outpatient, same-day walk nature of the procedure reduces anxiety.'},
  {id:79,cat:'Patient Communication',type:'mc',q:'A patient asks if their varicose veins will "come back" after treatment. The most honest and accurate response is:',opts:['"Once treated, veins never come back."','"Varicose veins never recur after RFA."','"Treatment closes the treated vein and its tributaries, but venous disease is a systemic condition — you may develop new varicosities over time due to genetics, lifestyle, hormones, or other incompetent veins not visible at the time of treatment. Wearing compression stockings long-term significantly reduces recurrence. We\'ll monitor you at regular intervals."','"If veins come back, it means the procedure failed."'],ans:2,exp:'Honesty about recurrence is important for long-term patient satisfaction. Treated veins stay closed in most cases, but new disease can develop. Long-term compression, healthy weight, and activity reduce recurrence. Setting this expectation avoids dissatisfaction if new veins develop years later.'},
  {id:80,cat:'Patient Communication',type:'mc',q:'Which of the following best describes how to explain venous reflux in the simplest terms to a patient with limited health literacy?',opts:['"You have retrograde saphenous flow secondary to valvular incompetence."','"Think of your leg veins like a one-way pump system. Normally, tiny valves open to let blood flow up toward your heart, then snap shut to stop it from falling back. With reflux, those valves are worn out — they can\'t snap shut, so blood falls backward, pools in your leg, and over time creates pressure and swelling. The varicose veins you see are the stretched, swollen result of that extra pressure."','"Your cholesterol is clogging your veins."','"You have autoimmune damage to your venous system."'],ans:1,exp:'Plain language using an analogy (one-way pump, valves opening and closing) is most effective for patients with limited health literacy. Avoid jargon. Visual aids or gestures (showing valve opening/closing with hands) can enhance comprehension.'},

  // ── COMPLICATIONS (20) ──
  {id:81,cat:'Complications',type:'mc',q:'EHIT Class 1 after GSV RFA is best managed with:',opts:['Immediate surgical thrombectomy','Therapeutic anticoagulation for 6 months','Serial duplex ultrasound monitoring (within 1 week); most resolve spontaneously. Low-dose anticoagulation may be considered if risk factors present.','Full systemic thrombolysis'],ans:2,exp:'EHIT Class 1 = thrombus at the SFJ level, not extending into the CFV. This is typically monitored conservatively with serial duplex (1 week). Most Class 1 EHIT resolves without intervention. Higher classes warrant anticoagulation. Class 4 (CFV occlusion) requires urgent intervention.'},
  {id:82,cat:'Complications',type:'mc',q:'A patient returns 5 days post-RFA with calf pain and swelling. Duplex shows a non-occlusive DVT in the posterior tibial vein. What is the appropriate management?',opts:['Reassure and discharge — this is normal post-procedure inflammation','Hospitalize immediately for IV heparin','Isolated distal (calf) DVT in a post-procedural patient: consider anticoagulation vs. serial duplex surveillance based on risk factors. Many protocols recommend therapeutic anticoagulation for 3 months given the procedural trigger. Evaluate risk of propagation vs. bleeding risk.','Perform emergent thrombectomy'],ans:2,exp:'Post-procedural isolated distal DVT is generally treated with anticoagulation (therapeutic DOAC x 3 months) given the procedural provocation. Some providers use serial surveillance for truly isolated calf DVT in low-risk patients, but most vein practices anticoagulate given the procedural context and ease of DOAC therapy.'},
  {id:83,cat:'Complications',type:'mc',q:'Saphenous nerve injury after GSV RFA most commonly presents as:',opts:['Motor weakness in the foot','Medial lower leg numbness, tingling, or dysesthesia below the knee','Severe groin pain radiating to the hip','Posterior calf burning pain'],ans:1,exp:'The saphenous nerve (sensory) runs adjacent to the GSV below the knee. Injury presents as medial lower leg/ankle numbness, tingling, or burning (dysesthesia/paresthesia). Adequate tumescent anesthesia and treating only above the tibial tuberosity (below-knee GSV treatment carries higher risk) reduces saphenous nerve injury.'},
  {id:84,cat:'Complications',type:'mc',q:'Which complication of foam sclerotherapy is a rare but serious adverse event that requires immediate management?',opts:['Skin hyperpigmentation','Post-procedure bruising','Visual disturbances or neurological symptoms (headache, visual change, stroke-like symptoms) — possible air/foam embolism through patent foramen ovale (PFO)','Mild leg cramps for 24 hours'],ans:2,exp:'Rare but serious: foam can enter the systemic circulation through a PFO or other right-to-left shunt, causing TIA/stroke-like symptoms (visual changes, neurological deficits). Any neurological symptom post-foam sclerotherapy requires urgent evaluation. History of PFO/migraine with aura is a relative contraindication to foam.'},
  {id:85,cat:'Complications',type:'mc',q:'Hyperpigmentation after sclerotherapy is caused by:',opts:['Chemical burn from the sclerosant','Hemosiderin deposition from extravasated red blood cells in the sclerosed vein','Allergic reaction to the sclerosant','Skin infection along the treated area'],ans:1,exp:'Post-sclerotherapy hyperpigmentation results from hemosiderin deposits — iron from extravasated RBCs that did not fully reabsorb. Risk factors include high sclerosant concentration, poor injection technique, and incomplete thrombosis of the vessel. Most cases resolve in 6–24 months; some persist. Patients should be counseled pre-procedure.'},
  {id:86,cat:'Complications',type:'mc',q:'Skin blistering over a treated vein segment after RFA is most likely caused by:',opts:['Allergic reaction to the tumescent solution','Superficial thermal injury — inadequate tumescent volume, catheter too close to the skin, or inadvertent skin contact','DVT causing skin ischemia','Normal post-procedure healing'],ans:1,exp:'Skin blistering post-RFA indicates superficial thermal injury, usually from inadequate tumescent (insufficient fluid layer between catheter and skin) or catheter placed too superficially. Prevention: adequate tumescent volume (goal: 1 cm fluid "halo" around vein), treating vein at ≥1–2 cm depth where possible.'},
  {id:87,cat:'Complications',type:'mc',q:'What is the appropriate first-line management of post-sclerotherapy matting (telangiectatic matting)?',opts:['Immediate retreat with higher concentration sclerosant','Expectant management — often resolves in 3–12 months. If persistent, low-concentration sclerotherapy of the mats or laser treatment.','Surgical excision of the affected area','Refer immediately to dermatology'],ans:1,exp:'Telangiectatic matting (new tiny spider veins appearing after sclerotherapy, often peritreatment area) is caused by angiogenesis. Most resolves spontaneously in 3–12 months. Persistent matting may be treated with very dilute sclerosant or laser. Prevention: avoid over-injection, maintain compression post-procedure.'},
  {id:88,cat:'Complications',type:'mc',q:'A patient develops a firm, painful nodule at a VenaSeal injection site in the thigh 3 weeks after treatment. The most likely diagnosis is:',opts:['Abscess — start antibiotics immediately','Foreign body reaction (inflammatory response to cyanoacrylate glue — hypersensitivity reaction)','Hematoma requiring drainage','Normal healing after VenaSeal'],ans:1,exp:'VenaSeal hypersensitivity/foreign body reaction presents as a painful nodule, erythema, or firmness along the treated vein weeks after treatment. It is an inflammatory response to the cyanoacrylate. Management: NSAIDs, warm compresses, and monitoring. Severe cases may require steroids. Distinguish from infection (fever, purulence, progressive erythema).'},
  {id:89,cat:'Complications',type:'mc',q:'Sural nerve injury is a known risk of which procedure?',opts:['GSV ablation in the mid-thigh','SSV ablation in the popliteal fossa and lower leg','AASV ablation at the SFJ','Phlebectomy of medial thigh varicosities'],ans:1,exp:'The sural nerve runs alongside the SSV in the posterior lower leg. SSV ablation procedures carry risk of sural nerve injury, presenting as lateral foot/ankle numbness or tingling. Adequate tumescent anesthesia and careful catheter positioning reduce this risk.'},
  {id:90,cat:'Complications',type:'mc',q:'A patient develops fever (101.8°F), increasing redness spreading beyond the treated vein, and purulent drainage from a treatment site 10 days post-phlebectomy. What is the next step?',opts:['Reassure — this is normal healing','Increase compression stocking pressure','Wound culture, antibiotic therapy appropriate for skin flora (staph/strep coverage), close wound monitoring, and low threshold for surgical consultation if cellulitis progresses or abscess forms','Apply heat and wait 2 more weeks'],ans:2,exp:'Signs of wound infection post-phlebectomy: fever, progressive erythema beyond the wound, purulent discharge. Management: wound culture, empiric antibiotics (cephalexin or similar for typical skin flora), close monitoring. Systemic sepsis, abscess, or rapidly progressing infection requires surgical consultation and possible IV antibiotics.'},
  {id:91,cat:'Complications',type:'mc',q:'What is the most appropriate management for EHIT Class 3 (thrombus extending into CFV > 50% occlusion)?',opts:['Serial ultrasound only — no anticoagulation needed','Prophylactic-dose anticoagulation for 1 week','Therapeutic anticoagulation immediately (full-dose DOAC or LMWH/warfarin); repeat duplex in 1 week to confirm stabilization or improvement; vascular surgery consultation if progressing to Class 4','Surgical thrombectomy as first-line'],ans:2,exp:'EHIT Class 3 warrants immediate therapeutic anticoagulation. Repeat duplex in 1 week to confirm the thrombus is stabilizing (not propagating to full CFV occlusion). Class 4 (complete CFV occlusion = proximal DVT) requires urgent vascular surgery involvement. Duration of anticoagulation typically 3 months.'},
  {id:92,cat:'Complications',type:'mc',q:'Allergic reaction to sodium tetradecyl sulfate (STS) or polidocanol sclerotherapy is characterized by:',opts:['It never occurs — sclerosants are non-allergenic','Urticaria, angioedema, bronchospasm, or anaphylaxis in rare cases. Polidocanol has a lower allergic profile than STS but reactions can still occur. Emergency equipment must be available.','Only localized skin reactions at the injection site','Exclusively long-term hyperpigmentation'],ans:1,exp:'True allergic reactions (IgE-mediated) to sclerosants are rare but can be severe (anaphylaxis). Polidocanol has a lower allergenicity than STS. Allergy history should be elicited; test doses are sometimes used. Epinephrine and resuscitative equipment should be available in the office.'},
  {id:93,cat:'Complications',type:'ft',q:'Describe the EHIT classification system (Class 1–4) and the management protocol for each class after endovenous ablation.',modelAns:'EHIT Classification: Class 1 = thrombus at the SFJ level, flush with the CFV but NOT extending into it. Management: conservative — serial duplex in 1 week, consider low-dose anticoagulation if risk factors. Class 2 = thrombus extends into CFV, < 50% occlusion. Management: therapeutic anticoagulation (DOAC x 4–6 weeks), repeat duplex in 1–2 weeks. Class 3 = thrombus in CFV > 50% occlusion. Management: therapeutic anticoagulation, urgent repeat duplex in 1 week, vascular surgery consultation. Class 4 = complete CFV occlusion (= proximal DVT). Management: urgent vascular surgery consultation, therapeutic anticoagulation, possible intervention. EHIT is assessed on 48–72 hour post-procedure duplex.'},
  {id:94,cat:'Complications',type:'mc',q:'Which factor most significantly reduces the risk of DVT after endovenous ablation?',opts:['Prescribing aspirin for 2 weeks post-procedure','Taking complete bed rest for 72 hours','Early and sustained ambulation beginning same day/day-after procedure, combined with compression stockings','Using higher energy settings during RFA'],ans:2,exp:'Ambulation is the single most important DVT prevention strategy after venous ablation. Walking promotes calf muscle pump activation, reduces venous stasis, and significantly lowers post-procedure DVT risk. This is a critical patient instruction.'},
  {id:95,cat:'Complications',type:'mc',q:'Deep vein thrombosis (DVT) after superficial vein treatment is most likely to originate from which mechanism?',opts:['Thrombus propagating from the treated superficial vein through perforators or the SFJ/SPJ into the deep system (EHIT → true DVT)','Arterial embolism','Anaphylactic reaction causing venous stasis','Post-operative infection spreading to the deep system'],ans:0,exp:'The most common mechanism for post-ablation DVT is EHIT that propagates — thrombus from the treated GSV/SSV extends through the SFJ/SPJ into the CFV/popliteal vein. This is why the 48–72 hr post-procedure duplex specifically assesses the junction for EHIT and early DVT.'},
  {id:96,cat:'Complications',type:'mc',q:'Recurrence of varicose veins after adequate GSV treatment is most commonly due to:',opts:['Failure of the compression stocking post-procedure','Neovascularization at the SFJ, incompetent AASV or thigh tributaries, incompetent perforators, or development of new superficial reflux in previously normal segments','The procedure was never effective','Always due to physician error during the procedure'],ans:1,exp:'Recurrent varicose veins have multiple etiologies: neovascularization at the prior ligation/ablation site (especially after prior surgery), untreated AASV or thigh accessory veins, perforator incompetence, and new disease in previously unaffected segments. Thorough repeat duplex mapping is essential before any re-treatment.'},
  {id:97,cat:'Complications',type:'mc',q:'Thermal injury to adjacent skin after GSV ablation is most likely to occur when:',opts:['The vein is treated at depth > 3 cm below the skin','Tumescent anesthesia is inadequate or the vein is very superficial (< 1–2 cm from the skin surface)','Energy settings are too low','The patient is very muscular'],ans:1,exp:'Superficial veins (< 1–2 cm from skin) and inadequate tumescent anesthesia are the primary risk factors for thermal skin injury. The fluid "jacket" created by tumescent insulates adjacent structures. Additional tumescent or repositioning is required when veins are superficial.'},
  {id:98,cat:'Complications',type:'mc',q:'Post-ablation bruising and ecchymosis are caused by:',opts:['DVT formation in deep veins','Hematoma from the tumescent anesthesia access points and tissue response to heat — this is expected and patients should be counseled pre-procedure','Allergic reaction to the catheter material','Compression stocking-related skin breakdown'],ans:1,exp:'Bruising after thermal ablation is expected and results from tumescent needle access points, perivenous tissue trauma from heat delivery, and the phlebitic response. Patients should be counseled pre-procedure that bruising is normal, may extend along the entire treated area, and resolves in 2–4 weeks.'},
  {id:99,cat:'Complications',type:'ft',q:'A patient develops signs of possible PE (sudden shortness of breath, pleuritic chest pain) 5 days after bilateral varicose vein treatment. Describe your clinical response.',modelAns:'Treat as a PE until proven otherwise. Immediate steps: (1) Stabilize the patient — if in office, call 911 for EMS transport. If symptoms are mild and stable, urgent ED evaluation. (2) Administer supplemental oxygen if available. (3) While awaiting transfer: obtain brief history, vital signs, O2 sat. (4) ED evaluation: CT pulmonary angiography (gold standard), D-dimer (high sensitivity), ECG, troponin. (5) If PE confirmed: initiate therapeutic anticoagulation (DOAC first-line for hemodynamically stable PE; LMWH bridging to warfarin if needed). Massive PE with hemodynamic instability: thrombolytics or catheter-directed therapy may be needed. (6) Document thoroughly and report as a serious adverse event per office protocol.'},
  {id:100,cat:'Complications',type:'ft',q:'What strategies can reduce the overall complication rate in an office-based vein practice? List at least 5 specific measures.',modelAns:'1. Thorough pre-procedure duplex mapping — identify anatomy, depth, tortuosity, and size before every case. 2. Adequate tumescent anesthesia — ensure proper volume and perivenous distribution before energy delivery to protect adjacent structures. 3. Mandatory post-procedure duplex at 48–72 hours — early detection of EHIT and DVT. 4. Early ambulation protocols — instruct all patients to walk 30 min/day starting day of or day after procedure. 5. Patient selection — identify and exclude or manage contraindications (acute DVT, uncontrolled hypercoagulable state, arterial disease, pregnancy). 6. Informed consent — thorough discussion of risks, signs/symptoms to watch for, and when to seek care. 7. Emergency preparedness — epinephrine, AED, O2 available in office for anaphylaxis or cardiac events. 8. Tracking and quality review — log all complications and review patterns to identify system improvements.'},

  // ── COSMETIC SCLEROTHERAPY (12) ──
  {id:101,cat:'Cosmetic Sclerotherapy',type:'mc',q:'What is the maximum total foam volume per session, including any Varithena performed the same day?',opts:['5 mL','10 mL','15 mL','20 mL'],ans:1,exp:'10 mL is the safety cap for total foam per session regardless of source. This limit applies whether foam comes from cosmetic syringe preparation, compounded Tessari foam, or Varithena.'},
  {id:102,cat:'Cosmetic Sclerotherapy',type:'mc',q:'Which visual cue during liquid sclerotherapy injection indicates you should STOP immediately?',opts:['Blanching','Wheal formation','Mild erythema','Patient reports warmth'],ans:1,exp:'Wheal means the injection is too superficial (intradermal). Stop and reposition. Blanching is the desired response — it means the sclerosant is in the vessel and working correctly.'},
  {id:103,cat:'Cosmetic Sclerotherapy',type:'mc',q:'What is the minimum time before retreating a cosmetic sclerotherapy area?',opts:['2 weeks','4 weeks','8 weeks','12 weeks'],ans:1,exp:'The minimum retreatment interval is 4 weeks. Waiting allows bruising to resolve and gives you an accurate picture of the area before deciding whether to retreat.'},
  {id:104,cat:'Cosmetic Sclerotherapy',type:'mc',q:'A patient develops brown discoloration at a treated vein site 4 weeks after cosmetic sclerotherapy. What is the most likely cause?',opts:['Infection','Allergic reaction','Hemosiderin deposition','Scar tissue'],ans:2,exp:'Post-sclerotherapy hyperpigmentation from hemosiderin (iron pigment from lysed RBCs) is the most common cause of brown discoloration after sclerotherapy. It results from hemosiderin deposition in the skin overlying the treated vein.'},
  {id:105,cat:'Cosmetic Sclerotherapy',type:'mc',q:'Which patients should NOT receive cosmetic sclerotherapy?',opts:['Patients who completed CVI treatment','Asymptomatic patients with spider veins','Patients on tamoxifen','Patients with Fitzpatrick Type II skin'],ans:2,exp:'Tamoxifen increases phlebitis risk — it is a contraindication to cosmetic sclerotherapy. Patients who completed CVI treatment and asymptomatic patients with spider veins are both appropriate candidates.'},
  {id:106,cat:'Cosmetic Sclerotherapy',type:'mc',q:'For a patient with Fitzpatrick Type V skin requesting cosmetic sclerotherapy, what is the most important next step?',opts:['Refuse treatment','Proceed normally','Counsel on higher/longer hyperpigmentation risk and consider test injection','Use foam only'],ans:2,exp:'Types V–VI are high risk for hyperpigmentation — higher likelihood and longer duration. Counsel thoroughly and consider a small test injection above the knee first, bringing the patient back in 8 weeks to assess their individual response before treating larger areas.'},
  {id:107,cat:'Cosmetic Sclerotherapy',type:'mc',q:'What is the final concentration of polidocanol used for cosmetic sclerotherapy?',opts:['0.1%','0.5%','1.0%','5.0%'],ans:1,exp:'Both generic polidocanol 5% and branded Asclera 1% are diluted to a final concentration of 0.5% for cosmetic sclerotherapy. The dilution ratio differs between the two, but the final working concentration is the same.'},
  {id:108,cat:'Cosmetic Sclerotherapy',type:'mc',q:'How long should compression stockings be worn after cosmetic sclerotherapy?',opts:['24 hours only','3 days continuous','5–7 days daytime (~12 hrs/day)','2 weeks continuous'],ans:2,exp:'Daytime compression for 5–7 days (~12 hours/day) is the standard aftercare protocol after cosmetic sclerotherapy. The first 24 hours use a cotton + compression wrap, after which compression stockings are worn during the day only.'},
  {id:109,cat:'Cosmetic Sclerotherapy',type:'ft',q:'A patient at her 4-week follow-up complains of a "pinching" sensation in one of her treated areas. On exam you notice a firm, tender cord. What is this finding and how do you manage it?',modelAns:'This is trapped blood (coagulated blood in a treated vein segment). It is a common finding at 3–5 weeks post-treatment. Management: if symptomatic, use a 30G needle to gently puncture the site and express the dark trapped blood, followed by light compression. May also recommend warm compresses and Arnicare cream. If mild and asymptomatic, it may resolve on its own with warm compresses. Do not retreat the area until fully resolved.'},
  {id:110,cat:'Cosmetic Sclerotherapy',type:'ft',q:'Explain the foam vs. liquid decision framework for cosmetic sclerotherapy — when do you choose each?',modelAns:'Foam is preferred for larger vein clusters and reticular vein networks where broader coverage is needed — foam disperses through the vessel and can treat larger areas per injection. Liquid is preferred for fine spider veins (telangiectasias). Foam carries a higher risk of hyperpigmentation and matting. When using foam, stay within the 10 mL total session cap (including any Varithena performed the same day). Liquid volume is limited to 0.5 mL per injection site. A typical VTC session uses both: 2 foam syringes (0.7 mL each) and 2 liquid syringes (3 mL each).'},
  {id:111,cat:'Cosmetic Sclerotherapy',type:'mc',q:'Visible results from cosmetic sclerotherapy are typically seen at:',opts:['1–2 weeks','4–8 weeks','3 months','6 months'],ans:1,exp:'Visible improvement typically occurs at 4–8 weeks post-treatment, with full results possible up to 6 months. Patients should be counseled not to judge results too early — assessing at 2 weeks does not reflect the final outcome.'},
  {id:112,cat:'Cosmetic Sclerotherapy',type:'ft',q:'How do you counsel a patient who wants complete clearance of her spider veins in one session?',modelAns:'Set clear expectations: cosmetic sclerotherapy typically produces 20–60% improvement per session, not complete clearance. Multiple sessions are usually needed. New veins can appear over time due to ongoing venous disease or genetics. Improvement is gradual — visible results at 4–8 weeks, full results up to 6 months. Complete clearance cannot be guaranteed even with optimal technique. If underlying reflux is present and untreated, spider veins are more likely to recur sooner. Emphasize that this is a process, not a one-time fix, and that high-quality pre-treatment photos will help track progress.'},
];

function QuestionBankTab() {
  const LS_KEY = 'vip_qbank_v2';
  const load = () => { try { return JSON.parse(localStorage.getItem(LS_KEY)||'{}'); } catch(e){ return {}; } };
  const save = (d) => { try { localStorage.setItem(LS_KEY, JSON.stringify(d)); } catch(e){} };

  const initState = load();
  const [userName, setUserName] = React.useState(initState.userName||'');
  const [nameInput, setNameInput] = React.useState('');
  const [category, setCategory] = React.useState(initState.category||'All');
  const [qIndex, setQIndex] = React.useState(0);
  const [answers, setAnswers] = React.useState(initState.answers||{});
  const [qNotes, setQNotes] = React.useState(initState.qNotes||{});
  const [quizStarted, setQuizStarted] = React.useState(initState.quizStarted||false);
  const [quizDone, setQuizDone] = React.useState(false);
  const [selectedOpt, setSelectedOpt] = React.useState(null);
  const [submitted, setSubmitted] = React.useState(false);
  const [freeText, setFreeText] = React.useState('');
  const [grading, setGrading] = React.useState(false);
  const [gradeResult, setGradeResult] = React.useState(null);

  const CATS = ['All','Anatomy','Duplex Technique','Clinical Decision Making','Patient Communication','Complications'];
  const filteredQs = category === 'All' ? QUIZ_QUESTIONS : QUIZ_QUESTIONS.filter(q=>q.cat===category);

  React.useEffect(() => {
    save({ userName, category, answers, qNotes, quizStarted, qIndex });
  }, [userName, category, answers, quizStarted, qIndex]);

  const startQuiz = () => {
    if (!nameInput.trim()) return;
    setUserName(nameInput.trim());
    setQuizStarted(true);
    const savedIdx = initState.category === category ? (initState.qIndex||0) : 0;
    setQIndex(savedIdx < filteredQs.length ? savedIdx : 0);
  };

  const currentQ = filteredQs[qIndex];

  const handleMCSubmit = () => {
    if (selectedOpt === null) return;
    setSubmitted(true);
    const correct = selectedOpt === currentQ.ans;
    setAnswers(prev => ({ ...prev, [currentQ.id]: { type:'mc', correct, selected: selectedOpt } }));
  };

  const handleFreeSubmit = async () => {
    if (!freeText.trim()) return;
    setGrading(true);
    setGradeResult(null);
    try {
      const r = await fetch('api/grade', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ question: currentQ.q, modelAnswer: currentQ.modelAns, userAnswer: freeText, category: currentQ.cat })
      });
      const d = await r.json();
      setGradeResult(d);
      setAnswers(prev => ({ ...prev, [currentQ.id]: { type:'ft', score: d.score, feedback: d.feedback, answer: freeText } }));
    } catch(e) {
      setGradeResult({ score: 0, feedback: 'Grading service unavailable. See model answer below.' });
    }
    setGrading(false);
    setSubmitted(true);
  };

  const nextQ = () => {
    if (qIndex + 1 >= filteredQs.length) { setQuizDone(true); return; }
    setQIndex(prev => prev + 1);
    setSelectedOpt(null);
    setSubmitted(false);
    setFreeText('');
    setGradeResult(null);
  };

  const saveExit = () => {
    save({ userName, category, answers, qNotes, quizStarted, qIndex });
    setQuizStarted(false);
  };

  const resetQuiz = (newCat) => {
    const cat = newCat || category;
    setCategory(cat);
    setQIndex(0);
    setAnswers({});
    setQuizDone(false);
    setSelectedOpt(null);
    setSubmitted(false);
    setFreeText('');
    setGradeResult(null);
    setQuizStarted(true);
    save({ userName, category: cat, answers: {}, quizStarted: true, qIndex: 0 });
  };

  // Score calculation
  const calcScores = () => {
    const overall = { total:0, correct:0, scored:0, scoreSum:0 };
    const byCat = {};
    CATS.slice(1).forEach(c => { byCat[c] = { total:0, correct:0, scored:0, scoreSum:0 }; });
    filteredQs.forEach(q => {
      const a = answers[q.id];
      overall.total++;
      byCat[q.cat] && byCat[q.cat].total++;
      if (!a) return;
      if (a.type === 'mc') {
        overall.correct += a.correct ? 1 : 0;
        overall.scored++;
        overall.scoreSum += a.correct ? 100 : 0;
        if (byCat[q.cat]) { byCat[q.cat].correct += a.correct ? 1 : 0; byCat[q.cat].scored++; byCat[q.cat].scoreSum += a.correct ? 100 : 0; }
      } else {
        overall.scored++;
        overall.scoreSum += (a.score||0);
        if (byCat[q.cat]) { byCat[q.cat].scored++; byCat[q.cat].scoreSum += (a.score||0); }
      }
    });
    overall.avg = overall.scored > 0 ? Math.round(overall.scoreSum / overall.scored) : 0;
    CATS.slice(1).forEach(c => {
      if (byCat[c]) byCat[c].avg = byCat[c].scored > 0 ? Math.round(byCat[c].scoreSum / byCat[c].scored) : 0;
    });
    return { overall, byCat };
  };

  const scoreColor = (n) => n >= 80 ? '#16a34a' : n >= 60 ? '#d97706' : '#dc2626';

  // ── NAME ENTRY ──
  if (!userName) return (
    <div style={{maxWidth:480,margin:'60px auto',padding:'0 20px'}}>
      <div style={{background:'white',borderRadius:20,padding:40,boxShadow:'0 4px 24px rgba(0,0,0,0.10)',textAlign:'center'}}>
        <div style={{fontSize:48,marginBottom:12}}>📝</div>
        <div style={{fontSize:22,fontWeight:900,color:'#2d1b69',marginBottom:8}}>Question Bank</div>
        <div style={{fontSize:14,color:'#64748b',marginBottom:28,lineHeight:1.6}}>100 clinically rigorous questions across 5 categories. Your progress is saved automatically.</div>
        <input value={nameInput} onChange={e=>setNameInput(e.target.value)}
          onKeyDown={e=>e.key==='Enter'&&startQuiz()}
          placeholder="Enter your name to begin"
          style={{width:'100%',padding:'12px 16px',borderRadius:10,border:'2px solid #e2e8f0',fontFamily:'DM Sans',fontSize:15,fontWeight:600,outline:'none',marginBottom:16,textAlign:'center'}}
        />
        <button onClick={startQuiz} style={{width:'100%',background:'linear-gradient(135deg,#2d1b69,#6C3CB5)',color:'white',border:'none',borderRadius:10,padding:'13px',fontFamily:'DM Sans',fontWeight:900,fontSize:15,cursor:'pointer'}}>
          Start Question Bank →
        </button>
      </div>
    </div>
  );

  // ── CATEGORY SELECT / HOME ──
  if (!quizStarted) {
    const { overall, byCat } = calcScores();
    return (
      <div style={{maxWidth:680,margin:'0 auto',padding:'32px 20px'}}>
        <div style={{display:'flex',alignItems:'center',gap:12,marginBottom:24}}>
          <div style={{fontSize:32}}>📝</div>
          <div>
            <div style={{fontSize:20,fontWeight:900,color:'#2d1b69'}}>Question Bank</div>
            <div style={{fontSize:13,color:'#64748b'}}>Welcome back, {userName}!</div>
          </div>
          <button onClick={()=>{ setUserName(''); save({}); }} style={{marginLeft:'auto',background:'none',border:'1px solid #e2e8f0',borderRadius:8,padding:'6px 12px',fontFamily:'DM Sans',fontSize:12,fontWeight:700,color:'#64748b',cursor:'pointer'}}>Change Name</button>
        </div>

        {overall.scored > 0 && (
          <div style={{background:'white',borderRadius:16,padding:20,marginBottom:20,boxShadow:'0 1px 8px rgba(0,0,0,0.06)'}}>
            <div style={{fontSize:14,fontWeight:900,color:'#1e293b',marginBottom:14}}>📊 Your Progress</div>
            <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12,marginBottom:16}}>
              <div style={{background:'#f8fafc',borderRadius:12,padding:'14px 16px',textAlign:'center'}}>
                <div style={{fontSize:28,fontWeight:900,color:scoreColor(overall.avg)}}>{overall.avg}%</div>
                <div style={{fontSize:12,color:'#64748b',fontWeight:700}}>Overall Score</div>
              </div>
              <div style={{background:'#f8fafc',borderRadius:12,padding:'14px 16px',textAlign:'center'}}>
                <div style={{fontSize:28,fontWeight:900,color:'#2d1b69'}}>{overall.scored}/{overall.total}</div>
                <div style={{fontSize:12,color:'#64748b',fontWeight:700}}>Questions Answered</div>
              </div>
            </div>
            {CATS.slice(1).map(c => byCat[c] && byCat[c].scored > 0 && (
              <div key={c} style={{display:'flex',alignItems:'center',gap:10,marginBottom:8}}>
                <div style={{fontSize:12,fontWeight:700,color:'#475569',width:160,flexShrink:0}}>{c}</div>
                <div style={{flex:1,background:'#e2e8f0',borderRadius:20,height:8,overflow:'hidden'}}>
                  <div style={{width:`${byCat[c].avg}%`,height:'100%',background:scoreColor(byCat[c].avg),borderRadius:20,transition:'width 0.5s'}}/>
                </div>
                <div style={{fontSize:12,fontWeight:900,color:scoreColor(byCat[c].avg),width:36,textAlign:'right'}}>{byCat[c].avg}%</div>
              </div>
            ))}
          </div>
        )}

        <div style={{background:'white',borderRadius:16,padding:20,boxShadow:'0 1px 8px rgba(0,0,0,0.06)'}}>
          <div style={{fontSize:14,fontWeight:900,color:'#1e293b',marginBottom:14}}>Choose a Category</div>
          {CATS.map(c => {
            const count = c === 'All' ? QUIZ_QUESTIONS.length : QUIZ_QUESTIONS.filter(q=>q.cat===c).length;
            const savedForCat = Object.keys(answers).filter(id => {
              const q = QUIZ_QUESTIONS.find(qq=>qq.id===parseInt(id));
              return c === 'All' ? true : (q && q.cat === c);
            }).length;
            return (
              <div key={c} onClick={()=>resetQuiz(c)}
                style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'14px 16px',borderRadius:12,border:'2px solid #e2e8f0',marginBottom:8,cursor:'pointer',transition:'all 0.15s',background:category===c?'#f5f3ff':'white'}}
                onMouseEnter={e=>e.currentTarget.style.borderColor='#6C3CB5'}
                onMouseLeave={e=>e.currentTarget.style.borderColor=category===c?'#6C3CB5':'#e2e8f0'}
              >
                <div>
                  <div style={{fontWeight:800,fontSize:14,color:'#1e293b'}}>{c === 'All' ? '🎯 All Categories' : c}</div>
                  <div style={{fontSize:12,color:'#94a3b8'}}>{count} questions · {savedForCat} answered</div>
                </div>
                <div style={{background:'linear-gradient(135deg,#2d1b69,#6C3CB5)',color:'white',borderRadius:8,padding:'6px 14px',fontWeight:800,fontSize:12}}>
                  {savedForCat > 0 ? 'Retake' : 'Start'} →
                </div>
              </div>
            );
          })}
        </div>
      </div>
    );
  }

  // ── QUIZ DONE ──
  if (quizDone) {
    const { overall, byCat } = calcScores();
    return (
      <div style={{maxWidth:640,margin:'0 auto',padding:'32px 20px'}}>
        <div style={{background:'white',borderRadius:20,padding:32,boxShadow:'0 4px 24px rgba(0,0,0,0.08)',textAlign:'center',marginBottom:20}}>
          <div style={{fontSize:52,marginBottom:8}}>{overall.avg >= 80 ? '🏆' : overall.avg >= 60 ? '👍' : '📚'}</div>
          <div style={{fontSize:24,fontWeight:900,color:'#2d1b69',marginBottom:4}}>Quiz Complete!</div>
          <div style={{fontSize:14,color:'#64748b',marginBottom:20}}>Great work, {userName}!</div>
          <div style={{fontSize:52,fontWeight:900,color:scoreColor(overall.avg)}}>{overall.avg}%</div>
          <div style={{fontSize:14,color:'#64748b',marginBottom:24}}>Overall Score · {overall.scored} questions answered</div>
          <div style={{display:'flex',gap:12,justifyContent:'center',flexWrap:'wrap'}}>
            <button onClick={()=>resetQuiz(category)} style={{background:'linear-gradient(135deg,#2d1b69,#6C3CB5)',color:'white',border:'none',borderRadius:10,padding:'12px 24px',fontFamily:'DM Sans',fontWeight:900,fontSize:14,cursor:'pointer'}}>
              Retake Quiz
            </button>
            <button onClick={()=>{ setQuizDone(false); setQuizStarted(false); }} style={{background:'white',color:'#2d1b69',border:'2px solid #2d1b69',borderRadius:10,padding:'12px 24px',fontFamily:'DM Sans',fontWeight:900,fontSize:14,cursor:'pointer'}}>
              Choose Category
            </button>
          </div>
        </div>
        <div style={{background:'white',borderRadius:16,padding:24,boxShadow:'0 1px 8px rgba(0,0,0,0.06)'}}>
          <div style={{fontSize:15,fontWeight:900,color:'#1e293b',marginBottom:16}}>Score by Category</div>
          {CATS.slice(1).map(c => {
            const data = byCat[c];
            if (!data || data.total === 0) return null;
            return (
              <div key={c} style={{marginBottom:14}}>
                <div style={{display:'flex',justifyContent:'space-between',marginBottom:6}}>
                  <span style={{fontSize:13,fontWeight:800,color:'#475569'}}>{c}</span>
                  <span style={{fontSize:13,fontWeight:900,color:scoreColor(data.avg)}}>{data.avg}% ({data.scored}/{data.total})</span>
                </div>
                <div style={{background:'#e2e8f0',borderRadius:20,height:10,overflow:'hidden'}}>
                  <div style={{width:`${data.avg}%`,height:'100%',background:scoreColor(data.avg),borderRadius:20,transition:'width 0.7s'}}/>
                </div>
              </div>
            );
          })}
        </div>
      </div>
    );
  }

  // ── ACTIVE QUIZ ──
  if (!currentQ) return <div style={{padding:32,textAlign:'center',color:'#64748b'}}>No questions found for this category.</div>;

  const prevAnswer = answers[currentQ.id];
  const progress = Math.round(((qIndex) / filteredQs.length) * 100);
  const catColors = { 'Anatomy':'#6C3CB5', 'Duplex Technique':'#1078B9', 'Clinical Decision Making':'#059669', 'Patient Communication':'#d97706', 'Complications':'#dc2626' };

  return (
    <div style={{maxWidth:720,margin:'0 auto',padding:'24px 20px'}}>
      {/* Header */}
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:16}}>
        <div style={{fontSize:13,fontWeight:800,color:'#64748b'}}>{userName} · {category}</div>
        <button onClick={saveExit} style={{background:'none',border:'1px solid #e2e8f0',borderRadius:8,padding:'6px 12px',fontFamily:'DM Sans',fontSize:12,fontWeight:800,color:'#64748b',cursor:'pointer'}}>
          💾 Save & Exit
        </button>
      </div>
      {/* Progress bar */}
      <div style={{background:'#e2e8f0',borderRadius:20,height:8,marginBottom:8,overflow:'hidden'}}>
        <div style={{width:`${progress}%`,height:'100%',background:'linear-gradient(90deg,#6C3CB5,#AC4ABD)',borderRadius:20,transition:'width 0.4s'}}/>
      </div>
      <div style={{fontSize:12,color:'#94a3b8',fontWeight:700,marginBottom:20,textAlign:'right'}}>
        Question {qIndex+1} of {filteredQs.length}
      </div>

      {/* Question card */}
      <div style={{background:'white',borderRadius:20,padding:28,boxShadow:'0 2px 16px rgba(0,0,0,0.08)'}}>
        <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:14}}>
          <span style={{background:catColors[currentQ.cat]||'#6C3CB5',color:'white',fontSize:11,fontWeight:900,padding:'3px 10px',borderRadius:20}}>{currentQ.cat}</span>
          <span style={{background:'#f1f5f9',color:'#64748b',fontSize:11,fontWeight:800,padding:'3px 10px',borderRadius:20}}>{currentQ.type === 'mc' ? 'Multiple Choice' : 'Free Response'}</span>
          {prevAnswer && <span style={{background:'#dcfce7',color:'#16a34a',fontSize:11,fontWeight:800,padding:'3px 10px',borderRadius:20}}>✓ Answered</span>}
        </div>
        <div style={{fontSize:16,fontWeight:700,color:'#1e293b',lineHeight:1.6,marginBottom:22}}>{currentQ.q}</div>

        {/* Multiple choice */}
        {currentQ.type === 'mc' && (
          <div>
            {currentQ.opts.map((opt, i) => {
              let bg = '#f8fafc', border = '#e2e8f0', color = '#374151';
              if (submitted || prevAnswer) {
                if (i === currentQ.ans) { bg = '#f0fdf4'; border = '#16a34a'; color = '#15803d'; }
                else if (i === (submitted ? selectedOpt : prevAnswer.selected) && i !== currentQ.ans) { bg = '#fef2f2'; border = '#dc2626'; color = '#dc2626'; }
              } else if (selectedOpt === i) { bg = '#f5f3ff'; border = '#6C3CB5'; color = '#2d1b69'; }
              return (
                <div key={i} onClick={()=>{ if (!submitted && !prevAnswer) setSelectedOpt(i); }}
                  style={{background:bg,border:`2px solid ${border}`,color,borderRadius:12,padding:'12px 16px',marginBottom:8,cursor:submitted||prevAnswer?'default':'pointer',fontWeight:600,fontSize:14,transition:'all 0.15s',lineHeight:1.4}}>
                  <span style={{fontWeight:900,marginRight:8}}>{String.fromCharCode(65+i)}.</span>{opt}
                  {(submitted || prevAnswer) && i === currentQ.ans && <span style={{float:'right',fontWeight:900}}>✓</span>}
                  {(submitted || prevAnswer) && i === (submitted ? selectedOpt : prevAnswer?.selected) && i !== currentQ.ans && <span style={{float:'right',fontWeight:900}}>✗</span>}
                </div>
              );
            })}
            {!submitted && !prevAnswer && (
              <button onClick={handleMCSubmit} disabled={selectedOpt===null}
                style={{width:'100%',background:selectedOpt===null?'#e2e8f0':'linear-gradient(135deg,#2d1b69,#6C3CB5)',color:selectedOpt===null?'#94a3b8':'white',border:'none',borderRadius:10,padding:'12px',fontFamily:'DM Sans',fontWeight:900,fontSize:14,cursor:selectedOpt===null?'not-allowed':'pointer',marginTop:8}}>
                Submit Answer
              </button>
            )}
            {(submitted || prevAnswer) && (
              <div style={{background:'#f8fafc',borderRadius:12,padding:'14px 16px',marginTop:12,border:'1px solid #e2e8f0'}}>
                <div style={{fontSize:12,fontWeight:900,color:'#6C3CB5',marginBottom:6,textTransform:'uppercase',letterSpacing:'0.05em'}}>Explanation</div>
                <div style={{fontSize:13,color:'#374151',lineHeight:1.6}}>{currentQ.exp}</div>
              </div>
            )}
          </div>
        )}

        {/* Free text */}
        {currentQ.type === 'ft' && (
          <div>
            {!submitted && !prevAnswer ? (
              <div>
                <textarea value={freeText} onChange={e=>setFreeText(e.target.value)}
                  placeholder="Type your answer here..."
                  style={{width:'100%',minHeight:120,padding:'12px 16px',borderRadius:12,border:'2px solid #e2e8f0',fontFamily:'DM Sans',fontSize:14,fontWeight:500,resize:'vertical',outline:'none',lineHeight:1.6}}
                />
                <button onClick={handleFreeSubmit} disabled={grading||!freeText.trim()}
                  style={{width:'100%',background:(!freeText.trim())||grading?'#e2e8f0':'linear-gradient(135deg,#2d1b69,#6C3CB5)',color:(!freeText.trim())||grading?'#94a3b8':'white',border:'none',borderRadius:10,padding:'12px',fontFamily:'DM Sans',fontWeight:900,fontSize:14,cursor:(!freeText.trim())||grading?'not-allowed':'pointer',marginTop:10}}>
                  {grading ? '⏳ Grading with AI...' : '🤖 Submit for AI Grading'}
                </button>
              </div>
            ) : (
              <div>
                {(gradeResult || prevAnswer) && (
                  <div style={{marginBottom:14}}>
                    <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:10}}>
                      <div style={{fontSize:28,fontWeight:900,color:scoreColor((gradeResult||prevAnswer).score)}}>{(gradeResult||prevAnswer).score}%</div>
                      <div style={{background:'#f8fafc',borderRadius:10,padding:'8px 14px',flex:1}}>
                        <div style={{fontSize:12,fontWeight:900,color:'#6C3CB5',marginBottom:4}}>AI FEEDBACK</div>
                        <div style={{fontSize:13,color:'#374151',lineHeight:1.5}}>{(gradeResult||prevAnswer).feedback}</div>
                      </div>
                    </div>
                  </div>
                )}
                <div style={{background:'#f0fdf4',borderRadius:12,padding:'14px 16px',border:'1px solid #bbf7d0'}}>
                  <div style={{fontSize:12,fontWeight:900,color:'#16a34a',marginBottom:6,textTransform:'uppercase',letterSpacing:'0.05em'}}>Model Answer</div>
                  <div style={{fontSize:13,color:'#374151',lineHeight:1.6}}>{currentQ.modelAns}</div>
                </div>
              </div>
            )}
          </div>
        )}
      </div>

      {/* Per-question notes */}
      <div style={{marginTop:16,background:'#fffbeb',border:'1px solid #fde68a',borderRadius:12,padding:'12px 14px'}}>
        <div style={{fontSize:12,fontWeight:800,color:'#92400e',marginBottom:6}}>📝 Review Note <span style={{fontWeight:400,color:'#b45309'}}>(flag this question for Friday)</span></div>
        <textarea
          value={qNotes[currentQ.id]||''}
          onChange={e=>setQNotes(prev=>({...prev,[currentQ.id]:e.target.value}))}
          placeholder="e.g. 'Change wording', 'Answer is wrong', 'Add more detail to explanation'..."
          rows={2}
          style={{width:'100%',padding:'8px 10px',border:'1px solid #fcd34d',borderRadius:8,fontFamily:'DM Sans',fontSize:13,outline:'none',resize:'vertical',background:'white',boxSizing:'border-box'}}
        />
      </div>

      {/* Navigation */}
      {(submitted || prevAnswer || (currentQ.type==='ft' && (gradeResult || prevAnswer))) && (
        <div style={{display:'flex',justifyContent:'space-between',marginTop:16,gap:12}}>
          {qIndex > 0 && (
            <button onClick={()=>{ setQIndex(prev=>prev-1); setSelectedOpt(null); setSubmitted(false); setFreeText(''); setGradeResult(null); }}
              style={{background:'white',color:'#2d1b69',border:'2px solid #2d1b69',borderRadius:10,padding:'10px 20px',fontFamily:'DM Sans',fontWeight:900,fontSize:14,cursor:'pointer'}}>
              ← Previous
            </button>
          )}
          <button onClick={nextQ}
            style={{marginLeft:'auto',background:'linear-gradient(135deg,#2d1b69,#6C3CB5)',color:'white',border:'none',borderRadius:10,padding:'10px 24px',fontFamily:'DM Sans',fontWeight:900,fontSize:14,cursor:'pointer'}}>
            {qIndex + 1 >= filteredQs.length ? 'Finish Quiz 🏆' : 'Next Question →'}
          </button>
        </div>
      )}
    </div>
  );
}

// ── APP ───────────────────────────────────────────────────────────────────────
function App() {
  // Read initial state from URL hash e.g. #clinical/p2p or #admin/faq
  const parseHash = () => {
    const h = window.location.hash.replace('#','').split('/');
    return { mode: h[0]||'home', sub: h[1]||null };
  };
  const initHash = parseHash();
  const [mode, setMode] = useState(['intro','quiz'].includes(initHash.mode) ? initHash.mode : initHash.mode);
  const [clinicalTab, setClinicalTab] = useState(initHash.mode==='clinical' && initHash.sub ? initHash.sub : 'clinical');
  const [adminTab, setAdminTab] = useState(initHash.mode==='admin' && initHash.sub ? initHash.sub : 'start');
  const [globalSearch, setGlobalSearch] = useState('');

  // Keep hash in sync with state
  React.useEffect(() => {
    if (mode === 'home') { window.location.hash = ''; return; }
    if (mode === 'quiz') { window.location.hash = 'quiz'; return; }
    const sub = mode === 'clinical' ? clinicalTab : adminTab;
    window.location.hash = `${mode}/${sub}`;
  }, [mode, clinicalTab, adminTab]);

  const goMode = (m) => {
    setMode(m);
    window.scrollTo(0,0);
  };

  const handleSearch = (e) => {
    e.preventDefault();
    if (globalSearch.trim()) { setMode('search'); }
  };

  const activeTab = mode === 'clinical' ? clinicalTab : adminTab;

  return (
    <div>
      <LastUpdated section="p2p" />
      {/* Navbar */}
      <nav className="navbar">
        <div className="navbar-brand">
          <div className="navbar-logo">VIP <span>Provider Training Hub</span></div>
          <div className="navbar-sub">VIP Medical Group · Onboarding & Clinical Resources</div>
        </div>
        <form onSubmit={handleSearch} style={{display:'flex',alignItems:'center',background:'rgba(255,255,255,0.12)',borderRadius:50,padding:'5px 6px 5px 16px',gap:6,border:'1px solid rgba(255,255,255,0.2)',backdropFilter:'blur(6px)'}}>
          <input
            value={globalSearch}
            onChange={e=>setGlobalSearch(e.target.value)}
            placeholder="Search FAQs, tools, protocols..."
            style={{background:'transparent',border:'none',outline:'none',color:'white',fontFamily:'DM Sans',fontSize:13,fontWeight:600,width:220}}
          />
          <button type="submit" style={{background:'white',color:'#1078B9',border:'none',borderRadius:50,padding:'6px 14px',fontFamily:'DM Sans',fontWeight:800,fontSize:12,cursor:'pointer',whiteSpace:'nowrap'}}>
            Search
          </button>
        </form>
        <a href="https://sites.google.com/vipmedicalgroup.com/vip-intranet/home" target="_blank" rel="noreferrer"
          style={{display:'flex',alignItems:'center',gap:6,background:'rgba(255,255,255,0.12)',border:'1px solid rgba(255,255,255,0.2)',borderRadius:10,padding:'7px 14px',color:'white',textDecoration:'none',fontFamily:'DM Sans',fontWeight:800,fontSize:12,whiteSpace:'nowrap',flexShrink:0}}>
          🏢 Company Hub
        </a>
      </nav>

      {/* Mode toggle bar */}
      <div className="mode-bar">
        <button className={`mode-home${mode==='home'?' active':''}`} onClick={()=>goMode('home')}>
          🏠 Home
        </button>
        <div className="mode-divider"/>
        <div className="mode-toggle">
          <button
            className={`mode-btn mode-btn-clinical${mode==='clinical'?' active':''}`}
            onClick={()=>goMode('clinical')}
          >
            🩺 Clinical
          </button>
          <button
            className={`mode-btn mode-btn-admin${mode==='admin'?' active':''}`}
            onClick={()=>goMode('admin')}
          >
            ⚙️ Systems
          </button>
        </div>
        <div className="mode-divider"/>
        <button className={`mode-home${(mode==='training'||mode==='intro'||mode==='selfguided')?' active':''}`} onClick={()=>goMode('training')}>
          🎓 Training Modules
        </button>
        <div className="mode-divider"/>
        <button className={`mode-home${mode==='prepost'?' active':''}`} onClick={()=>goMode('prepost')}>
          📝 Pre/Post Test
        </button>
        <div className="mode-divider"/>
        <button className={`mode-home${mode==='quiz'?' active':''}`} onClick={()=>goMode('quiz')}>
          🧠 Question Bank
        </button>
      </div>

      {/* Sub-tab bar — only when not on home */}
      {mode === 'clinical' && (
        <div className="sub-bar sub-bar-clinical">
          {CLINICAL_TABS.map(t=>(
            <button key={t.id}
              className={`tab${clinicalTab===t.id?' active active-clinical':''}`}
              onClick={()=>setClinicalTab(t.id)}
            >{t.label}</button>
          ))}
        </div>
      )}
      {mode === 'admin' && (
        <div className="sub-bar sub-bar-admin">
          {ADMIN_TABS.map(t=>(
            <button key={t.id}
              className={`tab${adminTab===t.id?' active active-admin':''}`}
              onClick={()=>setAdminTab(t.id)}
