// ── ACUTE VS CHRONIC DVT GAME ─────────────────────────────────────────────────
function AcuteChronicGame() {
  const [gameMode, setGameMode] = React.useState('study');
  const [quizIdx, setQuizIdx] = React.useState(0);
  const [choice, setChoice] = React.useState(null);
  const [score, setScore] = React.useState({c:0,t:0});
  const [showCard, setShowCard] = React.useState(false);

  // SVG ultrasound simulator — draws a fake US cross-section
  // bg = vessel background fill, echoes = array of {cx,cy,r,opacity} bright spots
  // compressed = show compressed oval shape, label = vessel label
  function USSim({type, label, sub}) {
    const W=180, H=160;
    const isAcute = type==='acute';
    const isNormal = type==='normal';

    // Vessel shapes
    const vX=90, vY=85, vRx=isNormal?38:40, vRy=isNormal?36:isAcute?38:30;
    const vFill = isNormal ? '#111' : isAcute ? '#0a0a0a' : '#2a2a2a';
    const wallColor = isNormal ? '#888' : isAcute ? '#666' : '#aaa';
    const wallW = isNormal ? 2 : isAcute ? 2.5 : 3.5;

    // Echoes inside vessel (chronic = bright internal echoes; acute = dark/empty)
    const chronicEchoes = [
      {cx:82,cy:80,r:5,op:0.7},{cx:96,cy:72,r:4,op:0.6},{cx:104,cy:88,r:6,op:0.65},
      {cx:78,cy:96,r:4,op:0.55},{cx:90,cy:100,r:5,op:0.6},{cx:70,cy:82,r:3,op:0.5},
      {cx:108,cy:76,r:4,op:0.6},{cx:86,cy:64,r:3,op:0.45},{cx:100,cy:104,r:4,op:0.5},
    ];

    // Collateral tiny vessel (chronic only)
    const showCollateral = type==='chronic';
    // Compressed shape (show non-compressibility for DVT)
    const showCompress = false;

    return React.createElement('div', {style:{textAlign:'center'}},
      React.createElement('svg', {width:W, height:H, viewBox:`0 0 ${W} ${H}`,
        style:{borderRadius:8, background:'#111', display:'block', margin:'0 auto',
          border:'2px solid #333', boxShadow:'0 2px 8px rgba(0,0,0,0.4)'}},

        // Surrounding tissue texture (faint speckle)
        ...[...Array(30)].map((_,i)=>React.createElement('circle', {
          key:'t'+i, cx:(i*37+13)%W, cy:(i*29+7)%H, r:1.5, fill:'#555', opacity:0.18+((i%5)*0.04)
        })),

        // Vessel wall
        React.createElement('ellipse', {cx:vX,cy:vY,rx:vRx+4,ry:vRy+4,fill:'none',stroke:wallColor,strokeWidth:wallW,opacity:0.8}),

        // Vessel lumen
        React.createElement('ellipse', {cx:vX,cy:vY,rx:vRx,ry:vRy,fill:vFill}),

        // Chronic internal echoes
        type==='chronic' && chronicEchoes.map((e,i)=>React.createElement('circle', {
          key:'e'+i, cx:e.cx, cy:e.cy, r:e.r, fill:'#bbb', opacity:e.op
        })),

        // Chronic: thick irregular wall
        type==='chronic' && React.createElement('ellipse', {cx:vX,cy:vY,rx:vRx,ry:vRy,fill:'none',stroke:'#aaa',strokeWidth:3,strokeDasharray:'6,3',opacity:0.5}),

        // Collateral vessel (chronic)
        showCollateral && React.createElement('ellipse', {cx:130,cy:55,rx:10,ry:8,fill:'#111',stroke:'#888',strokeWidth:1.5,opacity:0.8}),
        showCollateral && React.createElement('text', {x:130,y:42,textAnchor:'middle',fontSize:7,fill:'#aaa',fontWeight:700},'collateral'),

        // Acute: distended dark lumen, no echoes — already handled by dark fill + no echoes

        // Compressed probe indicator (small arrows)
        React.createElement('text', {x:W/2,y:16,textAnchor:'middle',fontSize:9,fill:'#888',fontWeight:700},'⊗  probe'),
      ),
      React.createElement('div', {style:{marginTop:6,fontSize:12,fontWeight:800,color:'#1e293b',textAlign:'center'}},label),
      sub && React.createElement('div', {style:{fontSize:10,color:'#64748b',marginTop:2}},sub)
    );
  }

  const FEATURES = [
    { feature:'Echogenicity', acute:'Anechoic (black) — fresh clot has no internal echoes', chronic:'Echogenic (bright/grey) — organized thrombus reflects sound' },
    { feature:'Lumen', acute:'Distended — vein is enlarged, filled with fresh clot', chronic:'Contracted — vein wall thickens, lumen shrinks over time' },
    { feature:'Compressibility', acute:'Non-compressible — hallmark finding; vein does NOT collapse with probe pressure', chronic:'May partially compress — but still abnormal; walls thick and irregular' },
    { feature:'Vein walls', acute:'Smooth, thin walls — vein is acutely distended', chronic:'Thick, irregular, hyperechoic walls — fibrosis and scarring' },
    { feature:'Collaterals', acute:'Usually absent — acute event, no time for collateral development', chronic:'Often present — body has developed bypass vessels around obstruction' },
    { feature:'Color Doppler', acute:'Absent flow in affected segment — lumen filled with clot', chronic:'May show partial flow or recanalization — partial lysis of clot' },
    { feature:'Clinical context', acute:'Acute pain, swelling, warmth, sudden onset', chronic:'Months/years of leg heaviness, skin changes, post-thrombotic syndrome' },
  ];

  const SCENARIOS = [
    { label:'Patient presents with 3 days of sudden left leg swelling and calf pain after a long flight. Duplex shows a dark, distended popliteal vein that does not compress.', answer:'acute', exp:'Classic acute DVT: sudden onset, anechoic (dark) lumen, distended vein, NON-compressible. The key hallmark is non-compressibility.' },
    { label:'Duplex shows a popliteal vein with bright internal echoes, thick irregular walls, and a small collateral vessel nearby. The vein partially compresses with probe pressure.', answer:'chronic', exp:'Chronic DVT: echogenic clot, thickened fibrotic walls, collateral formation, and partial compressibility all point to organized/chronic thrombus.' },
    { label:'A patient with a history of DVT 2 years ago has persistent leg edema and skin discoloration. US shows a contracted femoral vein with echogenic material inside and recanalization on color Doppler.', answer:'chronic', exp:'Post-thrombotic syndrome with chronic DVT changes: contracted lumen, echogenic thrombus, recanalization on Doppler. History of prior DVT supports chronic.' },
    { label:'A 45-year-old post-operative patient has acute leg swelling 5 days after hip replacement. Duplex shows a dark, enlarged femoral vein with absent color Doppler flow and no compressibility.', answer:'acute', exp:'Acute post-surgical DVT: dark/anechoic lumen, distended vein, no Doppler signal in affected segment, non-compressible. All classic acute findings.' },
    { label:'US shows a bright, irregular vein wall with heterogeneous echoes inside the lumen. Color Doppler shows partial flow around a filling defect. Patient has chronic venous insufficiency.', answer:'chronic', exp:'Heterogeneous echoes, partial recanalization, irregular walls, and CVI history = chronic DVT with partial lysis. Partial Doppler flow suggests recanalization.' },
    { label:'A patient reports waking up this morning with a warm, red, swollen calf. Duplex shows a posterior tibial vein that is dark, distended, and incompressible. Walls appear smooth and thin.', answer:'acute', exp:'Acute calf DVT: sudden onset symptoms, anechoic (dark) lumen, distended vein, smooth thin walls, non-compressible. All point to acute/fresh thrombus.' },
    { label:'Duplex shows a femoral vein with thick echogenic walls, a contracted lumen, and multiple small collateral vessels. Probe compression causes minimal lumen change.', answer:'chronic', exp:'Contracted lumen + thick echogenic walls + collaterals = chronic. The scarring and collateral development indicate long-standing obstruction.' },
    { label:'Post-procedure duplex on day 2 after RFA shows a dark, non-compressible common femoral vein with a filling defect on color Doppler extending from the SFJ.', answer:'acute', exp:'This is EHIT Class 4 — an ACUTE thrombus. Fresh post-procedure clot: dark, non-compressible, present color Doppler filling defect. Treat as acute DVT.' },
  ];

  const q = SCENARIOS[quizIdx % SCENARIOS.length];
  const done = quizIdx >= SCENARIOS.length;

  function handleAnswer(ans) {
    if (choice) return;
    setChoice(ans);
    setScore(s=>({c:s.c+(ans===q.answer?1:0),t:s.t+1}));
    setTimeout(()=>{ setChoice(null); setQuizIdx(i=>i+1); }, 2200);
  }
  function restart() { setQuizIdx(0); setScore({c:0,t:0}); setChoice(null); }
  const btnB = {border:'none',cursor:'pointer',fontWeight:800,fontSize:12,borderRadius:9,padding:'7px 14px'};

  return React.createElement('div', {style:{maxWidth:960,margin:'0 auto'}},
    // Header
    React.createElement('div', {style:{background:'linear-gradient(135deg,#2d1b69,#0369a1)',borderRadius:16,padding:'20px 24px',marginBottom:20,color:'white',display:'flex',justifyContent:'space-between',alignItems:'center',flexWrap:'wrap',gap:10}},
      React.createElement('div', null,
        React.createElement('div', {style:{fontSize:22,fontWeight:900,marginBottom:4,fontFamily:'Poppins,sans-serif'}}, '🔬 Acute vs Chronic DVT'),
        React.createElement('div', {style:{fontSize:13,opacity:0.85}}, 'Identify DVT age from ultrasound findings and clinical scenarios')
      ),
      React.createElement('button', {onClick:()=>setShowCard(s=>!s),
        style:{background:'rgba(255,255,255,0.2)',color:'white',border:'none',borderRadius:8,padding:'8px 14px',fontWeight:800,fontSize:12,cursor:'pointer'}},
        showCard?'Hide Pocket Card ✕':'📋 DVT Pocket Card')
    ),

    // Pocket card toggle
    showCard && React.createElement('div', {style:{marginBottom:16,borderRadius:12,overflow:'hidden',boxShadow:'0 4px 20px rgba(0,0,0,0.15)'}},
      React.createElement('img', {src:'/dvt-pocket-card.jpg', alt:'DVT Ultrasound Pocket Card', style:{width:'100%',display:'block'}})
    ),

    // Mode toggle
    React.createElement('div', {style:{display:'flex',gap:8,justifyContent:'center',marginBottom:18}},
      [['study','📚 Study'],['quiz','🎮 Quiz']].map(([m,lbl])=>
        React.createElement('button', {key:m, onClick:()=>{setGameMode(m);restart();},
          style:{...btnB, background:gameMode===m?'#0369a1':'#f1f5f9', color:gameMode===m?'white':'#64748b', fontSize:13}}, lbl)
      ),
      gameMode==='quiz' && !done && React.createElement('div', {style:{background:'#0369a1',color:'white',borderRadius:20,padding:'7px 16px',fontWeight:800,fontSize:13}}, `⭐ ${score.c}/${score.t}`)
    ),

    // STUDY MODE
    gameMode==='study' && React.createElement('div', null,
      // US sim comparison
      React.createElement('div', {style:{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:14,marginBottom:20}},
        React.createElement('div', {style:{background:'white',borderRadius:12,padding:'14px',border:'2px solid #e2e8f0',textAlign:'center'}},
          React.createElement(USSim, {type:'normal',label:'Normal Vein',sub:'Dark lumen, compressible'}),
        ),
        React.createElement('div', {style:{background:'#fff1f2',borderRadius:12,padding:'14px',border:'2px solid #fca5a5',textAlign:'center'}},
          React.createElement(USSim, {type:'acute',label:'Acute DVT',sub:'Dark, distended, non-compressible'}),
        ),
        React.createElement('div', {style:{background:'#faf5ff',borderRadius:12,padding:'14px',border:'2px solid #93c5fd',textAlign:'center'}},
          React.createElement(USSim, {type:'chronic',label:'Chronic DVT',sub:'Echogenic, irregular, collaterals'}),
        )
      ),
      // Feature comparison table
      React.createElement('div', {style:{background:'white',borderRadius:12,border:'1px solid #e2e8f0',overflow:'hidden',marginBottom:16}},
        React.createElement('div', {style:{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',background:'#2d1b69',padding:'10px 14px'}},
          ['Feature','🔴 Acute','🔵 Chronic'].map((h,i)=>React.createElement('div', {key:i, style:{fontWeight:900,fontSize:12,color:'white'}},h))
        ),
        FEATURES.map((f,i)=>React.createElement('div', {key:i,
          style:{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',padding:'10px 14px',background:i%2===0?'#f8fafc':'white',borderBottom:'1px solid #f1f5f9'}},
          React.createElement('div', {style:{fontSize:12,fontWeight:800,color:'#1e293b'}},f.feature),
          React.createElement('div', {style:{fontSize:12,color:'#dc2626',lineHeight:1.4}},f.acute),
          React.createElement('div', {style:{fontSize:12,color:'#1078B9',lineHeight:1.4}},f.chronic)
        ))

    { id:'definition', title:'⏱ Defining Pathologic Reflux', color:'#dc2626',
      body:'Physiologic reflux lasts 200–300 ms in veins with competent valves after calf muscle relaxation. PATHOLOGIC reflux is defined as retrograde flow ≥500 ms after augmentation (manual calf compression + release) or Valsalva (for SFJ/CFV). Some labs use 1000 ms for deep veins. The 500 ms threshold is the standard for superficial veins (GSV, SSV) in clinical practice.' },

        <div style={{display:'flex',justifyContent:'space-between',marginTop:20,gap:10}}>
          <button onClick={()=>setStep(s=>Math.max(0,s-1))} disabled={step===0}

          </button>
          <button onClick={()=>onExit('training')}
            style={{background:'rgba(255,255,255,0.15)',border:'none',color:'white',borderRadius:8,padding:'6px 14px',fontSize:12,fontWeight:700,cursor:'pointer'}}>
            ← Back to Hub
          </button>
        </div>
      </div>

      {/* Phase selector + overall progress */}
      <div style={{background:'white',padding:'16px 24px',borderBottom:'1px solid #e2e8f0'}}>
        {/* Overall progress bar */}
        <div style={{display:'flex',gap:6,marginBottom:12,flexWrap:'wrap'}}>
          {PHASES.map(p => {
            const prog = phaseProgress(p.id);
            return (
              <button key={p.id} onClick={()=>switchPhase(p.id)}
                style={{flex:1,minWidth:120,padding:'10px 8px',borderRadius:10,border:`2px solid ${activePhase===p.id?p.color:'#e2e8f0'}`,
                  background:activePhase===p.id?`${p.color}10`:'white',cursor:'pointer',textAlign:'center',transition:'all 0.15s'}}>
                <div style={{fontSize:16,marginBottom:2}}>{p.icon}</div>
                <div style={{fontSize:12,fontWeight:900,color:activePhase===p.id?p.color:'#475569'}}>{p.label}</div>
                <div style={{fontSize:10,color:'#94a3b8',marginBottom:6}}>{p.subtitle}</div>
                <div style={{background:'#f1f5f9',borderRadius:999,height:5,overflow:'hidden'}}>
                  <div style={{background:p.color,height:'100%',borderRadius:999,width:`${prog.pct}%`,transition:'width 0.3s'}}></div>
                </div>
                <div style={{fontSize:10,fontWeight:800,color:p.color,marginTop:3}}>{prog.done}/{prog.total}</div>
              </button>
            );
          })}
        </div>
      </div>

      {/* Phase content */}
      <div style={{maxWidth:860,margin:'0 auto',padding:'20px 16px'}}>
        <div style={{background:`linear-gradient(135deg,${currentPhase.color},${currentPhase.color}cc)`,borderRadius:14,padding:'16px 20px',marginBottom:16,color:'white'}}>
          <div style={{fontSize:20,fontWeight:900,marginBottom:4}}>{currentPhase.icon} {currentPhase.label} — {currentPhase.subtitle}</div>
          <div style={{fontSize:13,opacity:0.9}}>{currentPhase.desc}</div>
          <div style={{marginTop:10,background:'rgba(255,255,255,0.2)',borderRadius:999,height:8,overflow:'hidden'}}>
            <div style={{background:'white',height:'100%',borderRadius:999,width:`${phaseProgress(activePhase).pct}%`,transition:'width 0.4s'}}></div>
          </div>
          <div style={{fontSize:12,marginTop:4,opacity:0.9}}>{phaseProgress(activePhase).done} of {phaseProgress(activePhase).total} complete · {phaseProgress(activePhase).pct}%</div>
        </div>

        {/* Group by tag */}
        {(() => {
          const tags = [...new Set(currentItems.map(i=>i.tag))];
          return tags.map(tag => {
            const tagItems = currentItems.filter(i=>i.tag===tag);
            const tagDone = tagItems.filter(i=>checks[i.id]).length;
            return (
              <div key={tag} style={{marginBottom:16}}>
                <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:8}}>
                  <div style={{background:tagColors[tag]||'#94a3b8',color:'white',borderRadius:20,padding:'3px 12px',fontSize:11,fontWeight:800}}>{tag}</div>
                  <div style={{fontSize:11,color:'#94a3b8'}}>{tagDone}/{tagItems.length}</div>
                </div>
                {tagItems.map(item => (
                  <div key={item.id} onClick={()=>toggleCheck(item.id)}
                    style={{display:'flex',gap:12,alignItems:'flex-start',padding:'12px 14px',borderRadius:10,marginBottom:6,
                      background:checks[item.id]?`${currentPhase.color}10`:'white',
                      border:`1px solid ${checks[item.id]?currentPhase.color+'40':'#e2e8f0'}`,cursor:'pointer',
                      transition:'all 0.15s'}}>
                    <div style={{width:22,height:22,borderRadius:6,border:`2px solid ${checks[item.id]?currentPhase.color:'#cbd5e1'}`,
                      background:checks[item.id]?currentPhase.color:'white',
                      display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0,marginTop:1,transition:'all 0.15s'}}>
                      {checks[item.id] && <span style={{color:'white',fontSize:12,fontWeight:900}}>✓</span>}
                    </div>
                    <div style={{flex:1}}>
                      <div style={{fontSize:13,fontWeight:700,color:checks[item.id]?'#64748b':'#1e293b',
                        textDecoration:checks[item.id]?'line-through':'none',marginBottom:3}}>{item.label}</div>
                      <div style={{fontSize:11,color:'#64748b',lineHeight:1.5}}>{item.sub}</div>
                    </div>
                  </div>
                ))}
              </div>
            );
          });
        })()}

        {/* Phase complete banner */}
        {phaseProgress(activePhase).pct === 100 && (
          <div style={{background:`linear-gradient(135deg,${currentPhase.color},${dk})`,borderRadius:14,padding:'20px 24px',textAlign:'center',color:'white',marginTop:8}}>
            <div style={{fontSize:36,marginBottom:8}}>🏆</div>
            <div style={{fontSize:18,fontWeight:900,marginBottom:6}}>{currentPhase.label} — Complete!</div>
            <div style={{fontSize:13,opacity:0.9,marginBottom:16}}>Outstanding. Move on to your next phase.</div>
            {PHASES.findIndex(p=>p.id===activePhase) < PHASES.length-1 && (
              <button onClick={()=>switchPhase(PHASES[PHASES.findIndex(p=>p.id===activePhase)+1].id)}
                style={{background:'white',color:currentPhase.color,borderRadius:10,padding:'10px 24px',border:'none',fontWeight:900,fontSize:14,cursor:'pointer'}}>
                Next Phase →
              </button>
            )}
          </div>
        )}
      </div>
    </div>
  );
}

const PPT_QUESTIONS = [

  {id:2, topic:'Reflux Assessment', q:'What is the minimum reflux duration that is considered pathologic during duplex ultrasound?', opts:['100 ms','250 ms','500 ms','1000 ms'], ans:2, exp:'Reflux ≥500 ms (0.5 seconds) is the threshold for pathologic reflux. Any retrograde flow lasting less than 500 ms is considered physiologic.'},

  {id:5, topic:'Treatment Planning', q:'Which treatment is preferred for SSV (small saphenous vein) reflux?', opts:['Varithena','VenaSeal','RFA','Sclerotherapy'], ans:2, exp:'SSV → RFA. Radiofrequency ablation is the standard approach for SSV truncal reflux, similar to proximal GSV.'},
  {id:6, topic:'CPT Codes', q:'Which CPT code(s) correspond to Radiofrequency Ablation (RFA)?', opts:['36465 and 36466','36475 and 36476','36478 and 36479','36471 and 36470'], ans:1, exp:'CPT 36475 = first vein RFA; CPT 36476 = each additional vein. These are the correct codes for thermal (radiofrequency) ablation.'},
  {id:7, topic:'CPT Codes', q:'What does CPT code 36465 represent?', opts:['RFA of first vein','Varithena injection into a single incompetent truncal vein','Varithena injection into multiple incompetent truncal veins','VenaSeal closure'], ans:1, exp:'CPT 36465 = Varithena (polidocanol injectable foam) injection into a single incompetent truncal vein or its tributaries.'},
  {id:8, topic:'CPT Codes', q:'What does CPT code 36466 represent?', opts:['RFA of additional vein','Single truncal Varithena','Multiple truncal Varithena injections','Sclerotherapy of telangiectasias'], ans:2, exp:'CPT 36466 = Varithena injection into multiple incompetent truncal veins. Use 36465 for single and 36466 for multiple truncal treatments.'},
  {id:9, topic:'Conservative Therapy', q:'When should compression stockings be prescribed in relation to conservative therapy timing?', opts:['After 6 weeks of evaluation','At the follow-up visit','At the very first visit, so the clock starts','Only when insurance pre-auth is approved'], ans:2, exp:'Always prescribe compression at the FIRST visit so the conservative therapy clock starts immediately. Delaying prescription delays authorization.'},
  {id:10, topic:'Conservative Therapy', q:'How long is a standard conservative therapy trial before insurance authorization can be sought?', opts:['2 weeks or 4 weeks','3 weeks or 8 weeks','6 weeks or 12 weeks','4 weeks or 10 weeks'], ans:2, exp:'Conservative therapy is either a 6-week or 12-week trial depending on the insurance carrier. Know your payer requirements.'},
  {id:11, topic:'Conservative Therapy', q:'Which of the following is a recognized EXCEPTION to conservative therapy requirements?', opts:['Mild leg aching','C2 varicose veins without symptoms','Active varicose vein rupture','Telangiectasias only'], ans:2, exp:'Exceptions include: active VV rupture, active ulceration, and recurrent thrombophlebitis. These allow bypassing conservative therapy and proceeding directly to treatment.'},
  {id:12, topic:'EHIT Classification', q:'EHIT Class 2 is defined as thrombus that:', opts:['Is limited to the saphenofemoral junction level','Extends into the deep vein involving <50% of the lumen','Extends into the deep vein involving >50% of the lumen','Completely occludes the deep vein'], ans:1, exp:'EHIT Class 2 = thrombus extends into the deep vein with <50% luminal involvement. Class 1 = at junction; Class 3 = >50%; Class 4 = complete occlusion.'},
  {id:13, topic:'EHIT Classification', q:'EHIT Class 4 represents:', opts:['Thrombus at the junction level','Extension <50% into deep vein','Extension >50% into deep vein','Complete occlusion of the deep vein'], ans:3, exp:'EHIT Class 4 = complete occlusion of the deep vein. This requires urgent anticoagulation. Class 1-2 are monitored; Class 3-4 typically require treatment.'},
  {id:14, topic:'DVT Management', q:'A patient is diagnosed with a distal (below-knee) DVT with no symptoms and low risk. What is the typical management?', opts:['Immediate systemic thrombolysis','Observation or short-course anticoagulation','Anticoagulation for 3-6 months','Immediate surgical thrombectomy'], ans:1, exp:'Distal DVT = observation or anticoagulation (provider-dependent). Proximal DVT requires full anticoagulation for 3-6 months due to higher PE risk.'},
  {id:15, topic:'CEAP Classification', q:'A patient has edema but no skin changes or ulcers. What is their CEAP clinical class?', opts:['C2','C3','C4','C5'], ans:1, exp:'C3 = edema (without skin changes). C0=no signs, C1=telangiectasias, C2=varicose veins, C3=edema, C4=skin changes, C5=healed ulcer, C6=active ulcer.'},
  {id:16, topic:'CEAP Classification', q:'A patient has an active venous ulcer. What is their CEAP clinical class?', opts:['C4','C5','C6','C3'], ans:2, exp:'C6 = active venous ulcer. C5 = healed ulcer. These higher CEAP classes often qualify for expedited treatment authorization.'},
  {id:17, topic:'Ultrasound Findings', q:'The "Egyptian eye sign" on ultrasound refers to:', opts:['A hyperechoic thrombus in the CFV','The GSV sitting in the saphenous compartment between two fascial layers','A duplicated popliteal vein','Valve leaflets visible in standing position'], ans:1, exp:'The Egyptian eye sign describes the GSV in cross-section sitting within the saphenous compartment — surrounded by two echogenic fascial layers, giving the appearance of an eye.'},
  {id:18, topic:'Post-Procedure Protocol', q:'When should a post-procedure duplex ultrasound scan be performed after vein ablation?', opts:['Same day','3-7 days post-procedure','2 weeks post-procedure','Only if symptomatic'], ans:1, exp:'Post-procedure scan timing: 3-7 days after the procedure. This evaluates for EHIT, DVT, or treatment failure.'},
  {id:19, topic:'Follow-Up Schedule', q:'What is the standard follow-up schedule after vein treatment?', opts:['2, 4, 8 weeks','1, 3, 6 months','1, 3, 6, 9, 12 months','2 weeks, then annually'], ans:2, exp:'Standard follow-up: 1 month, 3 months, 6 months, 9 months, 12 months. Photos should be taken at every follow-up appointment.'},
  {id:20, topic:'VenaSeal', q:'Which statements are true about VenaSeal? (select best answer)', opts:['Requires tumescent anesthesia and compression post-procedure','Requires tumescent but NOT compression post-procedure','Does NOT require tumescent or post-procedure compression','Requires compression but no tumescent'], ans:2, exp:'VenaSeal unique features: NO tumescent anesthesia needed and NO compression post-procedure required. This distinguishes it from thermal ablation methods.'},
  {id:21, topic:'Lymphedema', q:'What compression class is recommended for phlebolymphedema management?', opts:['Class I (10-15 mmHg)','Class II (20-30 mmHg)','Class III (30-40 mmHg)','Class IV (40-50 mmHg)'], ans:1, exp:'Phlebolymphedema: Class II (20-30 mmHg) compression, plus CDT (Complete Decongestive Therapy), and venous ablation if reflux is confirmed.'},
  {id:22, topic:'Clinical Workflows', q:'The Vein Talk patient education script follows which sequence?', opts:['Treatment → Anatomy → Reflux → CVI','Symptoms → Insurance → Treatment options','Valves → Reflux → CVI → Treatment options','CVI → Valves → Reflux → Insurance'], ans:2, exp:'Vein Talk script: Valves → Reflux → CVI → Treatment options. This patient-friendly narrative builds understanding from anatomy to disease to solutions.'},
  {id:23, topic:'Nextech Systems', q:'What is the purpose of the "US Review" appointment type in Nextech?', opts:['First patient visit with intake','Second visit to review ultrasound results and explain treatment plan','Third visit for procedure scheduling','Post-procedure follow-up'], ans:1, exp:'US Review = the second visit. Use it to explain the ultrasound findings and treatment plan to the patient, and communicate the treatment plan to the sonographer.'},
  {id:24, topic:'RPhS Exam', q:'What percentage of the RPhS exam is the "Perform Ultrasound" section (Section C)?', opts:['15%','25%','37%','45%'], ans:2, exp:'Section C (Perform Ultrasound) = 37% of the RPhS exam — the single largest section. Prioritize ultrasound competency for exam prep.'},
  {id:25, topic:'Clinical Assessment', q:'The Stemmer sign is used to assess for:', opts:['Deep vein thrombosis','Venous ulceration','Lymphedema','Arterial insufficiency'], ans:2, exp:'A positive Stemmer sign (inability to pinch skin at base of second toe) indicates lymphedema. It helps distinguish lymphedema from purely venous edema.'},

// ── COSMETIC SCLEROTHERAPY MODULE (Module 3) ─────────────────────────────────
function CosmeticModule({ onExit }) {
  const pur = '#7C3AED', pk = '#EC4899', dk = '#2d1b69';

  const [activeSection, setActiveSection] = React.useState(0);
  const [checks, setChecks] = React.useState({});
  const [quizAnswers, setQuizAnswers] = React.useState({});
  const [quizSubmitted, setQuizSubmitted] = React.useState({});

  React.useEffect(() => {
    const saved = localStorage.getItem('vip_m3_cosmetic');
    if (saved) {
      try {
        const p = JSON.parse(saved);
        setChecks(p.checks || {});
        setActiveSection(p.activeSection || 0);
      } catch(e) {}
    }
  }, []);

  const saveState = (ch, sec) => {
    localStorage.setItem('vip_m3_cosmetic', JSON.stringify({ checks: ch, activeSection: sec }));
  };

  const toggleCheck = (id) => {
    const next = { ...checks, [id]: !checks[id] };
    setChecks(next);
    saveState(next, activeSection);
  };

  const switchSection = (i) => {
    setActiveSection(i);
    saveState(checks, i);
    window.scrollTo(0, 0);
  };

  const submitQuiz = (qKey, selectedIdx) => {
    setQuizAnswers(prev => ({ ...prev, [qKey]: selectedIdx }));
    setQuizSubmitted(prev => ({ ...prev, [qKey]: true }));
  };

  const SECTIONS = [
    'Overview & Indications',
    'Patient Selection & Expectations',
    'Medication & Preparation',
    'Injection Technique',
    'Complications & Management',
    'Aftercare Protocol',
    'Payment & Workflow',
    'Who NOT to Treat',
    'Results & Retreatment',
    '📋 Training Checklist',
  ];

  const QUIZZES = {
    s0: { q:'Cosmetic sclerotherapy is indicated as the primary treatment for which of the following?', opts:['Active CVI with significant reflux on duplex','Spider/reticular veins in patients without active reflux','Symptomatic truncal GSV reflux','Deep vein thrombosis'], ans:1, exp:'Cosmetic sclerotherapy targets telangiectasias and reticular veins (spider veins) for aesthetic improvement — in patients who are negative for CVI, asymptomatic, or who have completed CVI treatment. It is NOT the primary treatment for active CVI or truncal reflux.' },
    s2: { q:'What is the maximum total foam volume per session, including Varithena?', opts:['5 mL','10 mL','15 mL','20 mL'], ans:1, exp:'10 mL is the safety cap for total foam per session regardless of source. This limit applies whether foam comes from cosmetic syringes, Tessari preparation, or Varithena.' },
    s3: { q:'During liquid injection, what visual cue tells you to STOP immediately?', opts:['Blanching of the vein cluster','Wheal formation (raised skin bump)','Mild erythema around the site','Patient reports warmth'], ans:1, exp:'Wheal formation means the injection is intradermal (too superficial). Stop immediately and reposition. Blanching is the desired response — it confirms intravascular delivery.' },
    s4: { q:'A patient with Fitzpatrick Type V skin asks about cosmetic sclerotherapy. What is the most important counseling point?', opts:['Refuse treatment entirely','No special counseling needed — proceed normally','Higher risk and longer duration of hyperpigmentation; consider test injection first','Use foam only to avoid pigmentation'], ans:2, exp:'Fitzpatrick Types V–VI carry the highest risk of significant and prolonged hyperpigmentation. Counsel thoroughly about this risk. Consider a test injection in a discreet area (above the knee) and reassess in 8 weeks before treating larger areas.' },
    s8: { q:'What is the minimum time before retreating a cosmetic sclerotherapy area?', opts:['2 weeks','4 weeks','8 weeks','12 weeks'], ans:1, exp:'The minimum retreatment interval is 4 weeks. Waiting allows bruising to resolve and gives you an accurate picture of the area before deciding whether to retreat.' },
  };

  function QuizBlock({ qKey }) {
    const quiz = QUIZZES[qKey];
    if (!quiz) return null;
    const submitted = quizSubmitted[qKey];
    const selected = quizAnswers[qKey];
    return (
      <div style={{background:'linear-gradient(135deg,#7C3AED11,#EC489911)',border:'2px solid #7C3AED33',borderRadius:14,padding:'18px 20px',marginTop:20}}>
        <div style={{fontSize:12,fontWeight:900,color:pur,textTransform:'uppercase',letterSpacing:'0.06em',marginBottom:10}}>📝 Knowledge Check</div>
        <div style={{fontSize:14,fontWeight:700,color:'#1e293b',marginBottom:14,lineHeight:1.5}}>{quiz.q}</div>
        <div style={{display:'flex',flexDirection:'column',gap:8,marginBottom:12}}>
          {quiz.opts.map((opt, i) => {
            let bg = 'white', border = '#e2e8f0', color = '#374151';
            if (submitted) {
              if (i === quiz.ans) { bg = '#dcfce7'; border = '#22c55e'; color = '#166534'; }
              else if (i === selected && i !== quiz.ans) { bg = '#fee2e2'; border = '#ef4444'; color = '#991b1b'; }
            } else if (i === selected) { bg = '#ede9fe'; border = pur; color = pur; }
            return (
              <div key={i} onClick={() => !submitted && setQuizAnswers(prev => ({...prev, [qKey]: i}))}
                style={{background:bg,border:`2px solid ${border}`,borderRadius:10,padding:'10px 14px',fontSize:13,color,fontWeight:submitted&&i===quiz.ans?800:600,cursor:submitted?'default':'pointer',transition:'all 0.15s'}}>
                {String.fromCharCode(65+i)}. {opt}
              </div>
            );
          })}
        </div>
        {!submitted && <button onClick={() => submitQuiz(qKey, selected !== undefined ? selected : -1)} disabled={selected === undefined}
          style={{background:selected!==undefined?pur:'#e2e8f0',color:selected!==undefined?'white':'#94a3b8',border:'none',borderRadius:10,padding:'10px 20px',fontFamily:'DM Sans',fontWeight:900,fontSize:13,cursor:selected!==undefined?'pointer':'default'}}>
          Submit Answer
        </button>}
        {submitted && <div style={{background:'#f8fafc',borderRadius:8,padding:'10px 14px',fontSize:13,color:'#374151',lineHeight:1.6}}>
          <strong style={{color:dk}}>Explanation: </strong>{quiz.exp}
        </div>}
      </div>
    );
  }

  const CHECKLIST_GROUPS = [
    { id:'fund', label:'1. Fundamentals', color:'#059669', items:[
      { id:'c_spiderreticular', label:'Understand spider vs reticular veins and their clinical significance' },
      { id:'c_indcontra', label:'Review indications and contraindications for cosmetic sclerotherapy' },
      { id:'c_talkdelivered', label:'Deliver full cosmetic sclerotherapy patient talk (expectations, risks, outcomes)' },
    ]},
    { id:'med', label:'2. Medication Knowledge', color:'#1078B9', items:[
      { id:'c_asclera_conc', label:'Understand Asclera/polidocanol concentrations and dilution to 0.5%' },
      { id:'c_moa', label:'Explain the mechanism of action of polidocanol (detergent sclerosant → endothelial damage → fibrosis → vein closure)' },
      { id:'c_dilution', label:'Demonstrate correct dilution preparation for both Option A (generic 5%) and Option B (Asclera 1%)' },
      { id:'c_dosing_limits', label:'Know dosing per site (0.5 mL liquid) and session foam cap (10 mL)' },
      { id:'c_foam_prep', label:'Demonstrate foam preparation technique (Tessari / syringe method)' },
    ]},
    { id:'inj', label:'3. Injection Technique', color:pur, items:[
      { id:'c_needle_blanch', label:'Demonstrate proper needle angle, bevel up, and blanching recognition' },
      { id:'c_foam_vs_liquid', label:'Know when to use foam vs. liquid: foam for larger clusters/reticulars, liquid for fine spider veins; foam carries higher pigmentation risk' },
    ]},
    { id:'cx', label:'4. Complication Management', color:'#DC2626', items:[
      { id:'c_cx_hyperpig', label:'Understand hyperpigmentation: cause (hemosiderin), risk factors (Fitzpatrick scale), prevention, and patient communication' },
      { id:'c_cx_trapped', label:'Understand trapped blood: presentation (pinching at 3–5 weeks), management (aspiration vs. warm compress), and how to explain it to patients' },
      { id:'c_cx_matting', label:'Understand matting: cause, why early retreatment makes it worse, and how to communicate the 3–6 month wait to patients' },
      { id:'c_cx_necrosis', label:'Understand skin necrosis: causes, early warning signs, prevention, and when to escalate to supervising physician' },
    ]},


  ];

  const allItems = CHECKLIST_GROUPS.flatMap(g => g.items);
  const doneCount = allItems.filter(i => checks[i.id]).length;
  const pct = Math.round((doneCount / allItems.length) * 100);

  const sectionContent = [
    // Section 0: Overview & Indications
    <div key="s0">
      <div className="hbox hbox-blue" style={{marginBottom:14}}>
        <div className="hbox-title">What Is Cosmetic Sclerotherapy?</div>
        <div className="hbox-body">Cosmetic sclerotherapy treats <strong>telangiectasias (spider veins)</strong> and <strong>reticular veins</strong> for aesthetic improvement. It is <strong>not</strong> a treatment for chronic venous insufficiency (CVI). The goal is cosmetic improvement — not medical treatment of venous disease.</div>
      </div>
      <div className="section-label">Appropriate Candidates</div>
      {[
        'Patient is negative for CVI',
        'Patient has reflux on duplex but is asymptomatic (spider veins only)',
        'Patient completed CVI treatment and has residual spider veins',
      ].map((s,i) => <div key={i} style={{fontSize:13,color:'#374151',padding:'6px 0',borderBottom:'1px solid #f1f5f9',display:'flex',gap:8}}><span style={{color:'#22c55e',fontWeight:900}}>✓</span>{s}</div>)}
      <div className="hbox hbox-red" style={{marginTop:16,marginBottom:14}}>
        <div className="hbox-title">🚨 Important: Reflux on Ultrasound</div>
        <div className="hbox-body">If reflux is present on ultrasound, cosmetic sclerotherapy is <strong>not the initial priority</strong>. Set expectations clearly: untreated underlying reflux will lead to earlier recurrence of spider veins. Address the CVI first, then offer cosmetic treatment.</div>
      </div>
      <div className="section-label">Key Expectations (Communicate Every Time)</div>
      <div className="grid-2">
        {[
          ['📆 Recurrence is common','Venous disease is systemic. New spider veins can appear over time even after successful treatment.'],
          ['🔄 Multiple sessions required','Most patients need 2+ sessions for meaningful improvement.'],
          ['⏳ Improvement is gradual','Results visible at 4–8 weeks; full results up to 6 months.'],
          ['🎯 No guarantees','Complete clearance cannot be guaranteed even with excellent technique.'],
        ].map(([t,d]) => (
          <div key={t} style={{background:'#f8fafc',border:'1px solid #e2e8f0',borderRadius:10,padding:'12px 14px'}}>
            <div style={{fontWeight:900,fontSize:13,color:dk,marginBottom:4}}>{t}</div>
            <div style={{fontSize:12,color:'#64748b',lineHeight:1.5}}>{d}</div>
          </div>
        ))}
      </div>
      <QuizBlock qKey="s0" />
    </div>,

    // Section 1: Patient Selection & Expectations
    <div key="s1">
      <div className="hbox hbox-purple" style={{marginBottom:14}}>
        <div className="hbox-title">VTC Complimentary Session Protocol</div>
        <div className="hbox-body">Patients completing vein treatment at VIP receive <strong>one complimentary cosmetic sclerotherapy session per leg</strong> after completion of their vein treatment.<br/><br/><strong>Typical session:</strong> 2 syringes foam (0.7 mL each) + 2 syringes liquid (3 mL each)<br/><br/><em style={{fontSize:12,color:'#6b7280'}}>⚠️ Disclaimer: The complimentary session offering is at the provider's discretion and may be adjusted based on clinical judgment, patient suitability, or practice workflow.</em></div>
      </div>
      <div className="section-label" style={{marginBottom:8}}>Provider Approach Options</div>
      <div style={{overflowX:'auto',marginBottom:16}}>

            <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:10}}>
              <div style={{fontWeight:900,fontSize:14,color:dk}}>{g.label}</div>
              <div style={{fontSize:12,color:'#94a3b8',fontWeight:700}}>{gDone}/{g.items.length}</div>
            </div>
            {g.items.map(item => (
              <div key={item.id} onClick={() => toggleCheck(item.id)}
                style={{display:'flex',gap:10,alignItems:'flex-start',padding:'8px 0',borderBottom:'1px solid #f1f5f9',cursor:'pointer',transition:'all 0.1s'}}>
                <div style={{width:20,height:20,borderRadius:6,border:`2px solid ${checks[item.id]?g.color:'#d1d5db'}`,background:checks[item.id]?g.color:'white',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0,marginTop:1,transition:'all 0.2s'}}>
                  {checks[item.id] && <span style={{color:'white',fontSize:12}}>✓</span>}
                </div>
                <div style={{fontSize:13,color:checks[item.id]?'#94a3b8':'#374151',textDecoration:checks[item.id]?'line-through':'none',lineHeight:1.5}}>{item.label}</div>

      })}
      {pct === 100 && (
        <div style={{background:'linear-gradient(135deg,#7C3AED,#EC4899)',borderRadius:14,padding:'20px 24px',textAlign:'center',marginTop:8}}>
          <div style={{fontSize:24,marginBottom:8}}>🎉</div>
          <div style={{fontSize:16,fontWeight:900,color:'white',marginBottom:6}}>Module 3 Complete!</div>
          <div style={{fontSize:13,color:'rgba(255,255,255,0.85)'}}>You've completed all Cosmetic Sclerotherapy training requirements. Keep this checklist for your records.</div>
        </div>
      )}
    </div>,
  ];

  return (
    <div style={{minHeight:'100vh',background:'#f1f5f9'}}>
      {/* Header */}
      <div style={{background:`linear-gradient(135deg,${pur},${pk})`,padding:'24px 24px 0',color:'white'}}>
        <div style={{maxWidth:860,margin:'0 auto'}}>
          <div style={{display:'flex',alignItems:'center',gap:12,marginBottom:4}}>
            <button onClick={()=>onExit('training')} style={{background:'rgba(255,255,255,0.2)',border:'none',color:'white',borderRadius:8,padding:'6px 12px',fontFamily:'DM Sans',fontWeight:800,fontSize:12,cursor:'pointer'}}>← Back</button>
            <div style={{fontSize:11,fontWeight:900,color:'rgba(255,255,255,0.75)',letterSpacing:2}}>MODULE 3 · ALL PROVIDERS</div>
          </div>
          <h1 style={{fontSize:24,fontWeight:900,color:'white',marginBottom:6}}>✨ Cosmetic Sclerotherapy</h1>
          <p style={{fontSize:13,color:'rgba(255,255,255,0.85)',marginBottom:16}}>Spider vein treatment, patient selection, foam vs. liquid technique, complications, and aftercare. ~45 minutes.</p>
          {/* Section nav */}
          <div style={{display:'flex',gap:4,overflowX:'auto',paddingBottom:4,WebkitOverflowScrolling:'touch',scrollbarWidth:'thin',scrollbarColor:'rgba(255,255,255,0.3) transparent'}}>
            {SECTIONS.map((s,i)=>(
              <button key={i} onClick={()=>switchSection(i)}
                style={{background:activeSection===i?'white':'rgba(255,255,255,0.15)',color:activeSection===i?pur:'rgba(255,255,255,0.85)',border:activeSection===i?'none':'1px solid rgba(255,255,255,0.25)',borderRadius:20,padding:'6px 12px',fontFamily:'DM Sans',fontWeight:800,fontSize:11,cursor:'pointer',whiteSpace:'nowrap',marginTop:4,flexShrink:0,transition:'all 0.15s'}}>
                {s}
              </button>
            ))}
          </div>
        </div>
      </div>
      {/* Content */}
      <div style={{maxWidth:860,margin:'0 auto',padding:'24px 16px 40px'}}>
        <div className="card" style={{marginBottom:16}}>
          <div style={{fontSize:18,fontWeight:900,color:dk,marginBottom:16}}>{SECTIONS[activeSection]}</div>
          {sectionContent[activeSection]}
        </div>
        {/* Navigation buttons */}
        <div style={{display:'flex',justifyContent:'space-between',gap:12}}>
          {activeSection > 0
            ? <button onClick={()=>switchSection(activeSection-1)} style={{background:'white',border:`2px solid ${pur}`,color:pur,borderRadius:10,padding:'10px 20px',fontFamily:'DM Sans',fontWeight:900,fontSize:13,cursor:'pointer'}}>← Previous</button>
            : <div/>}
          {activeSection < SECTIONS.length-1
            ? <button onClick={()=>switchSection(activeSection+1)} style={{background:`linear-gradient(135deg,${pur},${pk})`,border:'none',color:'white',borderRadius:10,padding:'10px 20px',fontFamily:'DM Sans',fontWeight:900,fontSize:13,cursor:'pointer'}}>Next →</button>
            : <button onClick={()=>onExit('training')} style={{background:`linear-gradient(135deg,${pur},${pk})`,border:'none',color:'white',borderRadius:10,padding:'10px 20px',fontFamily:'DM Sans',fontWeight:900,fontSize:13,cursor:'pointer'}}>Finish Module ✓</button>}
        </div>
      </div>
    </div>
  );
}

function PrePostTest() {
  const [screen, setScreen] = React.useState('landing'); // landing | quiz | results
  const [testMode, setTestMode] = React.useState(null); // 'pre' | 'post'
  const [qIdx, setQIdx] = React.useState(0);
  const [selected, setSelected] = React.useState(null);
  const [answered, setAnswered] = React.useState(false);
  const [responses, setResponses] = React.useState([]); // [{qId, correct, topic}]

  const startTest = (mode) => {
    setTestMode(mode);
    setQIdx(0);
    setSelected(null);
    setAnswered(false);
    setResponses([]);
    setScreen('quiz');
  };

  const handleSelect = (optIdx) => {
    if (answered) return;
    setSelected(optIdx);
    setAnswered(true);
    const q = PPT_QUESTIONS[qIdx];
    const correct = optIdx === q.ans;
    setResponses(r => [...r, {qId: q.id, correct, topic: q.topic}]);
  };

  const handleNext = () => {
    if (qIdx + 1 >= PPT_QUESTIONS.length) {
      // Save to localStorage
      const score = responses.filter(r => r.correct).length + (selected === PPT_QUESTIONS[qIdx].ans ? 1 : 0);
      const key = testMode === 'pre' ? 'vip_pretest' : 'vip_posttest';
      try {
        localStorage.setItem(key, JSON.stringify({score: responses.filter(r=>r.correct).length + (selected === PPT_QUESTIONS[qIdx].ans ? 1 : 0), total: PPT_QUESTIONS.length, ts: Date.now()}));
      } catch(e) {}
      setScreen('results');
    } else {
      setQIdx(i => i + 1);
      setSelected(null);
      setAnswered(false);
    }
  };

  const getStoredScore = (mode) => {
    try {
      const key = mode === 'pre' ? 'vip_pretest' : 'vip_posttest';
      const d = localStorage.getItem(key);
      return d ? JSON.parse(d) : null;
    } catch(e) { return null; }
  };

  // ── LANDING ──
  if (screen === 'landing') {
    const preScore = getStoredScore('pre');
    const postScore = getStoredScore('post');
    return (
      <div style={{maxWidth:720, margin:'0 auto', padding:'32px 16px'}}>
        <div style={{background:'linear-gradient(135deg,#2d1b69,#6C3CB5)', borderRadius:16, padding:'28px 32px', color:'white', marginBottom:28}}>
          <div style={{fontSize:28, fontWeight:900, marginBottom:8}}>📝 Provider Knowledge Assessment</div>
          <div style={{fontSize:14, opacity:0.85, lineHeight:1.6}}>25 questions covering vein anatomy, clinical protocols, CPT codes, procedures, and Nextech workflows. Use Pre-Test before training, Post-Test after.</div>
          {(preScore || postScore) && (
            <div style={{marginTop:16, background:'rgba(255,255,255,0.12)', borderRadius:10, padding:'12px 16px', fontSize:13}}>
              {preScore && <div>📊 Pre-Test: <strong>{preScore.score}/{preScore.total}</strong> ({Math.round(preScore.score/preScore.total*100)}%) — {new Date(preScore.ts).toLocaleDateString()}</div>}
              {postScore && <div style={{marginTop:4}}>📊 Post-Test: <strong>{postScore.score}/{postScore.total}</strong> ({Math.round(postScore.score/postScore.total*100)}%) — {new Date(postScore.ts).toLocaleDateString()}</div>}
              {preScore && postScore && (
                <div style={{marginTop:8, fontWeight:800, color: postScore.score >= preScore.score ? '#86efac' : '#fca5a5'}}>
                  {postScore.score >= preScore.score ? '📈' : '📉'} {postScore.score >= preScore.score ? `Improvement: +${postScore.score - preScore.score} points` : `Change: ${postScore.score - preScore.score} points`}
                </div>
              )}
            </div>
          )}
        </div>
        <div style={{display:'grid', gridTemplateColumns:'1fr 1fr', gap:16}}>
          {[
            {mode:'pre', color:'#E45487', bg:'linear-gradient(135deg,#E45487,#AC4ABD)', tag:'BEFORE TRAINING', title:'📋 Pre-Test', desc:'Take this before starting your training modules to establish a baseline score.'},
            {mode:'post', color:'#1078B9', bg:'linear-gradient(135deg,#1078B9,#6C3CB5)', tag:'AFTER TRAINING', title:'✅ Post-Test', desc:'Take this after completing training to demonstrate knowledge gained.'},
          ].map(c => (
            <div key={c.mode} onClick={() => startTest(c.mode)}
              style={{background:c.bg, borderRadius:16, padding:'24px', cursor:'pointer', color:'white', border:'2px solid rgba(255,255,255,0.15)', transition:'transform 0.15s'}}
              onMouseEnter={e=>e.currentTarget.style.transform='scale(1.02)'}
              onMouseLeave={e=>e.currentTarget.style.transform='scale(1)'}>
              <div style={{fontSize:10, fontWeight:900, letterSpacing:2, opacity:0.8, marginBottom:10}}>{c.tag}</div>
              <div style={{fontSize:22, fontWeight:900, marginBottom:8}}>{c.title}</div>
              <div style={{fontSize:13, opacity:0.85, lineHeight:1.5, marginBottom:16}}>{c.desc}</div>
              {getStoredScore(c.mode) && (
                <div style={{background:'rgba(255,255,255,0.15)', borderRadius:8, padding:'8px 12px', fontSize:12, fontWeight:700, marginBottom:12}}>
                  Last score: {getStoredScore(c.mode).score}/{getStoredScore(c.mode).total} ({Math.round(getStoredScore(c.mode).score/getStoredScore(c.mode).total*100)}%)
                </div>
              )}
              <div style={{background:'white', color:c.color, borderRadius:10, padding:'11px 20px', fontWeight:900, fontSize:14, textAlign:'center'}}>
                {getStoredScore(c.mode) ? 'Retake →' : 'Begin →'}
              </div>
            </div>
          ))}
        </div>
        <div style={{marginTop:20, background:'#f8fafc', borderRadius:12, padding:'16px', fontSize:13, color:'#64748b'}}>
          <strong style={{color:'#374151'}}>📌 About this assessment:</strong> 25 questions · Multiple choice · Passing score ≥80% (20/25) · Scores saved locally in your browser
        </div>
      </div>
    );
  }

  // ── QUIZ ──
  if (screen === 'quiz') {
    const q = PPT_QUESTIONS[qIdx];
    const pct = Math.round((qIdx / PPT_QUESTIONS.length) * 100);
    const isCorrect = answered && selected === q.ans;
    const modeColor = testMode === 'pre' ? '#E45487' : '#1078B9';
    const modeBg = testMode === 'pre' ? 'linear-gradient(135deg,#E45487,#AC4ABD)' : 'linear-gradient(135deg,#1078B9,#6C3CB5)';
    const correctCount = responses.filter(r => r.correct).length;
    return (
      <div style={{maxWidth:680, margin:'0 auto', padding:'24px 16px'}}>
        {/* Header */}
        <div style={{background: modeBg, borderRadius:14, padding:'16px 20px', color:'white', marginBottom:20, display:'flex', justifyContent:'space-between', alignItems:'center'}}>
          <div>
            <div style={{fontSize:11, fontWeight:900, letterSpacing:2, opacity:0.8}}>{testMode === 'pre' ? 'PRE-TEST' : 'POST-TEST'}</div>
            <div style={{fontSize:16, fontWeight:800}}>Question {qIdx + 1} of {PPT_QUESTIONS.length}</div>
          </div>
          <div style={{textAlign:'right'}}>
            <div style={{fontSize:11, opacity:0.8}}>Score so far</div>
            <div style={{fontSize:20, fontWeight:900}}>{correctCount}/{qIdx}</div>
          </div>
        </div>
        {/* Progress bar */}
        <div style={{height:6, background:'#e2e8f0', borderRadius:99, marginBottom:20, overflow:'hidden'}}>
          <div style={{height:'100%', width:`${pct}%`, background: modeBg, borderRadius:99, transition:'width 0.3s'}} />
        </div>
        {/* Topic tag */}
        <div style={{fontSize:11, fontWeight:800, color: modeColor, background: testMode === 'pre' ? '#fdf2f8' : '#eff6ff', borderRadius:99, padding:'4px 12px', display:'inline-block', marginBottom:14}}>
          {q.topic}
        </div>
        {/* Question */}
        <div style={{fontSize:18, fontWeight:800, color:'#1e293b', marginBottom:20, lineHeight:1.5}}>
          {q.q}
        </div>
        {/* Options */}
        <div style={{display:'flex', flexDirection:'column', gap:10, marginBottom:20}}>
          {q.opts.map((opt, i) => {
            let bg = 'white';
            let border = '2px solid #e2e8f0';
            let color = '#374151';
            if (answered) {
              if (i === q.ans) { bg = '#dcfce7'; border = '2px solid #16a34a'; color = '#15803d'; }
              else if (i === selected && i !== q.ans) { bg = '#fee2e2'; border = '2px solid #dc2626'; color = '#dc2626'; }
            } else if (selected === i) {
              bg = '#f0f9ff'; border = `2px solid ${modeColor}`;
            }
            return (
              <div key={i} onClick={() => handleSelect(i)}
                style={{background: bg, border, borderRadius:12, padding:'14px 18px', cursor: answered ? 'default' : 'pointer',
                  color, fontWeight:600, fontSize:14, lineHeight:1.4, transition:'all 0.15s',
                  display:'flex', alignItems:'center', gap:12}}
                onMouseEnter={e=>{ if(!answered) e.currentTarget.style.borderColor = modeColor; }}
                onMouseLeave={e=>{ if(!answered && selected !== i) e.currentTarget.style.borderColor = '#e2e8f0'; }}>
                <div style={{width:28, height:28, borderRadius:'50%', background: answered && i===q.ans ? '#16a34a' : (answered && i===selected && i!==q.ans ? '#dc2626' : '#f1f5f9'), color: (answered && (i===q.ans || i===selected)) ? 'white' : '#64748b', display:'flex', alignItems:'center', justifyContent:'center', fontWeight:900, fontSize:12, flexShrink:0}}>
                  {answered && i === q.ans ? '✓' : answered && i === selected && i !== q.ans ? '✗' : String.fromCharCode(65 + i)}
                </div>
                {opt}
              </div>
            );
          })}
        </div>
        {/* Explanation */}
        {answered && (
          <div style={{background: isCorrect ? '#f0fdf4' : '#fff7ed', border: `1px solid ${isCorrect ? '#86efac' : '#fed7aa'}`, borderRadius:12, padding:'14px 18px', marginBottom:16}}>
            <div style={{fontWeight:800, color: isCorrect ? '#15803d' : '#c2410c', marginBottom:6}}>
              {isCorrect ? '✅ Correct!' : '❌ Incorrect'}
            </div>
            <div style={{fontSize:13, color:'#374151', lineHeight:1.6}}>{q.exp}</div>
          </div>
        )}
        {/* Next button */}
        {answered && (
          <button onClick={handleNext}
            style={{background: modeBg, color:'white', border:'none', borderRadius:12, padding:'14px 28px', fontFamily:'DM Sans', fontWeight:900, fontSize:15, cursor:'pointer', width:'100%'}}>
            {qIdx + 1 >= PPT_QUESTIONS.length ? 'See Results →' : 'Next Question →'}
          </button>
        )}
      </div>
    );
  }

  // ── RESULTS ──
  if (screen === 'results') {
    const finalScore = responses.filter(r => r.correct).length;
    const pct = Math.round(finalScore / PPT_QUESTIONS.length * 100);
    const passed = pct >= 80;
    const modeColor = testMode === 'pre' ? '#E45487' : '#1078B9';
    const modeBg = testMode === 'pre' ? 'linear-gradient(135deg,#E45487,#AC4ABD)' : 'linear-gradient(135deg,#1078B9,#6C3CB5)';
    // Topic breakdown
    const topics = [...new Set(PPT_QUESTIONS.map(q => q.topic))];
    const topicScores = topics.map(t => {
      const qs = responses.filter(r => r.topic === t);
      return {topic: t, correct: qs.filter(r=>r.correct).length, total: qs.length};
    });
    // Improvement comparison
    const otherMode = testMode === 'pre' ? 'post' : 'pre';
    const otherScore = getStoredScore(otherMode);
    const thisStored = getStoredScore(testMode);
    return (
      <div style={{maxWidth:680, margin:'0 auto', padding:'24px 16px'}}>
        {/* Score card */}
        <div style={{background: modeBg, borderRadius:16, padding:'28px 32px', color:'white', marginBottom:20, textAlign:'center'}}>
          <div style={{fontSize:11, fontWeight:900, letterSpacing:2, opacity:0.8, marginBottom:8}}>{testMode === 'pre' ? 'PRE-TEST RESULTS' : 'POST-TEST RESULTS'}</div>
          <div style={{fontSize:72, fontWeight:900, lineHeight:1}}>{pct}%</div>
          <div style={{fontSize:20, fontWeight:800, marginTop:8}}>{finalScore} / {PPT_QUESTIONS.length} correct</div>
          <div style={{marginTop:12, fontSize:16, fontWeight:800, background:'rgba(255,255,255,0.2)', borderRadius:99, padding:'8px 20px', display:'inline-block'}}>
            {passed ? '🎉 PASSED' : '📚 NOT YET PASSING'} · {passed ? 'Great work!' : 'Score ≥80% to pass'}
          </div>
        </div>
        {/* Improvement */}
        {otherScore && (
          <div style={{background: finalScore >= otherScore.score ? '#f0fdf4' : '#fff7ed', border:`1px solid ${finalScore >= otherScore.score ? '#86efac' : '#fed7aa'}`, borderRadius:12, padding:'14px 18px', marginBottom:16}}>
            <div style={{fontWeight:800, color: finalScore >= otherScore.score ? '#15803d' : '#c2410c', fontSize:14}}>
              {finalScore >= otherScore.score ? '📈 Improvement!' : '📉 Comparison'} vs {otherMode === 'pre' ? 'Pre-Test' : 'Post-Test'}: {otherScore.score}/{otherScore.total} ({Math.round(otherScore.score/otherScore.total*100)}%)
              {finalScore >= otherScore.score ? ` · +${finalScore - otherScore.score} points` : ` · ${finalScore - otherScore.score} points`}
            </div>
          </div>
        )}
        {/* Topic breakdown */}
        <div style={{background:'white', border:'1px solid #e2e8f0', borderRadius:14, padding:'20px', marginBottom:20}}>
          <div style={{fontWeight:900, fontSize:16, color:'#1e293b', marginBottom:14}}>📊 Performance by Topic</div>
          <div style={{display:'flex', flexDirection:'column', gap:8}}>
            {topicScores.map(ts => {
              const tPct = ts.total > 0 ? Math.round(ts.correct / ts.total * 100) : 0;
              const good = tPct === 100;
              const ok = tPct >= 50;
              return (
                <div key={ts.topic} style={{display:'flex', alignItems:'center', gap:10}}>
                  <div style={{width:130, fontSize:12, fontWeight:700, color:'#374151', flexShrink:0}}>{ts.topic}</div>
                  <div style={{flex:1, height:8, background:'#f1f5f9', borderRadius:99, overflow:'hidden'}}>
                    <div style={{height:'100%', width:`${tPct}%`, background: good ? '#16a34a' : ok ? modeColor : '#dc2626', borderRadius:99}} />
                  </div>
                  <div style={{fontSize:12, fontWeight:800, color: good ? '#16a34a' : ok ? '#374151' : '#dc2626', width:50, textAlign:'right'}}>{ts.correct}/{ts.total}</div>
                </div>
              );
            })}
          </div>
        </div>
        {/* Actions */}
        <div style={{display:'flex', gap:10}}>
          <button onClick={() => startTest(testMode)}
            style={{flex:1, background: modeBg, color:'white', border:'none', borderRadius:12, padding:'14px', fontFamily:'DM Sans', fontWeight:900, fontSize:14, cursor:'pointer'}}>
            🔄 Retake {testMode === 'pre' ? 'Pre-Test' : 'Post-Test'}
          </button>
          <button onClick={() => setScreen('landing')}
            style={{flex:1, background:'#f1f5f9', color:'#374151', border:'none', borderRadius:12, padding:'14px', fontFamily:'DM Sans', fontWeight:900, fontSize:14, cursor:'pointer'}}>
            ← Back to Tests
          </button>
        </div>
      </div>
    );
  }

  return null;
}

  {id:8,cat:'Anatomy',type:'mc',q:'Perforating veins that connect the GSV system to the femoral vein are most clinically significant at which locations?',opts:['Mid-thigh and knee only','Ankle (Cockett perforators), mid-calf, and mid-thigh (Dodd/Hunterian perforators)','Only at the SFJ and SPJ','Solely in the popliteal fossa'],ans:1,exp:'Clinically important perforators include the Cockett group (medial lower leg/ankle), Boyd (below knee), Dodd and Hunterian (thigh). Incompetent perforators contribute to venous hypertension and skin changes.'},
  {id:9,cat:'Anatomy',type:'mc',q:'Which nerve is at risk during SSV procedures in the popliteal fossa and lower leg?',opts:['Saphenous nerve','Tibial nerve','Sural nerve','Femoral nerve'],ans:2,exp:'The sural nerve runs parallel to the SSV in the posterior lower leg and is the primary nerve at risk during SSV thermal ablation or phlebectomy.'},
  {id:10,cat:'Anatomy',type:'mc',q:'The popliteal fossa contains all of the following EXCEPT:',opts:['Popliteal artery and vein','Tibial nerve','Common peroneal nerve','Great saphenous vein'],ans:3,exp:'The GSV does NOT course through the popliteal fossa — that is the SSV/SPJ. The popliteal fossa contains the popliteal vessels, tibial nerve, common peroneal nerve, and the SSV joining the popliteal vein.'},
  {id:11,cat:'Anatomy',type:'mc',q:'On ultrasound, the "Egyptian Eye" or saphenous eye sign refers to:',opts:['The hypoechoic appearance of acute DVT','The fascial layers surrounding the GSV in the saphenous compartment','The appearance of the SFJ on transverse view','Dilated perforating vein with outward flow'],ans:1,exp:'The saphenous eye (Egyptian eye) describes the fascial envelope visible on ultrasound cross-section where the GSV sits within the saphenous compartment between the saphenous fascia and the deep muscular fascia.'},
  {id:12,cat:'Anatomy',type:'mc',q:'Which statement about the femoral triangle is correct?',opts:['It is bounded medially by the sartorius, laterally by the adductor longus, and superiorly by the inguinal ligament','Its roof is formed by the deep fascia only','The common femoral artery is medial to the common femoral vein','The femoral nerve is medial to all structures'],ans:0,exp:'The femoral triangle is bounded superiorly by the inguinal ligament, medially by the adductor longus, and laterally by the sartorius. Contents (lateral to medial): femoral nerve, femoral artery, femoral vein, and lymphatics/canal.'},
  {id:13,cat:'Anatomy',type:'ft',q:'Describe the typical anatomical course of the great saphenous vein (GSV) from the foot to the SFJ, including key landmarks.',modelAns:'The GSV originates from the medial dorsal venous arch of the foot, passes anterior to the medial malleolus, ascends along the medial aspect of the lower leg and thigh within the saphenous compartment, and terminates at the saphenofemoral junction (SFJ) approximately 3–4 cm inferior to the inguinal ligament where it drains into the common femoral vein. Key landmarks: medial malleolus (ankle), medial tibial border (lower leg), medial femoral condyle (knee), and the femoral triangle (thigh/groin).'},
  {id:14,cat:'Anatomy',type:'ft',q:'Explain why the "saphenous canal" (compartment/fascial eye) is clinically important during duplex ultrasound mapping.',modelAns:'The saphenous canal is the fascial compartment visible on US as the "saphenous eye" — it helps identify the true GSV versus superficial tributaries. The true GSV runs WITHIN this compartment (enclosed by the saphenous fascia above and muscular fascia below), whereas tributaries lie outside it in the subcutaneous fat. Correctly identifying the GSV in the compartment ensures the right vessel is targeted for treatment and prevents mistaking a tributary for the main trunk.'},
  {id:15,cat:'Anatomy',type:'mc',q:'Cockett perforators connect which vessels?',opts:['Deep tibial veins to the GSV','Posterior arch vein (Leonardo\'s vein) to the posterior tibial veins','GSV directly to the popliteal vein','SSV to the peroneal vein'],ans:1,exp:'Cockett perforators (I, II, III) connect the posterior arch vein (a tributary of the GSV) to the posterior tibial veins. They are located at the medial lower leg and are commonly incompetent in C4–C6 disease.'},
  {id:16,cat:'Anatomy',type:'mc',q:'What is the typical normal diameter of the GSV at the SFJ in a standing patient?',opts:['< 3 mm','3–6 mm','7–10 mm','> 12 mm'],ans:1,exp:'The normal GSV at the SFJ is typically 3–6 mm in standing position. Diameter ≥ 7–8 mm at the SFJ (though thresholds vary by institution) is generally considered dilated and associated with reflux.'},
  {id:17,cat:'Anatomy',type:'mc',q:'The anterolateral branch and the posteromedial branch are primary tributaries of which vein?',opts:['SSV','CFV','GSV','Popliteal vein'],ans:2,exp:'The anterolateral (anterolateral thigh/lateral branch) and posteromedial branches are major tributaries of the GSV that supply much of the varicose vein distribution seen clinically in the thigh.'},
  {id:18,cat:'Anatomy',type:'mc',q:'At the saphenopopliteal junction (SPJ), the SSV drains into which vessel?',opts:['Great saphenous vein','Common femoral vein','Popliteal vein','Posterior tibial vein'],ans:2,exp:'The SSV drains into the popliteal vein at the SPJ. The SPJ location varies (typically mid to upper popliteal fossa) and must be mapped precisely with duplex prior to SSV treatment.'},
  {id:19,cat:'Anatomy',type:'mc',q:'Which anatomical variant occurs when the SSV does NOT terminate in the popliteal vein but instead continues up the posterior thigh to join the GSV or deep femoral system?',opts:['AASV variant','Giacomini vein','Intersaphenous vein','Posterior circumflex vein'],ans:1,exp:'The Giacomini vein is the thigh extension of the SSV that bypasses the popliteal vein and continues superiorly to join the GSV thigh extension (posterior thigh tributary) or the deep femoral system. It is a common source of recurrent disease.'},
  {id:20,cat:'Anatomy',type:'ft',q:'What is the clinical significance of understanding perforator vein anatomy in advanced venous disease (CEAP C4–C6)?',modelAns:'In advanced chronic venous disease (C4–C6), incompetent perforators transmit high-pressure deep venous blood into the superficial system, perpetuating venous hypertension and contributing to lipodermatosclerosis, pigmentation, and ulceration. Identifying and treating pathologic perforators (particularly Cockett perforators in the medial gaiter zone) may be necessary when superficial reflux treatment alone fails to heal ulcers. Perforators with outward flow >500 ms duration and diameter ≥3.5 mm are generally considered pathologic and may warrant targeted treatment.'},

  // ── DUPLEX TECHNIQUE (20) ──
  {id:21,cat:'Duplex Technique',type:'mc',q:'What is the standard reflux duration threshold for diagnosing significant reflux in the SUPERFICIAL venous system (GSV, SSV)?',opts:['> 250 ms','> 500 ms','> 1000 ms','> 2000 ms'],ans:1,exp:'Reflux duration > 500 ms is the accepted threshold for pathologic reflux in superficial veins (GSV, SSV, AASV). This differs from the deep system threshold of > 1000 ms.'},
  {id:22,cat:'Duplex Technique',type:'mc',q:'What is the reflux duration threshold for diagnosing significant reflux in the DEEP venous system (femoral, popliteal)?',opts:['> 250 ms','> 500 ms','> 1000 ms','> 2000 ms'],ans:2,exp:'Reflux duration > 1000 ms (1 second) is the threshold for pathologic deep venous reflux (popliteal, femoral, iliac). Deep reflux is an important consideration when evaluating for combined superficial and deep disease.'},
  {id:23,cat:'Duplex Technique',type:'mc',q:'What is the preferred patient position for demonstrating venous reflux during duplex ultrasound?',opts:['Supine flat','Supine with legs elevated 30°','Standing or reverse Trendelenburg (30–45°)','Left lateral decubitus'],ans:2,exp:'Standing or reverse Trendelenburg position maximizes venous pooling and gravitational pressure, making reflux easier to elicit and demonstrating the full diameter of the vein. Supine exams underestimate reflux and diameter.'},
  {id:24,cat:'Duplex Technique',type:'mc',q:'Which augmentation technique is most commonly used to elicit reflux during duplex ultrasound in the lower extremity?',opts:['Valsalva maneuver only','Manual calf compression and release','Patient performing dorsiflexion','Tourniquet application'],ans:1,exp:'Manual calf (or foot) compression followed by release produces a retrograde pressure wave, provoking reflux in incompetent veins. The compression releases a "push" of blood toward the heart; upon release, incompetent valves allow backflow (reflux) which is measured in milliseconds.'},
  {id:25,cat:'Duplex Technique',type:'mc',q:'On color Doppler, what color coding convention is most commonly used and how does it apply to venous reflux?',opts:['Red = toward transducer; blue = away from transducer. Reflux appears red when probe is distal and blue when proximal','Blue always = venous flow, Red = arterial flow','Red = oxygenated, Blue = deoxygenated','Color is irrelevant for venous assessment'],ans:0,exp:'Color Doppler shows flow direction relative to the transducer: red = toward, blue = away (BART mnemonic). During compression, normal flow (toward the heart) appears in one color; reflux (retrograde) reverses to the other color. The actual color depends on probe orientation.'},
  {id:26,cat:'Duplex Technique',type:'mc',q:'When measuring GSV diameter for treatment planning, where should the measurement be taken?',opts:['At the SFJ only','Just below the SFJ (3–5 cm distal), in the mid-thigh, and below the knee in the saphenous canal, in a standing patient','At the most dilated visible varicosity','In the supine position at the mid-thigh only'],ans:1,exp:'GSV diameter should be measured at multiple standard points: just below SFJ, mid-thigh, knee level, and upper calf — all in standing or reverse Trendelenburg position. Measurements guide treatment eligibility, catheter sizing, and thermal vs. non-thermal selection.'},
  {id:27,cat:'Duplex Technique',type:'mc',q:'EHIT (endovenous heat-induced thrombus) is classified into 4 classes. Class 2 EHIT is defined as:',opts:['Thrombus at SFJ flush with CFV but not protruding','Thrombus extending into CFV but < 50% of the CFV lumen','Thrombus extending into CFV > 50% of the CFV lumen','Thrombus occluding the CFV completely'],ans:1,exp:'EHIT classification: Class 1 = thrombus at SFJ level, not entering CFV; Class 2 = extends into CFV < 50% occlusion; Class 3 = extends into CFV > 50% occlusion; Class 4 = complete CFV occlusion. Class 2+ warrants anticoagulation consideration.'},
  {id:28,cat:'Duplex Technique',type:'mc',q:'What ultrasound characteristic distinguishes ACUTE DVT from chronic venous changes in the femoral vein?',opts:['Acute DVT is hyperechoic; chronic is anechoic','Acute DVT is usually anechoic/hypoechoic and the vein is non-compressible; chronic DVT shows echogenic/heterogeneous material with wall thickening and may partially compress','Acute DVT compresses fully on probe pressure','Chronic DVT always has color flow visible'],ans:1,exp:'Acute DVT: typically anechoic to hypoechoic, vein is distended and NON-compressible — the hallmark finding. Chronic changes: hyperechoic, heterogeneous thrombus, wall thickening/fibrosis, partial compressibility, possible recanalization with color flow.'},
  {id:29,cat:'Duplex Technique',type:'mc',q:'How do you differentiate the true GSV from a superficial tributary on ultrasound?',opts:['GSV is always the largest vein visible superficially','GSV runs within the saphenous compartment (fascial canal); tributaries lie in subcutaneous fat outside this compartment','Color Doppler always shows the GSV in blue','GSV is identified by its location posterior to the tibial nerve'],ans:1,exp:'The GSV runs within the saphenous canal — visible as the "saphenous eye" on transverse B-mode. Tributaries lie in subcutaneous fat outside this fascial compartment. This distinction is critical to avoid treating a tributary rather than the truncal vein.'},
  {id:30,cat:'Duplex Technique',type:'mc',q:'A tourniquet placed below the SFJ during GSV reflux testing is used to:',opts:['Increase venous return to make the vein more visible','Isolate SFJ reflux from below-knee perforators to determine if SFJ is the source','Prevent vasovagal response during exam','Improve patient comfort'],ans:1,exp:'A thigh tourniquet isolates the SFJ segment. If GSV reflux below the SFJ disappears with tourniquet in place, the SFJ is the primary source. If reflux persists, perforators or other entry points (AASV, thigh perforators) may be contributing.'},
  {id:31,cat:'Duplex Technique',type:'mc',q:'What is the correct probe orientation when measuring reflux duration in the GSV at the mid-thigh?',opts:['Transverse (axial) plane for reflux measurement','Longitudinal (sagittal) plane with spectral Doppler gate placed in the center of the vein lumen','Any orientation is acceptable','Color Doppler only, no need for spectral'],ans:1,exp:'Reflux is measured using spectral Doppler in LONGITUDINAL orientation with the gate placed centrally in the lumen. Transverse view is useful for identification and diameter measurement but not for accurate spectral reflux timing.'},
  {id:32,cat:'Duplex Technique',type:'ft',q:'Describe the standard protocol for a complete lower extremity venous reflux study, including patient position, vessels examined, and documentation required.',modelAns:'Patient positioned standing or in reverse Trendelenburg (30–45°). Examine systematically: CFV, femoral vein (SFJ level through thigh), popliteal vein, GSV (SFJ to ankle with diameter measurements at SFJ, mid-thigh, knee, upper calf), AASV if visible, SSV (SPJ to lower leg with diameter), and any visible varicose tributaries or perforators. Reflux is elicited by calf compression/release (or Valsalva at groin). Measure reflux duration (>500 ms superficial, >1000 ms deep). Document: diameter measurements, reflux duration at each level, SFJ/SPJ competence, perforator location/direction, presence of thrombus. Bilateral comparison is standard.'},
  {id:33,cat:'Duplex Technique',type:'mc',q:'Which color Doppler setting is most important to optimize for a venous duplex study with low-velocity venous flow?',opts:['Increase pulse repetition frequency (PRF) to maximum','Decrease PRF (wall filter) to detect low-velocity flow; use appropriate scale','Use maximum gain to see all flow','Use only power Doppler, not color Doppler'],ans:1,exp:'Low PRF (low velocity scale) is essential for venous duplex because venous flow is much slower than arterial. High PRF misses slow venous flow. The wall filter should be set low to avoid filtering out true venous signals.'},
  {id:34,cat:'Duplex Technique',type:'mc',q:'When performing a post-procedure duplex following RFA of the GSV (typically 48–72 hours), what are you specifically evaluating?',opts:['Residual reflux only','EHIT at the SFJ, occlusion/closure of the treated segment, and presence of DVT','Only the treated vein diameter','Patient pain score and bruising pattern'],ans:1,exp:'The post-RFA duplex (48–72 hour) assesses: (1) EHIT — thrombus extension toward or into the CFV at the SFJ; (2) vein closure/occlusion of the treated segment; (3) new DVT in deep system; (4) any residual flow in the treated vein.'},
  {id:35,cat:'Duplex Technique',type:'ft',q:'Explain how you would identify and confirm EHIT Class 2 on post-RFA duplex ultrasound. What does this finding mean for management?',modelAns:'EHIT Class 2: On duplex, you visualize echogenic thrombus extending from the treated GSV stump through the SFJ and into the CFV lumen, occupying < 50% of the CFV cross-sectional diameter. Confirm by measuring the thrombus extension in multiple planes. Management: EHIT Class 2 is generally managed with anticoagulation (typically therapeutic-dose DOAC for 4–6 weeks) with repeat duplex in 1–2 weeks to confirm resolution rather than propagation. Class 1 may be monitored with serial ultrasound. Class 3–4 requires urgent anticoagulation and possible vascular surgery consultation.'},
  {id:36,cat:'Duplex Technique',type:'mc',q:'What ultrasound finding is the most reliable indicator of venous compressibility when ruling out DVT?',opts:['Presence of color flow','Spontaneous phasic flow on spectral Doppler','Complete collapse of the vein lumen with gentle transducer compression','Augmentation with distal compression'],ans:2,exp:'Complete collapse (full compressibility) of the vein lumen with gentle probe pressure is the PRIMARY test for ruling out DVT. A normal vein walls touch completely. Non-compressibility (vein walls do not touch) is the most sensitive and specific sign of DVT.'},
  {id:37,cat:'Duplex Technique',type:'mc',q:'The AASV can be confused with which other vessel during duplex ultrasound?',opts:['The SSV','The common femoral vein','A large tributaries of the anterior thigh or a varicose vein outside the saphenous canal','The deep femoral vein'],ans:2,exp:'The AASV lies outside the saphenous canal but within the saphenous fascia — it can be confused with prominent anterior thigh tributaries or varicose veins. Careful attention to the fascial layers and tracing the vessel proximally to its SFJ or GSV connection confirms identity.'},
  {id:38,cat:'Duplex Technique',type:'mc',q:'During venous duplex, "spontaneous flow" refers to:',opts:['Flow only detectable with augmentation','Continuous Doppler signal present without any compression maneuvers','Reflux visualized without valve stress testing','High-velocity flow indicating arteriovenous fistula'],ans:1,exp:'Spontaneous flow is venous flow detectable without augmentation. Its presence (especially in the femoral and popliteal veins) reflects normal venous filling. Absence of spontaneous flow can indicate proximal obstruction (iliocaval compression, DVT).'},
  {id:39,cat:'Duplex Technique',type:'mc',q:'What is the significance of finding bidirectional flow (to-and-fro) in a perforating vein on duplex?',opts:['This is always normal','Outward flow > 500 ms on release = incompetent perforator; bidirectional flow pattern is assessed by direction and duration','To-and-fro flow is diagnostic of DVT','It always indicates an AV fistula'],ans:1,exp:'Perforators normally have inward flow (superficial-to-deep) during calf compression. Incompetent perforators show outward flow (deep-to-superficial) on release lasting > 500 ms. A perforator ≥3.5 mm diameter with outward reflux > 500 ms is considered pathologic.'},
  {id:40,cat:'Duplex Technique',type:'mc',q:'When mapping for VenaSeal, what additional duplex consideration is important regarding vein diameter?',opts:['Vein must be > 12 mm for adequate glue distribution','The vein should ideally be 3–10 mm; very large veins (> 12 mm) may have higher recanalization rates','Vein diameter is not relevant for VenaSeal selection','VenaSeal is only used for veins < 3 mm'],ans:1,exp:'VenaSeal is generally used for GSV/SSV 3–12 mm diameter. Larger veins (>10–12 mm) may have reduced closure rates and some providers prefer thermal ablation or a combination approach for very large veins.'},

  // ── CLINICAL DECISION MAKING (20) ──
  {id:41,cat:'Clinical Decision Making',type:'mc',q:'A patient has visible varicose veins, edema, and early lipodermatosclerosis without active ulcer. What CEAP clinical class are they?',opts:['C2','C3','C4a','C4b'],ans:2,exp:'CEAP C4a = pigmentation or eczema; C4b = lipodermatosclerosis or atrophie blanche. This patient with lipodermatosclerosis without ulcer = C4b. C2 = varicose veins only; C3 = edema without skin changes; C5 = healed ulcer; C6 = active ulcer.'},
  {id:42,cat:'Clinical Decision Making',type:'mc',q:'Most commercial insurance policies require a minimum duration of conservative therapy (compression stockings) before authorizing vein treatment. What is the most commonly required minimum?',opts:['3 weeks','6 weeks','6–12 weeks (most common; payer dependent)','12 months'],ans:2,exp:'The most common requirement is 6–12 weeks of conservative therapy (compression stockings 20–30 mmHg or per payer spec). Some payers require only 3–6 weeks; others up to 3–6 months. Always verify per specific payer policy.'},
