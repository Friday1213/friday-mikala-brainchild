services:
  - type: web
    name: reservation-radar
    runtime: node
    buildCommand: npm install
    startCommand: node server.js
    disk:
      name: radar-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: DB_PATH
        value: /data/radar.db
      - key: NODE_ENV
        value: production
